/* ═══════════════════════════════════════
   CSS CUSTOM PROPERTIES (theme system)
═══════════════════════════════════════ */
:root {
  --bg:       #0f1117;
  --surface:  #1a1e2a;
  --card:     #222736;
  --border:   #2e3350;
  --text:     #eef0f8;
  --dim:      #7a80a0;
  --accent:   #f08c00;
  --green:    #3ecf6e;
  --greenDim: #1a2e1a;
  --blue:     #4a9eff;
  --blueDim:  #1e2232;
  --teal:     #00cfb4;
  --tealDim:  #003d37;
  --amber:    #ff8c00;
  --amberDim: #2e1a00;
  --red:      #ff5555;
  --warn:     #ffcc00;
  --purple:   #c084fc;
  --purpleDim:#1a0d2e;
  --gold:     #facc15;
}
.theme-light {
  --bg:       #f0f2f7;
  --surface:  #ffffff;
  --card:     #f8f9fc;
  --border:   #d0d5e8;
  --text:     #1a1e2a;
  --dim:      #6b7280;
  --accent:   #d97706;
  --green:    #16a34a;
  --greenDim: #dcfce7;
  --blue:     #2563eb;
  --blueDim:  #dbeafe;
  --teal:     #0d9488;
  --tealDim:  #ccfbf1;
  --amber:    #d97706;
  --amberDim: #fef3c7;
  --red:      #dc2626;
  --warn:     #ca8a04;
  --purple:   #7c3aed;
  --purpleDim:#ede9fe;
  --gold:     #ca8a04;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  color:var(--text);
  height:100%;
  overflow:hidden;
  transition: background .2s, color .2s;
}

.bb{font-family:Impact,sans-serif;letter-spacing:.08em;}

/* ── TEAM MANAGEMENT ── */
.tm{height:100dvh;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.tm-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-right, 0px) + 13px) 11px calc(env(safe-area-inset-left, 0px) + 13px);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tm-hdr-title{font-family:Impact,sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent);flex:1;}
.tm-back{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:2px 6px;}
.tm-add-btn{background:var(--accent);color:#111;border:none;border-radius:9px;padding:8px 14px;font-family:Impact,sans-serif;font-size:14px;letter-spacing:1px;cursor:pointer;}
.tm-body{flex:1;overflow-y:auto;padding:10px 12px;}
.tm-empty{text-align:center;color:var(--dim);font-size:13px;padding:40px 20px;line-height:1.8;}
.team-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
.team-card:active{opacity:.8;}
.team-card-name{font-family:Impact,sans-serif;font-size:20px;letter-spacing:1px;color:var(--accent);margin-bottom:3px;}
.team-card-meta{font-size:11px;color:var(--dim);margin-bottom:6px;}
.team-card-row{display:flex;align-items:center;justify-content:space-between;}
.team-card-players{font-size:11px;color:var(--green);}
.team-card-actions{display:flex;gap:6px;}
.tc-edit{background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;}
.tc-del{background:rgba(255,85,85,.1);border:1.5px solid rgba(255,85,85,.3);color:var(--red);border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;}

/* team edit form */
.te-body{flex:1;overflow-y:auto;padding:10px 12px 30px;}
.te-field{margin-bottom:12px;}
.te-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:5px;}
.te-input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;}
.te-input:focus{border-color:var(--accent);}
.te-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.te-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.te-footer{background:var(--surface);border-top:1px solid var(--border);padding:10px calc(env(safe-area-inset-right, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 12px);display:flex;gap:8px;flex-shrink:0;}
.te-save{flex:1;background:var(--accent);color:#111;font-family:Impact,sans-serif;font-size:20px;letter-spacing:2px;border:none;border-radius:10px;padding:13px;cursor:pointer;}
.te-cancel{background:var(--card);border:1.5px solid var(--border);color:var(--dim);font-family:Impact,sans-serif;font-size:16px;letter-spacing:1px;border-radius:10px;padding:13px 16px;cursor:pointer;}
.te-section-hdr{font-family:Impact,sans-serif;font-size:13px;letter-spacing:2px;color:var(--blue);border-bottom:1px solid var(--border);padding-bottom:5px;margin:16px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.te-add-player{width:100%;background:var(--blueDim);border:1.5px dashed var(--border);border-radius:9px;padding:10px;color:var(--blue);font-size:12px;cursor:pointer;text-align:center;margin-top:6px;}
.player-row{background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.player-row-info{flex:1;min-width:0;}
.player-row-name{font-size:13px;font-weight:700;color:var(--text);}
.player-row-sub{font-size:10px;color:var(--dim);margin-top:1px;}
.player-row-num{font-family:Impact,sans-serif;font-size:18px;color:var(--accent);letter-spacing:.05em;flex-shrink:0;}
.player-row-edit{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:4px;}
.player-row-del{background:none;border:none;color:rgba(255,85,85,.5);font-size:16px;cursor:pointer;padding:4px;}
.player-edit-panel{background:var(--surface);border:1.5px solid var(--blue);border-radius:10px;padding:10px 11px;margin-bottom:6px;}
.pep-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
.pep-input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px;outline:none;}
.pep-input:focus{border-color:var(--blue);}
.pep-row{display:flex;gap:7px;}
.pep-save{flex:1;background:#3ecf6e;color:#0a1a0a;font-family:Impact,sans-serif;font-size:15px;letter-spacing:1px;border:none;border-radius:8px;padding:9px;cursor:pointer;}
.pep-cancel{background:#2e3350;border:none;color:#7a80a0;font-size:13px;border-radius:8px;padding:9px 13px;cursor:pointer;}

/* team selector in setup */
.team-selector{background:#1a1e2a;border:1.5px solid #2e3350;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;cursor:pointer;}
.ts-info{flex:1;min-width:0;}
.ts-name{font-family:Impact,sans-serif;font-size:16px;letter-spacing:1px;color:#f08c00;}
.ts-meta{font-size:10px;color:#7a80a0;margin-top:1px;}
.ts-arrow{color:#7a80a0;font-size:16px;flex-shrink:0;}
.team-select-dropdown{background:#1a1e2a;border:1.5px solid #2e3350;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.tsd-item{padding:11px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid #2e3350;}
.tsd-item:last-child{border-bottom:none;}
.tsd-item:active{background:#222736;}
.tsd-item.active{background:#1a2e1a;}
.tsd-name{font-family:Impact,sans-serif;font-size:14px;letter-spacing:1px;color:#f08c00;flex:1;}
.tsd-meta{font-size:10px;color:#7a80a0;}
.tsd-check{color:#3ecf6e;font-size:16px;flex-shrink:0;}
.opponent-input{width:100%;background:#222736;border:1.5px solid #2e3350;border-radius:9px;padding:10px 12px;color:#eef0f8;font-size:14px;outline:none;margin-top:0;}
.opponent-input:focus{border-color:#4a9eff;}

/* ── EXPORT MODAL ── */
.export-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;display:flex;align-items:flex-end;padding:0;backdrop-filter:blur(3px);}
.export-modal-box{background:var(--surface);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 16px 30px;width:100%;max-height:70vh;display:flex;flex-direction:column;gap:12px;}
.export-modal-title{font-family:Impact,sans-serif;font-size:20px;letter-spacing:2px;color:var(--accent);}
.export-modal-sub{font-size:12px;color:var(--dim);margin-top:-6px;}
.export-textarea{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:10px;color:var(--text);font-family:monospace;font-size:11px;resize:none;min-height:120px;outline:none;}
.export-btns{display:flex;gap:8px;}
.export-share-btn{flex:1;background:var(--accent);color:#111;font-family:Impact,sans-serif;font-size:17px;letter-spacing:1px;border:none;border-radius:10px;padding:12px;cursor:pointer;}
.export-copy-btn{flex:1;background:var(--card);border:1.5px solid var(--border);color:var(--text);font-family:Impact,sans-serif;font-size:17px;letter-spacing:1px;border-radius:10px;padding:12px;cursor:pointer;}
.export-cancel-btn{background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:4px;text-align:center;width:100%;}

/* ── CONFIRMATION MODAL ── */
.confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);}
.confirm-box{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:24px 20px;max-width:320px;width:100%;text-align:center;}
.confirm-title{font-family:Impact,sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:8px;}
.confirm-title.danger{color:var(--red);}
.confirm-title.warn{color:var(--amber);}
.confirm-body{font-size:13px;color:var(--dim);margin-bottom:20px;line-height:1.6;}
.confirm-btns{display:flex;gap:10px;}
.confirm-cancel{flex:1;background:var(--card);border:1.5px solid var(--border);color:var(--text);font-family:Impact,sans-serif;font-size:18px;letter-spacing:1px;border-radius:10px;padding:12px;cursor:pointer;}
.confirm-ok{flex:1;border:none;font-family:Impact,sans-serif;font-size:18px;letter-spacing:1px;border-radius:10px;padding:12px;cursor:pointer;}
.confirm-ok.danger{background:var(--red);color:#fff;}
.confirm-ok.warn{background:var(--amber);color:#111;}

/* ── SETTINGS SCREEN ── */

/* ── STEPPER ── */

/* ── TABLET / IPAD SCALING ── */
/* Applies to screens >= 768px wide (iPad portrait and larger) */
@media (min-width: 768px) {

  /* Game header — bigger clocks and labels */
  .gclock { font-size: 46px; }
  .hrem   { font-size: 42px; }
  .stimer { font-size: 20px; }
  .glbl   { font-size: 11px; letter-spacing: 1.5px; }
  .hbadge { font-size: 13px; padding: 3px 9px; }

             padding-bottom: 10px; gap: 10px; }

  .target-lbl  { font-size: 12px; }

  .abar { font-size: 18px; padding: 8px; }

  .subbar-info { font-size: 14px; }
  .sub-go  { font-size: 20px; padding: 11px 18px; }
  .sub-clr { font-size: 14px; padding: 9px 12px; }

  /* Column headers */
  .chdr { font-size: 14px; padding: 5px; letter-spacing: 2.5px; }

  /* All cards scale on iPad */
  .pc { border-radius: 14px; padding: 11px 14px; }
  /* bench-card height now set by JS --card-h */
  .pc.court-card .cname { font-size: clamp(15px, 2.8vh, 28px); }
  .pc.court-card .sv    { font-size: clamp(16px, 3vh, 30px); }
  .pc.court-card .sk    { font-size: clamp(9px,  1.4vh, 14px); }
  .pc.court-card .fd    { width: clamp(26px, 4vh, 38px); height: clamp(26px, 4vh, 38px); }
  .cname { font-size: clamp(13px, 2vh, 20px); }
  .sv    { font-size: clamp(14px, 2.1vh, 22px); }
  .sk    { font-size: clamp(8px,  1.2vh, 13px); }
  .col   { gap: 5px; padding: 6px 8px; }

  /* Instruction bar */
  .instr { font-size: 13px; padding-top: 7px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 7px); }
}

/* Extra boost for iPad landscape / large tablets */
@media (min-width: 1024px) {
  .gclock { font-size: 58px; }

  .stimer { font-size: 24px; }
  .pbtn   { font-size: 24px; padding: 14px 24px; min-width: 160px; }

}

/* ── AI PLAN PARAMETERS ── */
.ai-params-box{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px 12px 8px;margin-top:8px;}
/* Each param: label row + slider row, stacked vertically */
.aip{margin-bottom:14px;}

/* Touch-friendly slider: tall element, thin visual track */
.ai-pslider{

/* ── TIMELINE MODAL ── */

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const APP_VERSION = '2026.05.26.4';
const COURT_SIZE = 5;
const TEAMS_KEY = 'squadmgr_teams_v1';
const SETTINGS_KEY = 'squadmgr_settings_v1';
const PLANS_KEY = 'squadmgr_plans_v1';
// ── Saved Sub Plans store ──
const P = {
  plans: [], // [{id, name, createdAt, players, h1Dur, h2Dur, h1Int, h2Int, h1Sps, h2Sps, subPlan:{h1,h2}}]
};

function savePlans(){
  try{
    // Serialise Sets to arrays
    const out=P.plans.map(p=>({
      ...p,
      subPlan:{
        h1:(p.subPlan.h1||[]).map(s=>s?{off:[...s.off],on:[...s.on],atTime:s.atTime||null}:null),
        h2:(p.subPlan.h2||[]).map(s=>s?{off:[...s.off],on:[...s.on],atTime:s.atTime||null}:null),
      }
    }));
    localStorage.setItem(PLANS_KEY, JSON.stringify(out));
  }catch(_){}
}

function loadPlans(){
  try{
    const raw=localStorage.getItem(PLANS_KEY);
    if(!raw) return;
    const arr=JSON.parse(raw)||[];
    P.plans=arr.map(p=>({
      ...p,
      subPlan:{
        h1:(p.subPlan.h1||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on)}:null),
        h2:(p.subPlan.h2||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on)}:null),
      }
    }));
  }catch(_){}
}

function saveCurrentPlan(name){
  if(!name||!name.trim()) return;
  const plan={
    id: uid(),
    name: name.trim(),
    createdAt: new Date().toLocaleString(),
    players: [...S.names.filter(n=>n.trim())],
    h1Dur:S.h1Dur, h2Dur:S.h2Dur,
    h1Int:S.h1Int, h2Int:S.h2Int,
    h1Sps:S.h1Sps, h2Sps:S.h2Sps,
    subPlan:{
      h1:(S.subPlan.h1||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on),atTime:s.atTime||null}:null),
      h2:(S.subPlan.h2||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on),atTime:s.atTime||null}:null),
    }
  };
  P.plans.unshift(plan); // newest first
  savePlans();
  return plan.id;
}

function loadPlan(id){
  const plan=P.plans.find(p=>p.id===id);
  if(!plan) return;
  S.subPlan={
    h1:(plan.subPlan.h1||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on),atTime:s.atTime||null}:null),
    h2:(plan.subPlan.h2||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on),atTime:s.atTime||null}:null),
  };
  S.h1Dur=plan.h1Dur; S.h2Dur=plan.h2Dur;
  S.h1Int=plan.h1Int; S.h2Int=plan.h2Int;
  S.h1Sps=plan.h1Sps; S.h2Sps=plan.h2Sps;
  S.useSubPlan=true;
  renderSetup(true);
  // Show brief confirmation
  showToast(`Plan "${plan.name}" loaded`);
}

function deletePlan(id){
  P.plans=P.plans.filter(p=>p.id!==id);
  savePlans();
  renderSetup(true);
}

// ── Sub Plan Export / Import ──
function exportSubPlan(){
  const filtered=S.names.filter(n=>n.trim());
  if(!S.useSubPlan||(!(S.subPlan.h1||[]).length&&!(S.subPlan.h2||[]).length)){
    alert('No sub plan to export. Build a plan first.');return;
  }
  function serHalf(half){
    return (half||[]).map(s=>({off:[...s.off],on:[...s.on],atTime:s.atTime||null}));
  }
  const data={version:1,exportedAt:new Date().toISOString(),
    playerNames:filtered,h1Dur:S.h1Dur,h2Dur:S.h2Dur,h1Int:S.h1Int,h2Int:S.h2Int,
    h1Sps:S.h1Sps,h2Sps:S.h2Sps,
    h1:serHalf(S.subPlan.h1),h2:serHalf(S.subPlan.h2),
    priorityPlayerIds:[...S.priorityPlayerIds],
    h2PresetIds:S.useH2Preset?[...S.h2PresetIds]:null,
    finalPresetIds:S.useFinalPreset?[...S.finalPresetIds]:null};
  const jsonStr=JSON.stringify(data,null,2);
  const date=new Date().toLocaleDateString('en-AU').replace(/\//g,'-');
  const filename='squad-plan-'+date+'.json';
  if(navigator.share){
    const blob=new Blob([jsonStr],{type:'application/json'});
    const file=new File([blob],filename,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Squad Manager Sub Plan'}).catch(()=>{});return;
    }
  }
  const url='data:application/json;charset=utf-8,'+encodeURIComponent(jsonStr);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  showToast('Sub plan exported ✓');
}

function importSubPlanFile(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json,text/plain';
  inp.onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.h1||!data.h2)throw new Error('Invalid plan file');
        applyImportedSubPlan(data);
      }catch(err){alert('Could not load plan: '+err.message);}
    };
    r.readAsText(f);
  };
  inp.click();
}

function applyImportedSubPlan(data){
  const filtered=S.names.filter(n=>n.trim());
  const nameToIdx={};filtered.forEach(function(n,i){nameToIdx[n]=i;});
  function findIdx(name){
    if(nameToIdx[name]!==undefined)return nameToIdx[name];
    const lower=String(name).toLowerCase();
    for(const[n,i]of Object.entries(nameToIdx)){
      if(n.toLowerCase()===lower)return i;
      if(n.toLowerCase().startsWith(lower)||lower.startsWith(n.split(' ')[0].toLowerCase()))return i;
    }
    return undefined;
  }
  function mapHalf(half){
    return(half||[]).map(function(s){return{
      off:new Set((s.off||[]).map(findIdx).filter(function(i){return i!==undefined;})),
      on: new Set((s.on||[]).map(findIdx).filter(function(i){return i!==undefined;})),
      atTime:s.atTime||null};});  // atTime already handled;
  }
  if(data.h1Dur)S.h1Dur=data.h1Dur;if(data.h2Dur)S.h2Dur=data.h2Dur;
  if(data.h1Int)S.h1Int=data.h1Int;if(data.h2Int)S.h2Int=data.h2Int;
  S.subPlan={h1:mapHalf(data.h1),h2:mapHalf(data.h2)};
  S.useSubPlan=true;
  if(data.priorityPlayerIds&&data.priorityPlayerIds.length){
    S.priorityPlayerIds=new Set(data.priorityPlayerIds.map(findIdx).filter(function(i){return i!==undefined;}));
  }
  if(data.h2PresetIds){
    const ids=data.h2PresetIds.map(findIdx).filter(function(i){return i!==undefined;});
    if(ids.length===COURT_SIZE){S.h2PresetIds=new Set(ids);S.useH2Preset=true;}
  }
  if(data.finalPresetIds){
    const ids=data.finalPresetIds.map(findIdx).filter(function(i){return i!==undefined;});
    if(ids.length===COURT_SIZE){S.finalPresetIds=new Set(ids);S.useFinalPreset=true;}
  }
  saveState();renderSetup(true);
  showToast('Sub plan imported ✓');
}

// ── Audio & Haptics ──
// Single shared AudioContext — must be created/resumed on a user gesture
let _audioCtx = null;

function getAudioCtx(){
  if(!_audioCtx){
    try { _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){ return null; }
  }
  // iOS suspends the context if it wasn't created during a user gesture — resume it
  if(_audioCtx.state === 'suspended'){
    _audioCtx.resume().catch(()=>{});
  }
  return _audioCtx;
}

// Unlock audio on first user touch — call this on any tap before the game starts
function unlockAudio(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
  // Play a silent buffer to fully unlock on iOS
  try {
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch(_){}
}

function playDing(n=1){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try {
    for(let i=0; i<n; i++){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      const t = ctx.currentTime + i * 0.48;
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(660, t + 0.18);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.45, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
      o.start(t); o.stop(t + 0.42);
    }
  } catch(_){}
}

// Haptics — navigator.vibrate works on Android; iOS ignores it silently
// For iOS we play a very short silent click sound as a substitute
function vibrate(pattern){
  try { navigator.vibrate && navigator.vibrate(pattern); } catch(_){}
  // iOS haptic substitute: silent audio click
  const ctx = getAudioCtx();
  if(!ctx) return;
  try {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, ctx.currentTime); // near-silent
    g.connect(ctx.destination);
    const o = ctx.createOscillator();
    o.connect(g);
    o.frequency.value = 1;
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.001);
  } catch(_){}
}

let tickInterval=null;
let prevAlert=null;

// ── League format detection ──
function getActiveLeague(){
  const team = T.teams.find(t=>t.id===T.activeTeamId);
  return ((team&&team.league)||'').toUpperCase().trim();
}
function isEDJBL(){ const l=getActiveLeague(); return l.includes('EDJBL')||l.includes('EDJ'); }
function isVJBL(){  const l=getActiveLeague(); return l.includes('VJBL'); }
function isEDL(){   const l=getActiveLeague(); return l.includes('EDL')&&!l.includes('EDJBL'); }
function usesQuarters(){ return isVJBL()||isEDL(); }

// During a timeout:
// EDJBL: game clock keeps running; player clocks stop. EXCEPT last 2min of H2 → everything stops.
// VJBL/EDL: everything stops.
function isGameClockStoppedOnTimeout(){
  if(usesQuarters()) return true;  // VJBL/EDL: clock always stops
  // EDJBL: only stop in last 2min of 2nd half
  if(S.phase==='h2'){
    const halfRem = getHalfDur() - S.halfTime;
    return halfRem <= 120;  // last 2 minutes
  }
  return false; // EDJBL: clock keeps going in H1 and most of H2
}

// Current quarter label for display
function getCurrentQuarter(){
  if(!usesQuarters()) return S.phase==='h2'?'H2':'H1';
  if(S.phase==='h1') return S.q1BreakDone ? 'Q2' : 'Q1';
  if(S.phase==='h2') return S.q3BreakDone ? 'Q4' : 'Q3';
  if(S.phase==='q1break') return 'QT';
  if(S.phase==='q3break') return 'QT';
  return S.phase==='h2'?'H2':'H1';
}
// Quarter break time within a half (midpoint)
function getQuarterBreakTime(){ return Math.round(getHalfDur()/2); }

// Each half duration — for quarter teams always 20 min (2×10min) regardless of stored h1Dur/h2Dur
function getHalfDur(){
  if(usesQuarters()) return 20*60;
  return (S.phase==='h2'||S.phase==='q3break'?S.h2Dur:S.h1Dur)*60;
}
// Total game seconds — always 40min for quarter teams regardless of stored h1Dur/h2Dur
function gameTotalSecs(){ return usesQuarters() ? 40*60 : (S.h1Dur+S.h2Dur)*60; }
function getSubInt(){  return S.phase==='h2'?S.h2Int:S.h1Int; }  // already in seconds
function getCurrSps(){ return S.phase==='h2'?S.h2Sps:S.h1Sps; }

function setAlert(a){
  if(a===prevAlert) return;
  prevAlert=a;
  S.alertState=a;
  if(a==='warning'){ playDing(1); vibrate([150,80,150]); }
  if(a==='sub-now'){ playDing(2); vibrate([200,100,200,100,400]); flashScreen('sub'); }
  if(a==='halfend'){ playDing(3); vibrate([300,100,300,100,300,100,500]); flashScreen('half'); }
  if(a==='quartend'){ playDing(2); vibrate([200,100,200]); flashScreen('half'); }
  updateAlertBar();
}

function startTick(){
  stopTick();
  tickInterval=setInterval(doTick,1000);
}
function stopTick(){
  if(tickInterval){ clearInterval(tickInterval); tickInterval=null; }
}

function doTick(){
  if(!S.isRunning && !S.isClockRunning) return;
  const isH2=S.phase==='h2';

  // Game clock and sub countdown tick if isClockRunning
  if(S.isClockRunning){
    S.gameTime++;
    S.halfTime++;
    S.subCountdown--;
  }

  // Player timers only tick if isRunning (player clocks stop on EDJBL timeout)
  if(S.isRunning){
    S.players.forEach(p=>{
      if(p.onCourt){
        p.playTime++; p.benchStint=0;
        if(!isH2) p.h1PlayTime++; else p.h2PlayTime++;
      } else {
        p.benchTime++; p.benchStint++;
      }
    });
  }

  // Sub countdown (only when clock is running)
  if(!S.isClockRunning) { updateTimerDOM(); return; }
  if(S.subCountdown<=0){
    S.subCountdown=getSubInt();
    if(S.alertState!=='halfend') setAlert('sub-now');
    else updateAlertBar();
  } else if(S.subCountdown<=30){
    if(S.alertState!=='halfend'&&S.alertState!=='sub-now') setAlert('warning');
  } else {
    if(S.alertState!=='halfend'&&S.alertState!=='sub-now') setAlert(null);
  }

  // Quarter time alert (VJBL/EDL) — signal coach to end quarter manually
  if(usesQuarters()){
    const qbTime = getQuarterBreakTime();
    if(S.phase==='h1' && !S.q1BreakDone && S.halfTime===qbTime) setAlert('quartend');
    if(S.phase==='h2' && !S.q3BreakDone && S.halfTime===qbTime) setAlert('quartend');
  }

  // Half / game end
  if(S.halfTime===getHalfDur()) setAlert('halfend');

  updateTimerDOM();
}

function calcForecast(){
  const active=S.players.filter(p=>p.fouls<5);
  const aCount=active.length||1;
  const totalSecs=gameTotalSecs();
  const targetTime=Math.round(totalSecs*COURT_SIZE/aCount);
  const halfRem=getHalfDur()-S.halfTime;
  // For quarters: remaining = current period remaining + future periods
  const qBreakInH1 = usesQuarters()&&S.phase==='h1'&&!S.q1BreakDone;
  const h1Remaining = S.phase==='h1'?halfRem:0;
  const halfDurSecs = getHalfDur();
  const h2Remaining = S.phase==='h2'?halfRem:halfDurSecs;
  const gameRem = h1Remaining + h2Remaining;
  const remPP=Math.round(gameRem*COURT_SIZE/aCount);
  return {targetTime, remPP};
}

function fcColor(fc,target){
  if(fc>=target) return '#3ecf6e';
  if(fc>=target*0.85) return '#ffcc00';
  return '#ff5555';
}

function updateTimerDOM(){
  const halfRem=getHalfDur()-S.halfTime;
  const subC=S.alertState==='sub-now'?'#ff5555':S.alertState==='warning'?'#ffcc00':'#eef0f8';
  const halfC=halfRem<=60?'#ff5555':halfRem<=120?'#ffcc00':'#eef0f8';

  setText('gclock', fmt(S.gameTime));
  const hremEl=$('hrem');
  if(hremEl){ hremEl.textContent=halfRem>=0?fmt(halfRem):'+'+fmt(-halfRem); hremEl.style.color=halfC; }
  const scEl=$('scdown');
  if(scEl){ scEl.textContent=fmt(S.subCountdown); scEl.style.color=subC; }

  const {targetTime,remPP}=calcForecast();
  S.players.forEach(p=>{
    setText('pt-'+p.id, fmt(p.playTime));
    setText('bt-'+p.id, fmt(p.benchTime));
    setText('bs-'+p.id, fmt(p.benchStint));
    const fcEl=$('fc-'+p.id);
    if(fcEl&&p.fouls<5){
      const fc=p.playTime+remPP;
      fcEl.textContent=fmt(fc);
      fcEl.style.color=fcColor(fc,targetTime);
    }
  });
}

function updateAlertBar(){
  const el=$('alert-bar');
  if(!el) return;
  if(S.alertState==='warning'){  el.className='abar warn'; el.textContent='⏱ SUB IN 30 SECONDS'; el.style.display='block'; }
  else if(S.alertState==='sub-now'){ el.className='abar now'; el.textContent='🔔 TIME TO SUBSTITUTE!'; el.style.display='block'; }

// ── Sub Plan Helpers ──
function getCourtAtPlanPoint(halfKey, subIdx){
  const filtered=S.names.filter(n=>n.trim());
  let courtIds;
  if(halfKey==='h2'&&S.useH2Preset&&S.h2PresetIds.size===COURT_SIZE){
    courtIds=new Set(S.h2PresetIds);
  } else {
    courtIds=new Set(filtered.slice(0,COURT_SIZE).map((_,i)=>i));
  }
  const plan=S.subPlan[halfKey]||[];
  for(let i=0;i<subIdx;i++){
    const sub=plan[i];
    if(sub){ sub.off.forEach(id=>courtIds.delete(id)); sub.on.forEach(id=>courtIds.add(id)); }
  }
  return courtIds;
}

function getPlanHighlights(){
  // Final-5 always shows regardless of showPlanned toggle
  if(S.useFinalPreset && S.finalPresetIds.size===COURT_SIZE && S.phase==='h2'){
    const halfSecs=getHalfDur();
    const numSubs=Math.max(0,Math.ceil(halfSecs/S.h2Int)-1);
    if(S.planSubIdx>=numSubs-1){
      const finalIds=S.finalPresetIds;
      const courtIds=new Set(courtPlayers().map(p=>p.id));
      const off=new Set([...courtIds].filter(id=>!finalIds.has(id)));
      const on=new Set([...finalIds].filter(id=>!courtIds.has(id)));
      if(off.size>0||on.size>0) return {off, on, isFinal:true};
    }
  }
  if(!S.useSubPlan || !S.showPlanned) return null;
  const halfKey=S.phase==='h2'?'h2':'h1';
  const plan=S.subPlan[halfKey]||[];
  const sub=plan[S.planSubIdx];
  if(!sub||(!sub.off.size&&!sub.on.size)) return null;
  return {off:sub.off, on:sub.on, isFinal:false};
}

function planToggle(halfKey, subIdx, pid, role){
  if(!S.subPlan[halfKey]) S.subPlan[halfKey]=[];
  if(!S.subPlan[halfKey][subIdx]) S.subPlan[halfKey][subIdx]={off:new Set(),on:new Set()};
  const sub=S.subPlan[halfKey][subIdx];
  if(role==='court'){ sub.off.has(pid)?sub.off.delete(pid):sub.off.add(pid); }
  else              { sub.on.has(pid) ?sub.on.delete(pid) :sub.on.add(pid);  }
  renderSetup(true);
}

function planClear(halfKey, subIdx){
  if(S.subPlan[halfKey]&&S.subPlan[halfKey][subIdx])
    S.subPlan[halfKey][subIdx]={off:new Set(),on:new Set()};
  renderSetup(true);
}

function calcPlanPlayTimes(){
  // Returns {name, secs}[] estimating each player's total court time across both halves
  const filtered=S.names.filter(n=>n.trim());
  if(filtered.length<COURT_SIZE) return [];

  const playSecs=filtered.map(()=>0);

  const simHalf=(halfKey,dur,intv)=>{
    let courtIds;
    if(halfKey==='h2'&&S.useH2Preset&&S.h2PresetIds.size===COURT_SIZE)
      courtIds=new Set(S.h2PresetIds);
    else
      courtIds=new Set(filtered.slice(0,COURT_SIZE).map((_,i)=>i));

    const plan=S.subPlan[halfKey]||[];
    const halfSecs=dur*60;

    // Build sub timeline: use atTime from sub object if present, otherwise use interval
    function parseAtTime(t){
      if(!t) return null;
      const parts=String(t).split(':');
      const secs=parseInt(parts[0])*60+(parseInt(parts[1])||0);
      return isNaN(secs)?null:secs;
    }

    // Build list of sub events with their actual times
    const events=[];
    const numSubs=Math.max(0, Math.ceil(halfSecs/intv)-1);
    for(let i=0;i<numSubs;i++){
      const sub=plan[i];
      if(!sub) continue;
      // Use AI atTime if available and valid, else fall back to interval
      const atTimeSecs = sub.atTime ? parseAtTime(sub.atTime) : null;
      const fallback = (i+1)*intv;
      const t = (atTimeSecs && atTimeSecs>0 && atTimeSecs<halfSecs) ? atTimeSecs : fallback;
      events.push({t, sub});
    }
    // Sort by time in case AI returned out-of-order
    events.sort((a,b)=>a.t-b.t);

    // Simulate stints
    let prevTime=0;
    for(const ev of events){
      const stint=ev.t-prevTime;
      if(stint>0) courtIds.forEach(id=>{ if(id<playSecs.length) playSecs[id]+=stint; });
      ev.sub.off.forEach(id=>courtIds.delete(id));
      ev.sub.on.forEach(id=>courtIds.add(id));
      prevTime=ev.t;
    }
    // Final stint to end of half
    const finalStint=halfSecs-prevTime;
    if(finalStint>0) courtIds.forEach(id=>{ if(id<playSecs.length) playSecs[id]+=finalStint; });
  };

  simHalf('h1',S.h1Dur,S.h1Int);
  simHalf('h2',S.h2Dur,S.h2Int);
  return filtered.map((name,i)=>({name, secs:playSecs[i]||0}));
}

// Get primary position label for a player by display name
function posLabelForName(name){
  const team = T.teams.find(t=>t.id===T.activeTeamId);
  if(!team) return null;
  const player = team.players.find(p=>playerDisplayName(p)===name);
  if(!player) return null;
  const r = getPlayerRatings(T.activeTeamId, player.id);
  if(r.position === undefined) return null;
  return POS_SHORT[parseInt(r.position)] || null;
}

// Get all positions (primary + alts) for a player name
function allPositionsForName(name){
  const team = T.teams.find(t=>t.id===T.activeTeamId);
  if(!team) return [];
  const player = team.players.find(p=>playerDisplayName(p)===name);
  if(!player) return [];
  const r = getPlayerRatings(T.activeTeamId, player.id);
  const positions = [];
  if(r.position !== undefined) positions.push(POS_SHORT[parseInt(r.position)]);
  if(r.position2 && parseInt(r.position2)>0) positions.push(POS_SHORT[parseInt(r.position2)-1]);
  if(r.position3 && parseInt(r.position3)>0) positions.push(POS_SHORT[parseInt(r.position3)-1]);
  return positions.filter(Boolean);
}

  const covered = {};  // pos → playerId

  S.players.filter(p=>p.onCourt).forEach(p=>{

    if(pos && !covered[pos]) covered[pos] = p.id;

// ── Optimal Position Assignment ──
// Greedy bipartite matching: given a list of playerIds, assign positions 1-5
// such that as many positions as possible are covered, preferring primary over alts.
function computeOptimalPositions(playerIds){
  const assignment = {};  // pid → assigned position string
  const taken = {};       // position → pid

  // Build preference lists: primary first, then alts
  const prefs = {};
  playerIds.forEach(pid=>{
    const all = allPositionsForPlayer(pid);
    const primary = posLabelForPlayer(pid);
    const alts = all.filter(p=>p!==primary);
    prefs[pid] = primary ? [primary, ...alts] : alts;
  });

  // Pass 1: assign primary positions (no conflicts)
  playerIds.forEach(pid=>{
    const primary = prefs[pid][0];
    if(primary && !taken[primary]){
      assignment[pid] = primary;
      taken[primary] = pid;
    }
  });

  // Pass 2: assign players who didn't get their primary
  // try each of their alts, displacing lower-priority assignments if needed
  playerIds.forEach(pid=>{
    if(assignment[pid]) return;
    const myPrefs = prefs[pid];
    for(const pos of myPrefs){
      if(!taken[pos]){
        assignment[pid] = pos;
        taken[pos] = pid;
        break;
      }
    }
  });

  // Pass 3: players still unassigned — try displacing someone whose primary is available elsewhere
  playerIds.forEach(pid=>{
    if(assignment[pid]) return;
    const myPrefs = prefs[pid];
    for(const pos of myPrefs){
      const incumbent = taken[pos];
      if(!incumbent) continue;
      // Can the incumbent move to another position?
      const incumbentPrefs = prefs[incumbent].filter(p=>p!==pos && !taken[p]);
      if(incumbentPrefs.length > 0){
        // Move incumbent
        delete assignment[incumbent];
        taken[incumbentPrefs[0]] = incumbent;
        assignment[incumbent] = incumbentPrefs[0];
        // Give pos to pid
        assignment[pid] = pos;
        taken[pos] = pid;
        break;
      }
    }
  });

  return assignment;  // pid → position, may not cover all 5 if not enough range
}

// Apply optimal position assignment to S.gamePositions for current court players
function recomputeCourtPositions(){
  const courtIds = S.players.filter(p=>p.onCourt).map(p=>p.id);
  if(!courtIds.length) return;
  const optimal = computeOptimalPositions(courtIds);
  // Merge into gamePositions — only override if player hasn't been manually set
  // We track manual overrides separately
  if(!S.manualPositions) S.manualPositions = {};
  courtIds.forEach(pid=>{
    if(!S.manualPositions[pid]){
      if(optimal[pid]) S.gamePositions[pid] = optimal[pid];
    }
  });
}

  const all = allPositionsForPlayer(pid);

  const optimal = computeOptimalPositions(courtPlayerIds);
  return optimal[pid] || null;
}

function posChipBadge(name){
  const pos = posLabelForName(name);
  return pos ? ' <span style="font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(74,158,255,.18);color:#7ab8ff;letter-spacing:.5px">'+pos+'</span>' : '';
}

// Small position badge HTML (used in game cards)
function posBadgeHTML(label, style){
  if(!label) return '';
  return '<span style="font-size:8px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:4px;background:rgba(74,158,255,.18);color:#7ab8ff;'+(style||'')+'">'+label+'</span>';
}

function lineupCardHTML(names, bgColor, borderColor, labelColor, label){
  // Compact lineup display card used for starting/finishing 5
  if(!names||!names.length) return '';
  const chips = names.map(nm=>{
    const pos = posLabelForName(nm);
    const pb = pos?`<span style="font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(255,255,255,.12);color:${labelColor}">${pos}</span>`:'';
    return `<div style="font-size:11px;font-weight:700;color:var(--text);padding:3px 7px;background:rgba(255,255,255,.06);border-radius:6px;display:flex;align-items:center;gap:4px;">${nm.split(' ')[0]}${pb}</div>`;
  }).join('');
  const covered = coveredPositions(names);
  const missing = ['1','2','3','4','5'].filter(p=>!covered.has(p));
  const anyRatings = names.some(n=>allPositionsForName(n).length>0);
  const posNote = anyRatings
    ? (missing.length ? `<span style="font-size:9px;color:var(--warn)">Missing: ${missing.join(', ')}</span>` : `<span style="font-size:9px;color:var(--green)">✓ All positions covered</span>`)
    : '';
  return `<div style="background:${bgColor};border:1.5px solid ${borderColor};border-radius:9px;padding:8px 10px;margin-bottom:8px;">
    <div style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:${labelColor};margin-bottom:6px;">${label}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:${posNote?'5':'0'}px;">${chips}</div>
    ${posNote?`<div>${posNote}</div>`:''}
  </div>`;
}

function buildSubPlanHTML(){
  if(!S.useSubPlan) return '';
  const filtered=S.names.filter(n=>n.trim());
  if(filtered.length<COURT_SIZE)
    return '<div style="color:var(--dim);font-size:11px;padding:4px">Add at least 5 players to build a plan</div>';

  // Playing time summary
  const planTimes=calcPlanPlayTimes();
  const fairSecs = gameTotalSecs()*COURT_SIZE/filtered.length;
  const summaryHTML=planTimes.length?`
    <div style="background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:10px;">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:7px;">Expected Playing Time (planned subs)</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${planTimes.map(({name,secs})=>{
          const col=secs>=fairSecs*0.85?'var(--green)':secs>=fairSecs*0.6?'var(--warn)':'var(--red)';
          return `<div style="background:var(--surface);border-radius:6px;padding:4px 8px;font-size:10px;border:1px solid var(--border)">
            <span style="font-weight:700;color:var(--text)">${name.split(' ')[0]}</span>
            <span style="color:${col};margin-left:4px;font-family:Impact,sans-serif;font-size:12px">${fmt(secs)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`:'';

  const renderHalf=(halfKey,dur,intv,label)=>{
    const halfSecs=dur*60;
    const numSubs=Math.max(0, Math.ceil(halfSecs/intv)-1);
    let h='';

    // ── Starting lineup card ──
    const startIds = getCourtAtPlanPoint(halfKey, 0);
    const startNames = [...startIds].map(id=>filtered[id]).filter(Boolean);
    if(halfKey==='h1'){
      h += lineupCardHTML(startNames,'rgba(62,207,110,.07)','rgba(62,207,110,.3)','var(--green)','▶ STARTING 5 — 1ST HALF');
    } else {
      const h2Label = S.useH2Preset&&S.h2PresetIds.size===COURT_SIZE ? '▶ STARTING 5 — 2ND HALF (Preset)' : '▶ STARTING 5 — 2ND HALF';
      h += lineupCardHTML(startNames,'rgba(74,158,255,.07)','rgba(74,158,255,.3)','var(--blue)', h2Label);
    }

    if(!numSubs){
      // No subs — just show finishing 5 = starting 5
      const finishNames = [...getCourtAtPlanPoint(halfKey, 9999)].map(id=>filtered[id]).filter(Boolean);
      if(halfKey==='h2') h += lineupCardHTML(finishNames,'rgba(250,204,21,.07)','rgba(250,204,21,.3)','#facc15','🏁 FINISHING 5');
      return h;
    }

    h += `<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:6px;">${label} — ${numSubs} sub${numSubs!==1?'s':''}</div>`;

    for(let i=0;i<numSubs;i++){
      const atTime=(i+1)*intv;
      const courtIds=getCourtAtPlanPoint(halfKey,i);
      const benchIds=new Set(filtered.map((_,idx)=>idx).filter(id=>!courtIds.has(id)));
      const sub=(S.subPlan[halfKey]&&S.subPlan[halfKey][i])||{off:new Set(),on:new Set()};
      const isValid=sub.off.size>0&&sub.off.size===sub.on.size;
      const hasAny=sub.off.size>0||sub.on.size>0;
      const mismatch=hasAny&&sub.off.size!==sub.on.size;

      const courtChips=[...courtIds].map(id=>{
        const nm=filtered[id]; const isOff=sub.off.has(id);
        const pos=posLabelForName(nm);
        const posBadge=pos?` <span style="font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(74,158,255,.18);color:#7ab8ff">${pos}</span>`:'';
        return `<div class="plan-chip ${isOff?'off':'court-idle'}" onclick="planToggle('${halfKey}',${i},${id},'court')">${isOff?'▼ ':''}${nm}${posBadge}</div>`;
      }).join('');
      const benchChips=[...benchIds].map(id=>{
        const nm=filtered[id]; const isOn=sub.on.has(id);
        const pos=posLabelForName(nm);
        const posBadge=pos?` <span style="font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px;background:rgba(74,158,255,.18);color:#7ab8ff">${pos}</span>`:'';
        return `<div class="plan-chip ${isOn?'on':'bench-idle'}" onclick="planToggle('${halfKey}',${i},${id},'bench')">${isOn?'▲ ':''}${nm}${posBadge}</div>`;
      }).join('');

      const statusHTML=isValid
        ?`<span style="font-size:9px;color:var(--green)">✓ ${sub.off.size} off, ${sub.on.size} on</span>`
        :mismatch?`<span style="font-size:9px;color:var(--warn)">Select equal off/on</span>`:'';

      // Post-sub court lineup
      const afterCourtIds = getCourtAtPlanPoint(halfKey, i+1);
      const afterCourtHTML = isValid ? (()=>{
        const names = [...afterCourtIds].map(id=>filtered[id]).filter(Boolean);
        const posLine = names.map(nm=>{
          const pos = posLabelForName(nm);
          const pb = pos?`<span style="font-size:7px;font-weight:700;padding:1px 3px;border-radius:3px;background:rgba(62,207,110,.18);color:var(--green)">${pos}</span>`:'';
          return `<span style="font-size:10px;color:var(--text);font-weight:600">${nm.split(' ')[0]}</span>${pb}`;
        }).join('<span style="color:var(--dim);margin:0 3px;font-size:9px">·</span>');
        const covered=coveredPositions(names);
        const missing=['1','2','3','4','5'].filter(p=>!covered.has(p));
        const missingBit=missing.length&&names.some(n=>allPositionsForName(n).length>0)
          ?`<span style="font-size:9px;color:var(--warn);margin-left:6px">missing ${missing.join(',')}</span>`:'';
        return `<div style="background:rgba(62,207,110,.07);border-radius:6px;padding:5px 8px;margin-top:6px;">
          <div style="font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--green);margin-bottom:3px;font-weight:700">On court after ▶</div>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px;">${posLine}${missingBit}</div>
        </div>`;
      })() : '';

      h+=`<div class="plan-slot${isValid?' done':''}">
        <div class="plan-slot-hdr">
          <span class="plan-slot-title">SUB ${i+1} @ ${sub.atTime||fmt(atTime)}</span>
          <div style="display:flex;align-items:center;gap:8px">
            ${statusHTML}
            ${hasAny?`<button style="background:none;border:none;color:var(--dim);font-size:10px;cursor:pointer" onclick="planClear('${halfKey}',${i})">✕ clear</button>`:''}
          </div>
        </div>
        <div class="plan-row-lbl">Court — tap to sub off ▼</div>
        <div class="plan-chips">${courtChips||'<span style="color:var(--dim);font-size:10px">Empty court</span>'}</div>
        <div class="plan-row-lbl">Bench — tap to sub on ▲</div>
        <div class="plan-chips">${benchChips||'<span style="color:var(--dim);font-size:10px">Empty bench</span>'}</div>
        ${afterCourtHTML}
      </div>`;
    }

    // ── Finishing 5 (after last sub in H2) ──
    if(halfKey==='h2'){
      const finishIds = getCourtAtPlanPoint('h2', (S.subPlan.h2||[]).length);
      const finishNames = [...finishIds].map(id=>filtered[id]).filter(Boolean);
      h += lineupCardHTML(finishNames,'rgba(250,204,21,.07)','rgba(250,204,21,.3)','#facc15','🏁 FINISHING 5 (after last sub)');
    }

    return h;
  };

  return summaryHTML
       + renderHalf('h1',S.h1Dur,S.h1Int,'1ST HALF')
       + renderHalf('h2',S.h2Dur,S.h2Int,'2ND HALF');
}

// ═══════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════
function startGame(){
  unlockAudio();
  const filtered=S.names.filter(n=>n.trim());
  // Initialise game positions and manual overrides
  S.scoreLog = [];
  S.scoreBarExpanded = false;
  S.gamePositions = {};
  S.q1BreakDone = false; S.q3BreakDone = false;
  S.manualPositions = {};
  // Assign optimal positions to starting 5
  const startIds = filtered.slice(0, COURT_SIZE).map((_, i) => i);
  const optimal = computeOptimalPositions(startIds);
  startIds.forEach(pid => { if(optimal[pid]) S.gamePositions[pid] = optimal[pid]; });
  S.players=filtered.map((name,i)=>({
    id:i, name, onCourt:i<COURT_SIZE,
    playTime:0, h1PlayTime:0, h2PlayTime:0,
    benchTime:0, benchStint:0, fouls:0
  }));
  S.gameTime=0; S.halfTime=0;
  S.subCountdown=S.h1Int;  // already in seconds
  S.alertState=null; prevAlert=null;
  S.isRunning=false; S.planSubIdx=0;
  S.subLog=[]; S.savedGame=null;
  S.selCourt=new Set(); S.selBench=new Set();
  S.phase='h1';
  render();
}

function goToSetup(){
  stopTick(); S.isRunning=false;
  S.savedGame={
    phase:S.phase, players:S.players.map(p=>({...p})),
    gameTime:S.gameTime, halfTime:S.halfTime, subCountdown:S.subCountdown,
    alertState:S.alertState, h1Dur:S.h1Dur, h2Dur:S.h2Dur,
    h1Int:S.h1Int, h2Int:S.h2Int, h1Sps:S.h1Sps, h2Sps:S.h2Sps, subLog:[...S.subLog]
  };
  S.phase='setup'; render();
}

function continueGame(){
  if(!S.savedGame) return;
  const sg=S.savedGame;
  S.players=sg.players.map(p=>({...p}));
  S.gameTime=sg.gameTime; S.halfTime=sg.halfTime;
  S.subCountdown=sg.subCountdown; S.alertState=sg.alertState; prevAlert=sg.alertState;
  S.h1Dur=sg.h1Dur; S.h2Dur=sg.h2Dur;
  S.h1Int=sg.h1Int; S.h2Int=sg.h2Int;
  S.h1Sps=sg.h1Sps; S.h2Sps=sg.h2Sps;
  S.subLog=[...sg.subLog]; S.isRunning=false;
  S.selCourt=new Set(); S.selBench=new Set();
  S.phase=sg.phase; render();
}

function togglePause(){
  unlockAudio();
  const wasRunning = S.isRunning;
  S.isRunning = !wasRunning;

  if(S.isRunning){
    // Resuming: both clocks run
    S.isClockRunning = true;
    startTick();
  } else {
    // Timeout: check league rules
    if(isGameClockStoppedOnTimeout()){
      // VJBL/EDL always, or EDJBL in last 2min H2: stop everything
      S.isClockRunning = false;
      stopTick();
    } else {
      // EDJBL normal timeout: game clock keeps running, player clocks stop
      S.isClockRunning = true;
      startTick(); // keep ticking but isRunning=false means player timers won't increment
    }
  }

  const ovl=$('pause-ovl');
  if(ovl) ovl.style.display=S.isRunning?'none':'flex';
  const pbtn=$('pbtn');
  if(pbtn){ pbtn.textContent=S.isRunning?'⏸ TIMEOUT':'▶ RESUME'; pbtn.className='pbtn'+(S.isRunning?' live':''); }

  // Show a small indicator when clock keeps running during EDJBL timeout
  const clockNote=$('timeout-clock-note');
  if(clockNote) clockNote.style.display=(!S.isRunning&&S.isClockRunning)?'block':'none';
}

function resumeFromOverlay(){
  // Auto-commit any pending sub selections before resuming
  if((S.selCourt.size>0||S.selBench.size>0)){
    const availableSpots=COURT_SIZE-S.players.filter(p=>p.onCourt).length;
    const fillingUp=S.selCourt.size===0&&availableSpots>0&&S.selBench.size<=availableSpots;
    const canSub=S.selCourt.size>0&&S.selBench.size>0&&S.selCourt.size===S.selBench.size;
    if(canSub||fillingUp) commitSub();
  }
  if(!S.isRunning){ S.isRunning=true; S.isClockRunning=true; startTick(); }
  const ovl=$('pause-ovl');
  if(ovl) ovl.style.display='none';
  const pbtn=$('pbtn');
  if(pbtn){ pbtn.textContent='⏸ TIMEOUT'; pbtn.className='pbtn live'; }
}

function commitSub(){
  const cp=courtPlayers();
  const availableSpots=COURT_SIZE-cp.length;
  const fillingUp=S.selCourt.size===0&&availableSpots>0&&S.selBench.size<=availableSpots;
  if(!S.selBench.size) return;
  if(!fillingUp&&!S.selCourt.size) return;

  const off=S.players.filter(p=>S.selCourt.has(p.id)).map(p=>p.name);
  const on =S.players.filter(p=>S.selBench.has(p.id)).map(p=>p.name);
  S.subLog.push({gameTime:S.gameTime, halfTime:S.halfTime, half:S.phase==='h2'?2:1, on, off});

  S.players.forEach(p=>{
    if(S.selCourt.has(p.id)){ p.onCourt=false; }
    if(S.selBench.has(p.id)){ p.onCourt=true; p.benchStint=0; }
  });

  // Auto-assign optimal positions to incoming players (non-manual only)
  const newCourtIds = S.players.filter(p=>p.onCourt).map(p=>p.id);
  const optimal = computeOptimalPositions(newCourtIds);
  if(!S.manualPositions) S.manualPositions = {};
  newCourtIds.forEach(pid=>{
    if(!S.manualPositions[pid] && optimal[pid]){
      S.gamePositions[pid] = optimal[pid];
    }
  });

  S.selCourt=new Set(); S.selBench=new Set();
  S.subCountdown=getSubInt(); S.alertState=null; prevAlert=null;
  S.planSubIdx++;

  // ── Auto-rebalance: if sub plan exists, patch next 2 subs based on actual court ──
  if(S.useSubPlan){
    const halfKey=S.phase==='h2'?'h2':'h1';
    const dur=S.phase==='h2'?S.h2Dur:S.h1Dur;
    const halfSecs=dur*60;
    const numSubs=Math.max(0,Math.ceil(halfSecs/getSubInt())-1);
    const actualCourtIds=new Set(courtPlayers().map(p=>p.id));

    // For next 1-2 planned subs, rewrite them based on actual vs ideal
    for(let ahead=0; ahead<2; ahead++){
      const idx=S.planSubIdx+ahead;
      if(idx>=numSubs) break;
      const planned=S.subPlan[halfKey]&&S.subPlan[halfKey][idx];
      if(!planned||(!planned.off.size&&!planned.on.size)) break;

      // Check if planned sub still makes sense — if the players it moves are already on/off court
      const plannedOffStillOnCourt=[...planned.off].every(id=>actualCourtIds.has(id));
      const plannedOnStillOnBench=[...planned.on].every(id=>!actualCourtIds.has(id));
      if(plannedOffStillOnCourt && plannedOnStillOnBench) break; // plan is still valid

      // Rebalance: find players with most court time to come off, least to come on
      const courtArr=courtPlayers().sort((a,b)=>b.playTime-a.playTime);
      const benchArr=benchPlayers().filter(p=>p.fouls<5).sort((a,b)=>a.playTime-b.playTime);
      const sps=getCurrSps();
      const newOff=new Set(courtArr.slice(0,Math.min(sps,courtArr.length)).map(p=>p.id));
      const newOn=new Set(benchArr.slice(0,Math.min(sps,benchArr.length)).map(p=>p.id));

      if(!S.subPlan[halfKey]) S.subPlan[halfKey]=[];
      S.subPlan[halfKey][idx]={off:newOff, on:newOn, _autoRebalanced:true};
    }
  }

  vibrate([80,40,80]);
  // Recompute optimal positions for new court lineup
  recomputeCourtPositions();
  renderGame();
}

function clearSel(){ S.selCourt=new Set(); S.selBench=new Set(); renderGame(); }

function togglePlayerSel(pid, role){
  const p=S.players.find(pl=>pl.id===pid);
  if(!p||p.fouls>=5) return;
  if(role==='court'){
    const s=new Set(S.selCourt);
    s.has(pid)?s.delete(pid):s.add(pid);
    S.selCourt=s;
  } else {
    const s=new Set(S.selBench);
    s.has(pid)?s.delete(pid):s.add(pid);
    S.selBench=s;
  }
  renderGame();
}

function toggleFoul(pid, dot){
  const p=S.players.find(pl=>pl.id===pid);
  if(!p) return;
  const newFouls=p.fouls>dot?dot:dot+1;
  const wasOut=p.fouls>=5;
  p.fouls=newFouls;
  if(newFouls>=5&&p.onCourt){ p.onCourt=false; }
  S.selCourt.delete(pid); S.selBench.delete(pid);
  renderGame();
}

function startQuarterResume(fromPhase){
  S.alertState=null; prevAlert=null;
  S.selCourt=new Set(); S.selBench=new Set();
  // Apply any pending sub selections from quarter break screen
  if(S.pendingQBreakSubs){
    const {off, on} = S.pendingQBreakSubs;
    const offArr=[...off], onArr=[...on];
    const cnt=Math.min(offArr.length,onArr.length);
    if(cnt>0){
      const offNames=[], onNames=[];
      S.players.forEach(p=>{
        if(off.has(p.id)){ p.onCourt=false; offNames.push(p.name); }
        if(on.has(p.id)){ p.onCourt=true; p.benchStint=0; onNames.push(p.name); }
      });
      S.subLog.push({gameTime:S.gameTime, halfTime:S.halfTime, half:S.phase==='q1break'?1:2, on:onNames, off:offNames});
    }
    S.pendingQBreakSubs=null;
  }
  // Recompute optimal positions for new court lineup
  const newCourtIds=S.players.filter(p=>p.onCourt).map(p=>p.id);
  const optimal=computeOptimalPositions(newCourtIds);
  if(!S.manualPositions) S.manualPositions={};
  newCourtIds.forEach(pid=>{ if(!S.manualPositions[pid]&&optimal[pid]) S.gamePositions[pid]=optimal[pid]; });
  S.phase = fromPhase==='q1break' ? 'h1' : 'h2';
  S.isRunning=true; S.isClockRunning=true;
  render();
  startTick();
}

function endHalf(){
  stopTick(); S.isRunning=false; S.isClockRunning=false;
  // Quarter teams: route to the correct break screen
  if(usesQuarters() && S.phase==='h1' && !S.q1BreakDone){
    S.q1BreakDone=true; S.phase='q1break'; render(); return;
  }
  if(usesQuarters() && S.phase==='h2' && !S.q3BreakDone){
    S.q3BreakDone=true; S.phase='q3break'; render(); return;
  }
  // Non-quarter teams, or Q2→halftime, or Q4→game end (shouldn't reach here for Q4)
  const h2Court=S.useH2Preset&&S.h2PresetIds.size===COURT_SIZE
    ? new Set(S.h2PresetIds)
    : new Set(S.players.filter(p=>p.onCourt).map(p=>p.id));
  S.htOnCourt=h2Court;
  S.phase='halftime'; render();
}

function toggleHtPlayer(pid){
  const s=new Set(S.htOnCourt);
  if(s.has(pid)){ s.delete(pid); S.htOnCourt=s; }
  else if(s.size<COURT_SIZE){ s.add(pid); S.htOnCourt=s; }
  renderHalftime();
}

function startSecondHalf(){
  // Log any halftime lineup changes as a sub entry at gameTime boundary
  const prevCourt = new Set(S.players.filter(p=>p.onCourt).map(p=>p.id));
  const offIds = [...prevCourt].filter(id=>!S.htOnCourt.has(id));
  const onIds  = [...S.htOnCourt].filter(id=>!prevCourt.has(id));
  if(offIds.length||onIds.length){
    const getName = id=>{ const p=S.players.find(q=>q.id===id); return p?p.name:'?'; };
    S.subLog.push({gameTime:S.gameTime, halfTime:0, half:2, isHalftime:true,
      on:onIds.map(getName), off:offIds.map(getName)});
  }
  S.players.forEach(p=>{ p.onCourt=S.htOnCourt.has(p.id); p.benchStint=0; });
  S.halfTime=0; S.subCountdown=S.h2Int;
  S.alertState=null; prevAlert=null; S.planSubIdx=0;
  S.selCourt=new Set(); S.selBench=new Set();
  S.phase='h2'; S.isRunning=true; S.isClockRunning=true;
  render();
  startTick();
}

function endGame(){ stopTick(); S.isRunning=false; S.isClockRunning=false; S.phase='gameover'; render(); }

function exportReport(){
  const now=new Date();
  const pad=(s,w)=>String(s).padEnd(w);
  const line='─'.repeat(68);
  const sorted=[...S.players].sort((a,b)=>b.playTime-a.playTime);
  let txt=`SQUAD MANAGER — GAME REPORT\nGenerated: ${now.toLocaleString()}\n${line}\n\n`;
  if(S.finalScore&&(S.finalScore.us!==null||S.finalScore.them!==null)){
    const us=S.finalScore.us??'—', them=S.finalScore.them??'—';
    txt+=`FINAL SCORE: ${us} — ${them}\n${line}\n\n`;
  }
  txt+=`GAME SETTINGS\n`;
  txt+=`• 1st Half: ${S.h1Dur} min | Sub every: ${S.h1Int} min | Per sub: ${S.h1Sps}\n`;
  txt+=`• 2nd Half: ${S.h2Dur} min | Sub every: ${S.h2Int} min | Per sub: ${S.h2Sps}\n\n`;
  txt+=`PLAYER STATISTICS (sorted by total playing time)\n${line}\n`;
  txt+=`${pad('Player',15)}${pad('1st Half',10)}${pad('2nd Half',10)}${pad('Total',10)}Fouls\n${line}\n`;
  sorted.forEach(p=>{
    txt+=`${pad(p.name,15)}${pad(fmt(p.h1PlayTime),10)}${pad(fmt(p.h2PlayTime),10)}${pad(fmt(p.playTime),10)}${p.fouls}\n`;
  });
  if(S.subLog.length){
    txt+=`\nSUBSTITUTION LOG (${S.subLog.length} subs)\n${line}\n`;
    txt+=`${pad('Game',10)}${pad('Half',6)}${pad('HalfT',10)}${pad('On',22)}Off\n${line}\n`;
    S.subLog.forEach(e=>{
      txt+=`${pad(fmt(e.gameTime),10)}${pad('H'+e.half,6)}${pad(fmt(e.halfTime),10)}${pad(e.on.join(', '),22)}${e.off.join(', ')}\n`;
    });
  }
  const filename=`squad_report_${now.toISOString().slice(0,10)}.txt`;
  const blob=new Blob([txt],{type:'text/plain'});
  if(navigator.canShare){
    const file=new File([blob],filename,{type:'text/plain'});
    if(navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Squad Manager Game Report'}).catch(()=>{});
      return;
    }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function foulDotsHTML(pid, fouls){
  let h=`<div class="fr" onclick="event.stopPropagation()"><span class="fl">Fouls</span>`;
  for(let i=0;i<5;i++){
    h+=`<button class="fd${fouls>i?' on':''}" onclick="event.stopPropagation();toggleFoul(${pid},${i})"></button>`;
  }
  if(fouls>=5) h+=`<span class="fotag">OUT</span>`;
  h+=`</div>`;
  return h;
}

function playerCardHTML(p, role, isHigh, isSel, {targetTime,remPP}, planHighlights){
  const fouledOut=p.fouls>=5;
  const isPlannedOff=planHighlights&&planHighlights.off.has(p.id);
  const isPlannedOn =planHighlights&&planHighlights.on.has(p.id);
  const isFinal     =planHighlights&&planHighlights.isFinal;

  // Card colour priority: planned > highlight suggestion > normal
  let sk;
  if(isPlannedOff)        sk=isFinal?'pf':'pp';
  else if(isPlannedOn)    sk=isFinal?'pf':'pq';
  else if(role==='court') sk=isHigh?'cx':'cn';
  else                    sk=isHigh?'bx':'bn';

  const selClass=isSel?' sel':'';
  const foClass=fouledOut?' fo':'';
  const selectable=fouledOut?'':' selectable';
  const click=fouledOut
    ?`onclick="event.stopPropagation()"`
    :`onclick="event.stopPropagation();togglePlayerSel(${p.id},'${role}')"`;

  // Position badge — tappable on court cards, recommendation indicator on bench
  const posDisplay = posBadgeForCard(p.id, role, isPlannedOn);

  let badge='';
  if(fouledOut)         badge=`<span class="cbadge bred">FOULED OUT</span>`;
  else if(isSel)        badge=`<span class="cbadge bsel">✓</span>`;
  else if(isPlannedOff) badge=`<span class="cbadge ${isFinal?'bpf':'bpo'}">${isFinal?'★ FINAL OFF':'PLANNED OFF'}</span>`;
  else if(isPlannedOn)  badge=`<span class="cbadge ${isFinal?'bpf':'bpi'}">${isFinal?'★ FINAL ON':'PLANNED ON'}</span>`;
  else if(isHigh&&role==='court') badge=`<span class="cbadge bo">OUT</span>`;
  else if(isHigh&&role==='bench') badge=`<span class="cbadge bi">IN</span>`;

  const fc=p.fouls<5?p.playTime+remPP:null;
  const fcHTML=fc!==null
    ?`<div class="stat"><span id="fc-${p.id}" class="sv" style="color:${fcColor(fc,targetTime)}">${fmt(fc)}</span><span class="sk">Forecast</span></div>`
    :'';

  const benchHTML=role==='bench'
    ?`<div class="stat"><span id="bt-${p.id}" class="sv svb">${fmt(p.benchTime)}</span><span class="sk">Total bench</span></div>
      <div class="stat"><span id="bs-${p.id}" class="sv svt">${fmt(p.benchStint)}</span><span class="sk">This stint</span></div>`
    :`<div class="stat"><span id="bt-${p.id}" class="sv svb">${fmt(p.benchTime)}</span><span class="sk">Bench</span></div>`;

  return `
<div class="pc ${sk}${selClass}${foClass}${selectable}${role==='court'?' court-card':''}" ${click}>
  <div class="ctop"><div class="cname">${p.name}${posDisplay}</div>${badge}</div>
  <div class="cstats">
    <div class="stat"><span id="pt-${p.id}" class="sv svg">${fmt(p.playTime)}</span><span class="sk">Played</span></div>
    ${fcHTML}${benchHTML}
  </div>
  ${foulDotsHTML(p.id, p.fouls)}
</div>`;
}

function postSubPositionBoard(stayOn, nextOff, nextOn){
  const newCourt = [...stayOn, ...nextOn];
  if(!newCourt.length) return '';
  const anyRatings = newCourt.some(p=>allPositionsForPlayer(p.id).length>0);
  if(!anyRatings) return '';

  const coveredAfter = new Set();
  newCourt.forEach(p=>{ const pos=getGamePos(p.id); if(pos) coveredAfter.add(pos); });
  const missing = ['1','2','3','4','5'].filter(n=>!coveredAfter.has(n));

  const tiles = newCourt.map(p=>{
    const pos = getGamePos(p.id);
    const allPos = allPositionsForPlayer(p.id);
    const isComingOn = nextOn.some(q=>q.id===p.id);
    const posClass = pos ? 'pos-'+pos : '';
    const firstName = (S.names[p.id]||p.name||'').split(' ')[0];
    // Recommend a move if player can fill a missing position
    const canFill = allPos.filter(ap=>missing.includes(ap) && ap!==pos);
    const recBit = canFill.length
      ? '<div style="font-size:10px;margin-top:3px;color:var(--accent);font-weight:700;">→'+canFill[0]+'</div>'
      : '';
    return '<button onclick="event.stopPropagation();openPosPicker('+p.id+',\'court\')" '+
      'style="flex:1;min-width:0;border-radius:11px;padding:10px 4px 8px;border:'+(isComingOn?'2.5px':'1.5px')+' solid;cursor:pointer;'+
      'background:'+(isComingOn?'rgba(0,207,180,.18)':'rgba(255,255,255,.06)')+';'+
      'display:flex;flex-direction:column;align-items:center;justify-content:center;" '+
      'class="'+posClass+'">'+
      '<div style="font-family:Impact,sans-serif;font-size:28px;line-height:1;">'+(pos||'?')+'</div>'+
      '<div style="font-size:10px;margin-top:4px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px;">'+(isComingOn?'▲ ':'')+firstName+'</div>'+
      recBit+
      '</button>';
  }).join('');

  const missingNote = missing.length
    ? '<div style="text-align:center;font-size:12px;color:var(--red);margin-top:7px;font-weight:600;">⚠ Missing: '+missing.join(' · ')+'</div>'
    : '<div style="text-align:center;font-size:12px;color:var(--green);margin-top:7px;">✓ All positions covered</div>';

  return '<div onclick="event.stopPropagation()" style="padding:10px 12px 6px;flex-shrink:0;background:rgba(0,0,0,.4);border-top:1px solid rgba(255,255,255,.1);">'+
    '<div style="font-family:Impact,sans-serif;font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:8px;text-align:center;">COURT AFTER SUB — tap to change position</div>'+
    '<div style="display:flex;gap:6px;height:90px;">'+tiles+'</div>'+
    missingNote+
    '</div>';
}

// Toggle sub selection from pause overlay — refreshes just the overlay
function ovlSubInstruction(){
  var cs=S.selCourt.size, bs=S.selBench.size;
  if(cs>0&&bs>0&&cs===bs) return '<span style="color:var(--accent);font-weight:700;">✓ '+cs+' sub ready — tap anywhere to apply</span>';
  if(cs>0||bs>0) return 'Tap court to sub off · bench to sub on (same count)';
  return 'Tap players to select a sub · or tap to resume';
}

function toggleOvlSel(pid, fromCourt){
  if(fromCourt){
    if(S.selCourt.has(pid)) S.selCourt.delete(pid); else S.selCourt.add(pid);
  } else {
    if(S.selBench.has(pid)) S.selBench.delete(pid); else S.selBench.add(pid);
  }
  const ovl=document.getElementById('pause-ovl');
  if(ovl) ovl.outerHTML=pauseOverlayHTML();
}

function pauseOverlayHTML(){
  const cp=courtPlayers();
  const bp=benchPlayers();
  const sps=getCurrSps();
  const gameStarted=S.gameTime>0;

  // Determine who is highlighted for next sub
  const planHL=getPlanHighlights();
  let nextOffIds, nextOnIds, isPlanned=false, isFinalHL=false;
  if(planHL){
    nextOffIds=planHL.off; nextOnIds=planHL.on;
    isPlanned=true; isFinalHL=planHL.isFinal;
  } else {
    nextOffIds=new Set(cp.slice(-sps).map(p=>p.id));
    nextOnIds=new Set(bp.filter(p=>p.fouls<5).slice(0,sps).map(p=>p.id));
  }

  const stayOn=cp.filter(p=>!nextOffIds.has(p.id));
  const nextOff=cp.filter(p=>nextOffIds.has(p.id));
  const nextOn=bp.filter(p=>nextOnIds.has(p.id));
  const otherBench=bp.filter(p=>!nextOnIds.has(p.id));

  // Show position board when there's a sub happening
  const showPosBoard = gameStarted && (nextOff.length>0||nextOn.length>0);
  const posBoard = showPosBoard ? postSubPositionBoard(stayOn, nextOff, nextOn) : '';

  const offColor=isFinalHL?'var(--gold)':'rgba(255,140,0,.85)';
  const onColor=isFinalHL?'var(--gold)':'rgba(0,207,180,.85)';
  const offBg=isFinalHL?'rgba(46,32,0,.7)':'rgba(46,26,0,.65)';
  const onBg=isFinalHL?'rgba(46,32,0,.7)':'rgba(0,61,55,.65)';
  const offBorder=isFinalHL?'rgba(250,204,21,.4)':'rgba(255,140,0,.4)';
  const onBorder=isFinalHL?'rgba(250,204,21,.4)':'rgba(0,207,180,.4)';

  const pillLarge=(name, time, timeColor, bg, border, pid, isComingOn)=>{
    const allPos = (pid!==undefined) ? allPositionsForPlayer(pid) : [];
    const covered = courtCoverage();
    const gaps = ['1','2','3','4','5'].filter(n=>!covered[n]);
    let posBit = '';
    if(allPos.length){
      if(isComingOn){
        // For coming-on: show positions that fill gaps prominently
        posBit = allPos.map(function(p){
          const isGap=gaps.includes(p);
          return '<span class="pos-badge '+(POS_COLOURS[+p]||'')+'" style="font-size:'+(isGap?'13':'10')+'px;padding:'+(isGap?'2px 7px':'1px 5px')+';margin-left:3px;'+(isGap?'':'opacity:.5;')+'">'+p+(isGap?'↑':'')+'</span>';
        }).join('');
      } else {
        const pos = getGamePos(pid);
        if(pos) posBit='<span class="pos-badge '+(POS_COLOURS[+pos]||'')+'" style="font-size:12px;padding:2px 7px;margin-left:4px;">'+pos+'</span>';
      }
    }
    var fromCourt2 = !isComingOn; // off=fromCourt, on=fromBench
    var isSel2 = pid!==undefined ? (fromCourt2 ? S.selCourt.has(pid) : S.selBench.has(pid)) : false;
    var selOutline = isSel2 ? 'box-shadow:0 0 0 2px var(--accent);' : '';
    var clickFn2 = pid!==undefined ? 'event.stopPropagation();toggleOvlSel('+pid+','+fromCourt2+');' : '';
    var checkMark2 = isSel2 ? '<span style="color:var(--accent);margin-right:5px;font-size:14px;">✓</span>' : '';
    return '<div onclick="'+clickFn2+'" style="border-radius:9px;padding:7px 11px;border:1.5px solid '+border+';background:'+bg+';'+selOutline+'display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;cursor:pointer;">'+
      '<span style="display:flex;align-items:center;font-weight:700;font-size:15px;color:#eef0f8;">'+checkMark2+name+posBit+'</span>'+
      '<span style="font-family:Impact,sans-serif;font-size:14px;color:'+timeColor+'">'+time+'</span>'+
      '</div>';
  };

  const pillSmall=(name, time, timeColor, pid, fromCourt)=>{
    var pos = (pid!==undefined) ? getGamePos(pid) : null;
    var posBit = pos ? '<span class="pos-badge '+(POS_COLOURS[+pos]||'')+'" style="font-size:10px;padding:2px 6px;margin-left:4px;cursor:pointer;" onclick="event.stopPropagation();openPosPicker('+pid+',\'court\')">'+pos+'</span>' : '';
    var isSel = pid!==undefined && fromCourt!==undefined && (fromCourt ? S.selCourt.has(pid) : S.selBench.has(pid));
    var selStyle = isSel ? 'border-color:var(--accent);background:rgba(255,140,0,.18);' : '';
    var clickFn = pid!==undefined && fromCourt!==undefined ? 'event.stopPropagation();toggleOvlSel('+pid+','+fromCourt+');' : '';
    var checkMark = isSel ? '<span style="color:var(--accent);margin-right:4px;font-size:11px;">✓</span>' : '';
    return '<div onclick="'+clickFn+'" style="border-radius:7px;padding:5px 9px;border:1px solid var(--border);'+selStyle+'background:rgba(30,34,50,.65);display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px;cursor:'+(clickFn?'pointer':'default')+';">'+
      '<span style="display:flex;align-items:center;font-weight:600;font-size:12px;color:#eef0f8;">'+checkMark+name+posBit+'</span>'+
      '<span style="font-family:Impact,sans-serif;font-size:11px;color:'+timeColor+'">'+time+'</span>'+
      '</div>';
  };

  let leftHTML='', rightHTML='';

  if(gameStarted){
    if(stayOn.length){
      leftHTML+=`<div class="po-chdr court">STAYING ON</div>`;
      stayOn.forEach(p=>{ leftHTML+=pillSmall(p.name, fmt(p.playTime), 'var(--green)', p.id, true); });
    }
    if(nextOff.length){
      const lbl=isFinalHL?'★ FINAL OFF':isPlanned?'PLANNED OFF':'SUB OFF';
      leftHTML+=`<div class="po-chdr sub-out" style="margin-top:${stayOn.length?7:0}px;background:${offBg};border:1px solid ${offBorder};color:${offColor};">${lbl}</div>`;
      nextOff.forEach(p=>{ leftHTML+=pillLarge(p.name, fmt(p.playTime), offColor, offBg, offBorder, p.id, false); });
    }
    if(!cp.length) leftHTML+=`<div style="text-align:center;color:var(--dim);font-size:11px;padding:10px">Empty court</div>`;

    if(nextOn.length){
      const lbl=isFinalHL?'★ FINAL ON':isPlanned?'PLANNED ON':'SUB ON';
      rightHTML+=`<div class="po-chdr" style="background:${onBg};border:1px solid ${onBorder};color:${onColor};border-radius:5px;font-family:Impact,sans-serif;font-size:10px;letter-spacing:2px;text-align:center;padding:3px;margin-bottom:2px;">${lbl}</div>`;
      nextOn.forEach(p=>{ rightHTML+=pillLarge(p.name, fmt(p.benchTime), onColor, onBg, onBorder, p.id, true); });
    }
    if(otherBench.length){
      rightHTML+=`<div class="po-chdr bench" style="margin-top:${nextOn.length?7:0}px">BENCH</div>`;
      otherBench.forEach(p=>{ rightHTML+=pillSmall(p.name, fmt(p.benchTime), 'var(--blue)', p.id, false); });
    }
    if(!bp.length) rightHTML+=`<div style="text-align:center;color:var(--dim);font-size:11px;padding:10px">Empty bench</div>`;
  } else {
    leftHTML+=`<div class="po-chdr court">STARTING COURT</div>`;
    cp.forEach(p=>{ leftHTML+=pillSmall(p.name, fmt(p.playTime), 'var(--green)', p.id, true); });
    rightHTML+=`<div class="po-chdr bench">BENCH</div>`;
    bp.forEach(p=>{ rightHTML+=pillSmall(p.name, fmt(p.benchTime), 'var(--blue)'); });
  }

  let topHTML='';
  if(gameStarted){
    const subC=S.alertState==='sub-now'?'var(--red)':S.alertState==='warning'?'var(--warn)':'var(--accent)';
    const subLbl=S.alertState==='sub-now'?'🔔 SUB NOW!':S.alertState==='warning'?'⏱ SUB IN 30s':'NEXT SUB IN';
    topHTML=`<div class="potitle">TIMEOUT</div>
      <div class="potime">${fmt(S.gameTime)}</div>
      <div class="po-subcountdown-lbl">${subLbl}</div>
      <div class="po-subcountdown" style="color:${subC}">${fmt(S.subCountdown)}</div>
      <div class="posub">${ovlSubInstruction()}</div>`
  } else {
    const label=S.phase==='h2'?'2ND HALF':'1ST HALF';
    topHTML=`<div class="potitle" style="font-size:56px;text-align:center">${label}</div><div class="postart">Tap anywhere to start the clock</div>`;
  }

  return `
<div id="pause-ovl" class="povl" style="display:${S.isRunning?'none':'flex'}" onclick="resumeFromOverlay()">
  <div class="po-top">${topHTML}</div>
  ${posBoard}
  <div class="po-roster" style="flex:1;min-height:0;overflow-y:auto;">
    <div class="po-col" style="border-right:1px solid rgba(255,255,255,.08)">${leftHTML}</div>
    <div class="po-col">${rightHTML}</div>
  </div>
  ${S.players&&S.players.length ? miniBarChartHTML() : ''}
</div>`;
}

function fmtInterval(secs){
  const m=Math.floor(secs/60), s=secs%60;
  return s===0 ? `${m}m` : `${m}m ${s}s`;
}

function stepperHTML(field, label){

}

function teamsToJSON(teams){
  // Bundle ratings for all players in the exported teams
  const ratings = {};
  teams.forEach(t => {
    t.players.forEach(p => {
      const k = ratingKey(t.id, p.id);
      if(ratingsStore[k] && Object.keys(ratingsStore[k]).length > 0){
        ratings[k] = ratingsStore[k];
      }
    });
  });
  return JSON.stringify({_squadmgr:true, version:2, teams, ratings}, null, 2);
}

function showExportModal(jsonStr, filename, description){
  // Remove any existing export modal
  const existing = $('export-modal');
  if(existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'export-modal';
  modal.className = 'export-modal-backdrop';
  modal.innerHTML = `
    <div class="export-modal-box" onclick="event.stopPropagation()">
      <div class="export-modal-title">EXPORT TEAMS</div>
      <div class="export-modal-sub">${description}</div>
      <textarea class="export-textarea" id="export-json-text" readonly>${jsonStr}</textarea>
      <div class="export-btns">
        <button class="export-share-btn" id="export-share-btn" onclick="doShareExport('${filename}')">⬆ Share</button>
        <button class="export-copy-btn" id="export-copy-btn" onclick="doCopyExport()">⎘ Copy</button>
      </div>
      <button class="export-cancel-btn" onclick="closeExportModal()">Close</button>
    </div>`;
  modal.onclick = closeExportModal;
  document.body.appendChild(modal);

  // Store json for share/copy actions
  window._exportJSON = jsonStr;
  window._exportFilename = filename;

  // Select all text for easy manual copy
  setTimeout(()=>{
    const ta = $('export-json-text');
    if(ta){ ta.focus(); ta.select(); }
  }, 100);
}

function closeExportModal(){
  const m = $('export-modal');
  if(m) m.remove();
  window._exportJSON = null;
}

function doShareExport(filename){
  const jsonStr = window._exportJSON;
  if(!jsonStr) return;

  // Try file share first (iOS 15+)
  try {
    const blob = new Blob([jsonStr], {type:'application/json'});
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'Squad Manager Teams'})
        .then(()=>closeExportModal())
        .catch(()=>{}); // user cancelled
      return;
    }
  } catch(_){}

  // Try text share (works everywhere)
  try {
    if(navigator.share){
      navigator.share({title:'Squad Manager Teams', text: jsonStr})
        .then(()=>closeExportModal())
        .catch(()=>{});
      return;
    }
  } catch(_){}

  // No share API - nudge them to use Copy instead
  const btn = $('export-share-btn');
  if(btn){ btn.textContent='Use Copy ↓'; btn.style.background='var(--dim)'; }
}

function doCopyExport(){
  const jsonStr = window._exportJSON;
  if(!jsonStr) return;
  const btn = $('export-copy-btn');

  // Modern clipboard API
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(jsonStr).then(()=>{
      if(btn){ btn.textContent='✓ Copied!'; btn.style.background='var(--green)'; btn.style.color='#0a1a0a'; }
      setTimeout(()=>{
        if(btn){ btn.textContent='⎘ Copy'; btn.style.background=''; btn.style.color=''; }
      }, 2000);
    }).catch(()=>fallbackCopy(jsonStr, btn));
    return;
  }
  fallbackCopy(jsonStr, btn);
}

function fallbackCopy(text, btn){
  try {
    const ta = $('export-json-text');
    if(ta){ ta.select(); document.execCommand('copy'); }
    if(btn){ btn.textContent='✓ Copied!'; btn.style.background='var(--green)'; btn.style.color='#0a1a0a'; }
    setTimeout(()=>{
      if(btn){ btn.textContent='⎘ Copy'; btn.style.background=''; btn.style.color=''; }
    }, 2000);
  } catch(_){
    if(btn){ btn.textContent='Select & copy manually'; }
  }
}

function exportTeams(){
  if(!T.teams.length){ alert('No teams to export.'); return; }
  const filename = `squad-manager-teams-${new Date().toISOString().slice(0,10)}.json`;
  showExportModal(
    teamsToJSON(T.teams),
    filename,
    `${T.teams.length} team${T.teams.length!==1?'s':''} · Tap Share to send via AirDrop, Mail, etc. or Copy to paste elsewhere`
  );
}

    `${team.club} · ${team.players.length} players`
  );
}

        <button class="export-copy-btn" onclick="closeExportModal()">Cancel</button>
      </div>
    </div>`;
  modal.onclick = closeExportModal;

}

function doPasteImport(){
  const ta = $('paste-json-text');
  if(!ta||!ta.value.trim()){ alert('Please paste the JSON text first.'); return; }
  processImportJSON(ta.value.trim());
  closeExportModal();
}

function processImportJSON(text){
  try {
    const data = JSON.parse(text);
    if(!data._squadmgr || !Array.isArray(data.teams))
      throw new Error('Not a valid Squad Manager teams file');
    const incoming = data.teams;
    if(!incoming.length){ alert('No teams found in data.'); return; }
    let added=0, updated=0;
    incoming.forEach(t => {
      const idx = T.teams.findIndex(x=>x.id===t.id);
      if(idx>=0){ T.teams[idx]=t; updated++; }
      else { T.teams.push(t); added++; }
    });
    saveTeams();

    // Restore ratings if bundled in the export
    if(data.ratings && typeof data.ratings === 'object'){
      let ratingsRestored = 0;
      Object.entries(data.ratings).forEach(([k, v]) => {
        ratingsStore[k] = v;
        ratingsRestored++;
      });
      if(ratingsRestored > 0) saveRatings();
    }

    renderTeamList();
    const banner = document.createElement('div');
    banner.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a2e1a;border:1.5px solid #3ecf6e;color:#3ecf6e;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;';
    banner.textContent = `✓ ${added} added, ${updated} updated`;
    document.body.appendChild(banner);
    setTimeout(()=>banner.remove(), 3000);
  } catch(e){ alert('Import failed: ' + e.message); }
}

function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => processImportJSON(ev.target.result);
  reader.onerror = ()=>{ alert('Could not read file.'); };
  reader.readAsText(file);
}

function deleteTeam(id){

  T.teams=T.teams.filter(t=>t.id!==id);

  saveTeams();

}

function copyTeam(id){
  const src = T.teams.find(t=>t.id===id);
  if(!src) return;
  // Deep copy team with new id
  const newId = uid();
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = newId;
  copy.club = src.club + ' (Copy)';
  copy.season = '';
  copy.year = new Date().getFullYear()+'';
  copy.status = 'current'; // copies start as current
  // Give each player a new id so ratings can be copied independently
  const idMap = {};
  copy.players = copy.players.map(p=>{
    const newPid = uid();
    idMap[p.id] = newPid;
    return {...p, id: newPid};
  });
  T.teams.unshift(copy); // add at top
  saveTeams();
  // Copy ratings for all players
  copy.players.forEach(p=>{
    const origPlayerId = Object.keys(idMap).find(k=>idMap[k]===p.id);
    if(origPlayerId){
      const srcRatings = getPlayerRatings(id, origPlayerId);
      if(Object.keys(srcRatings).length){
        const key = newId + '_' + p.id;
        ratingsStore[key] = {...srcRatings};
      }
    }
  });
  saveRatings();
  renderTeamList();
  showToast('Team copied ✓ — tap ✏️ to rename and update season details');
}

function autoModeTimeHTML(filtered, hasSubPlan){
  // For quarter teams, game is 4×10min = 40min regardless of stored h1Dur/h2Dur
  const totalSecs=usesQuarters() ? 40*60 : (S.h1Dur+S.h2Dur)*60;
  const n=filtered.length;
  if(n<COURT_SIZE) return n>0 ? priorityPlayersHTML(filtered) : '';
  const base=Math.floor(totalSecs*COURT_SIZE/n);
  const extra=totalSecs*COURT_SIZE - base*n; // leftover seconds to distribute
  const priorityCount=S.priorityPlayerIds.size;

  // Each priority player gets extra time distributed from the remaining
  const times=filtered.map((_,i)=>S.priorityPlayerIds.has(i)
    ?base+Math.floor(extra/Math.max(1,priorityCount))
    :base);

  const prioritySection=priorityPlayersHTML(filtered);

// ═══════════════════════════════════════════
// AI ROTATION PLAN GENERATOR
