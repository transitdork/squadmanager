function buildPlayerRatingSummary(filtered){
  const team = T.teams.find(t=>t.id===T.activeTeamId);
  const POS_LABELS = ['1-PG','2-SG','3-SF','4-PF','5-C'];
  const ALT_LABELS = ['None','1-PG','2-SG','3-SF','4-PF','5-C'];

  // Compute overall rating and key role scores per player
  const playerData = filtered.map(name=>{
    const player = team && team.players.find(p=>playerDisplayName(p)===name);
    const r = player ? getPlayerRatings(T.activeTeamId, player.id) : {};
    const has = Object.keys(r).length > 0;

    if(!has) return { name, has:false };

    const g = k => r[k] !== undefined ? Number(r[k]) : 5;

    // Derive composite scores that actually matter for lineup decisions
    const offence  = (g('layup')+g('jumpshot')+g('three')+g('passing')+g('dribble')+g('sharing'))/6;
    const defence  = (g('defplayer')+g('defset')+g('offdef')+g('rebdef'))/4;
    const handling = (g('passing')+g('dribble')+g('dribblepressure')+g('sharing')+g('receiving'))/5;
    const interior = (g('reboff')+g('rebdef')+(g('height')===2?3:g('height')===1?1:0))/3; // height 0=small,1=med,2=tall
    const energy   = (g('speed')+g('energy'))/2;
    const iq       = (g('setplays')+g('composure')+g('foulshot'))/3;
    const overall  = (offence+defence+energy+iq)/4;

    // Primary and alt positions
    const pos1 = POS_LABELS[parseInt(r.position)||0] || '1-PG';
    const pos2 = parseInt(r.position2||0)>0 ? ALT_LABELS[parseInt(r.position2)] : null;
    const pos3 = parseInt(r.position3||0)>0 ? ALT_LABELS[parseInt(r.position3)] : null;
    const positions = [pos1, pos2, pos3].filter(Boolean).join('/');

    // Role classification
    const isHandler  = ['1-PG','2-SG'].some(p=>[pos1,pos2,pos3].includes(p));
    const isInterior = ['4-PF','5-C'].some(p=>[pos1,pos2,pos3].includes(p));
    const strengths  = [];
    if(offence>=7)  strengths.push('scorer');
    if(defence>=7)  strengths.push('defender');
    if(handling>=7) strengths.push('ball-handler');
    if(interior>=7) strengths.push('rebounder');
    if(energy>=7)   strengths.push('high-energy');
    if(iq>=7)       strengths.push('high-IQ');

    const fatigueRaw = r.fatigue||'Normal';
    return { name, has:true, overall, offence, defence, handling, interior, energy,
             positions, isHandler, isInterior, strengths,
             fatigue: fatigueRaw,
             r1: Math.round(overall*10)/10 };
  });

  // Rank players by overall rating so AI can see relative strength
  const ranked = [...playerData].filter(p=>p.has).sort((a,b)=>b.overall-a.overall);
  const maxOvr = ranked.length ? ranked[0].overall : 10;

  // Format each player as a concise briefing line
  const lines = filtered.map(name=>{
    const d = playerData.find(p=>p.name===name);
    if(!d||!d.has) return `  ${name}: no ratings — treat as average`;

    const starRating = '★'.repeat(Math.round(d.overall/2)) + '☆'.repeat(5-Math.round(d.overall/2));
    const tier = d.overall >= maxOvr*0.85 ? 'CORE' : d.overall >= maxOvr*0.65 ? 'rotation' : 'reserve';
    const strengthStr = d.strengths.length ? '  Strengths: '+d.strengths.join(', ') : '';
    const posNote = d.isHandler ? ' [ball-handler]' : d.isInterior ? ' [interior]' : '';

    const fatigueNote = d.fatigue&&d.fatigue!=='Normal' ? '  FATIGUE: '+d.fatigue : '';
    return `  ${name} [${tier}] ${starRating} (${d.r1}/10)
    Positions: ${d.positions}${posNote}
    Off:${Math.round(d.offence*10)/10} Def:${Math.round(d.defence*10)/10} Handle:${Math.round(d.handling*10)/10} Interior:${Math.round(d.interior*10)/10} Energy:${Math.round(d.energy*10)/10}${strengthStr}${fatigueNote}`;
  });

  // Append lineup analysis: which 5-player combos are problematic
  const handlers  = playerData.filter(p=>p.has&&p.isHandler).map(p=>p.name);
  const interiors = playerData.filter(p=>p.has&&p.isInterior).map(p=>p.name);
  const topPlayers = ranked.slice(0,Math.min(5,ranked.length)).map(p=>p.name);

  const notes = [];
  if(handlers.length<3)  notes.push(`Only ${handlers.length} ball-handler(s): ${handlers.join(', ')} — never bench all of them simultaneously`);
  if(interiors.length<2) notes.push(`Only ${interiors.length} interior player(s): ${interiors.join(', ')} — keep at least one on court`);
  if(topPlayers.length)  notes.push(`Top-rated players: ${topPlayers.join(', ')}`);

  return lines.join('\n') + (notes.length ? '\n\nLINEUP RULES:\n  '+notes.join('\n  ') : '');
}

// ─── Universal AI call — routes to Claude or Gemini based on CFG.aiProvider ───
async function callAI(prompt, maxTokens){
  maxTokens = maxTokens || 2000;
  const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMEOUT')), 150000));

  if(CFG.aiProvider === 'gemini'){
    if(!CFG.geminiKey){ throw new Error('No Gemini API key — add it in ⚙ Settings'); }
    const model = CFG.geminiModel||'gemini-2.5-flash';
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent';
    // Pro uses thinkingLevel: LOW; Flash uses default dynamic thinking
    const isProModel = model.includes('pro');
    const genConfig = {
      maxOutputTokens: maxTokens,
      temperature: 0.4,
      responseMimeType: 'application/json'
    };
    if(isProModel){
      genConfig.thinkingConfig = { thinkingLevel: 'LOW' };
    } else {
      // Disable thinking for Flash — all tokens go to actual output, not internal reasoning
      genConfig.thinkingConfig = { thinkingBudget: 0 };
    }
    const body = JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: genConfig });
    const headers = { 'Content-Type': 'application/json', 'x-goog-api-key': CFG.geminiKey };

    // Exponential backoff retry: 0s → 15s → 35s (3 attempts total)
    async function attemptFetch(attempt){
      if(attempt>0){
        const waitMs = attempt===1 ? 15000 : 35000;
        const progEl = document.querySelector('#ai-rot-modal .ai-prog-lbl');
        if(progEl) progEl.textContent = 'Rate limited — waiting '+Math.round(waitMs/1000)+'s before retry '+(attempt)+'/2…';
        await new Promise(r=>setTimeout(r,waitMs));
      }
      const fetchP = fetch(url, { method:'POST', headers, body });
      const resp = await Promise.race([fetchP, timeout]);
      if(!resp.ok){
        let errBody = {};
        try{ errBody = await resp.json(); }catch(_){}
        const apiMsg = errBody?.error?.message || errBody?.error?.status || JSON.stringify(errBody).slice(0,200);
        if(resp.status===429){
          if(attempt<2) return attemptFetch(attempt+1);
          throw new Error('Gemini 429: ' + apiMsg);
        }
        if(resp.status===400) throw new Error('Gemini 400 (Bad request): ' + apiMsg);
        if(resp.status===403) throw new Error('Gemini 403 (Key invalid or not enabled): ' + apiMsg);
        throw new Error('Gemini HTTP '+resp.status+': '+apiMsg);
      }
      const data = await resp.json();
      const parts = data.candidates?.[0]?.content?.parts || [];
      const text = parts.filter(p=>!p.thought&&p.text).map(p=>p.text).join('').trim();
      if(!text) throw new Error('Gemini returned empty response — try again');
      return text;
    }
    return attemptFetch(0);
  } else {
    // Claude (default)
    if(!CFG.apiKey){ throw new Error('No Anthropic API key — add it in ⚙ Settings'); }
    const fetchP = fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': CFG.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: maxTokens,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const resp = await Promise.race([fetchP, timeout]);
    if(!resp.ok){
      let msg = 'HTTP ' + resp.status;
      try{ const d=await resp.json(); msg += ': ' + (d.error?.message||JSON.stringify(d)); }catch(_){}
      if(resp.status===401) msg = 'Invalid Anthropic API key — check ⚙ Settings';
      if(resp.status===429) msg = 'Rate limit. Wait 30s and try again.';
      throw new Error(msg);
    }
    const data = await resp.json();
    if(data.error) throw new Error('Claude: ' + data.error.message);
    return (data.content||[]).map(c=>c.text||'').join('').trim();
  }
}

  var POS_N={'1':'PG','2':'SG','3':'SF','4':'PF','5':'C'};

    var f2=S.names.filter(function(n){return n.trim();});

      if(bench>=0){var t=f2[idx];f2[idx]=f2[bench];f2[bench]=t;}

      var t=f2[idx];f2[idx]=f2[COURT_SIZE-1];f2[COURT_SIZE-1]=t;

    renderSetup(true);

    var s=new Set(S.h2PresetIds);
    if(s.has(idx)){s.delete(idx);S.h2PresetIds=s;if(!s.size)S.useH2Preset=false;}
    else if(s.size<COURT_SIZE){s.add(idx);S.h2PresetIds=s;S.useH2Preset=s.size===COURT_SIZE;}

  };

    var s=new Set(S.finalPresetIds);

    +conflicts.map(function(pair,i){
      return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;padding:5px 8px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-radius:7px">'

        +'<button onclick="S.aiParams.benchConflicts.splice('+i+',1);renderSetup(true)" style="background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;line-height:1">x</button>'
      +'</div>';
    }).join('')
    +'<div style="display:flex;gap:5px;align-items:center;margin-top:4px">'
      +'<select id="ai-ca" style="flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px;font-size:11px">'+optHtml+'</select>'

function extractJSON(str){
  str=(str||'').replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/i,'').trim();
  let start=str.indexOf('{"');
  if(start===-1)start=str.indexOf('{');
  if(start===-1)return null;
  let depth=0,inStr=false,esc=false;
  for(let i=start;i<str.length;i++){
    const ch=str[i];
    if(esc){esc=false;continue;}
    if(ch==='\\'&&inStr){esc=true;continue;}
    if(ch==='"'&&!esc){inStr=!inStr;continue;}
    if(inStr)continue;
    if(ch==='{')depth++;
    else if(ch==='}'){depth--;if(depth===0)return str.slice(start,i+1);}
  }
  let partial=str.slice(start).replace(/,\s*$/,'').replace(/"[^\n"]*$/,'"').replace(/,\s*"[^"]*$/,'');
  let d=0,a=0;inStr=false;esc=false;
  for(let i=0;i<partial.length;i++){
    const ch=partial[i];
    if(esc){esc=false;continue;}
    if(ch==='\\'&&inStr){esc=true;continue;}
    if(ch==='"'&&!esc){inStr=!inStr;continue;}
    if(inStr)continue;
    if(ch==='{')d++;else if(ch==='}')d--;
    else if(ch==='[')a++;else if(ch===']')a--;
  }
  let rep=partial;
  while(a-->0)rep+=']';
  while(d-->0)rep+='}';
  try{JSON.parse(rep);return rep;}catch(_){}
  return null;
}


// Global parseAtTime (also defined locally in sub plan functions)
function parseAtTime(t){
  if(!t) return 0;
  var parts=String(t).split(':');
  var secs=parseInt(parts[0])*60+(parseInt(parts[1])||0);
  return isNaN(secs)?0:secs;
}


// === AI helpers ===
function snapToCleanInterval(secs){
  var m=Math.floor(secs/60),s=secs%60;
  var clean=[0,20,30,40,60];
  var best=clean.reduce(function(a,b){return Math.abs(b-s)<Math.abs(a-s)?b:a;});
  return best===60?(m+1)*60:m*60+best;
}

function assignPositionsToGroup(names){
  var result={},used=new Set();
  var players=names.map(function(n){
    var team=T.teams.find(function(t){return t.id===T.activeTeamId;});
    var tp=team&&team.players.find(function(p){return playerDisplayName(p)===n;});
    var r=tp?getPlayerRatings(T.activeTeamId,tp.id):{};
    return{name:n,pos:+r.position||0,pos2:+r.position2||0,pos3:+r.position3||0};
  });
  [function(p){return p.pos;},function(p){return p.pos2;},function(p){return p.pos3;}].forEach(function(g){
    players.forEach(function(p){if(!result[p.name]){var v=g(p);if(v&&!used.has(v)){result[p.name]=v;used.add(v);}}});
  });
  var rem=[1,2,3,4,5].filter(function(n){return!used.has(n);});
  players.forEach(function(p){if(!result[p.name]&&rem.length)result[p.name]=rem.shift();});
  return result;
}

function computePlayerTargets(filtered){
  var total=gameTotalSecs(),fair=Math.round(total*COURT_SIZE/filtered.length);
  var deltas=S.aiParams.playerDeltas||{};
  var targets={};
  filtered.forEach(function(n){targets[n]=Math.max(0,Math.min(total,fair+(deltas[n]||0)));});

  // Finals mode: proportionally boost higher-rated players across all plans
  if(S.finalsMode){
    var team=T.teams.find(function(t){return t.id===T.activeTeamId;});
    var rated=filtered.map(function(n){
      var pl=team&&team.players.find(function(p){return playerDisplayName(p)===n;});
      var r=pl?getPlayerRatings(T.activeTeamId,pl.id):{};
      var ovr=0,cnt=0;
      ['layup','jumpshot','three','passing','dribble','sharing','defplayer','defset',
       'offdef','reboff','rebdef','setplays','composure','speed','energy'].forEach(function(k){
        if(r[k]!==undefined){ovr+=Number(r[k]);cnt++;}
      });
      return{n:n,ovr:cnt>0?ovr/cnt:5};
    });
    var maxOvr=Math.max.apply(null,rated.map(function(p){return p.ovr;}));
    if(maxOvr>0){
      rated.forEach(function(p){
        // Proportional bonus: top player gets +15% of fair share, scales down linearly
        var bonus=Math.round((p.ovr/maxOvr-0.7)*fair*0.5);
        if(bonus>0)targets[p.n]=Math.min(total,targets[p.n]+bonus);
      });
    }
  }

  // Normalise so allocations sum to total court time available
  var courtTime=total*COURT_SIZE,rawSum=Object.values(targets).reduce(function(a,b){return a+b;},0);
  if(rawSum>0&&Math.abs(rawSum-courtTime)>30){
    var scale=courtTime/rawSum;
    Object.keys(targets).forEach(function(n){targets[n]=Math.round(targets[n]*scale);});
  }
  return targets;
}


function inferPresetsFromSubPlan(){
  var filtered=S.names.filter(function(n){return n.trim();});
  if(filtered.length<COURT_SIZE||!S.subPlan)return;
  var court=new Set(filtered.slice(0,COURT_SIZE).map(function(n){return filtered.indexOf(n);}));
  (S.subPlan.h1||[]).filter(Boolean).forEach(function(sub){
    (sub.off||[]).forEach(function(n){var i=filtered.indexOf(n);if(i>=0)court.delete(i);});
    (sub.on||[]).forEach(function(n){var i=filtered.indexOf(n);if(i>=0)court.add(i);});
  });
  if(court.size===COURT_SIZE){S.h2PresetIds=new Set(court);S.useH2Preset=true;}
  var h2c=new Set(S.h2PresetIds.size===COURT_SIZE?S.h2PresetIds:court);
  (S.subPlan.h2||[]).filter(Boolean).forEach(function(sub){
    (sub.off||[]).forEach(function(n){var i=filtered.indexOf(n);if(i>=0)h2c.delete(i);});
    (sub.on||[]).forEach(function(n){var i=filtered.indexOf(n);if(i>=0)h2c.add(i);});
  });
  if(h2c.size===COURT_SIZE){S.finalPresetIds=new Set(h2c);S.useFinalPreset=true;}
}

function calcPlanActualTimes(plan,filtered){
  var halfSecs=usesQuarters()?20*60:S.h1Dur*60;
  var times=Object.fromEntries(filtered.map(function(n){return[n,0];}));
  function sim(subs,startNames,halfDur){
    var court=new Set(startNames);var last=0;
    var evts=[].concat(subs||[]).sort(function(a,b){return parseAtTime(a.atTime)-parseAtTime(b.atTime);});
    evts.forEach(function(sub){
      var t=parseAtTime(sub.atTime);
      if(t<=last||t>halfDur)return;
      court.forEach(function(n){if(times[n]!==undefined)times[n]+=t-last;});
      last=t;
      (sub.off||[]).forEach(function(n){court.delete(n);});
      (sub.on||[]).forEach(function(n){court.add(n);});
    });
    court.forEach(function(n){if(times[n]!==undefined)times[n]+=halfDur-last;});
  }
  var h1Start=filtered.slice(0,COURT_SIZE);
  sim(plan.h1,h1Start,halfSecs);
  var h2Start=plan.h2Starting5&&plan.h2Starting5.length===COURT_SIZE?plan.h2Starting5:h1Start;
  sim(plan.h2,h2Start,halfSecs);
  return times;
}

// ── Plan D: client-side equal time with 2-player preferred subs ──
function buildPlanD(adjTargets){
  var filtered=S.names.filter(function(n){return n.trim();});
  var halfSecs=usesQuarters()?20*60:S.h1Dur*60;
  var total=gameTotalSecs();
  var fair=Math.round(total*COURT_SIZE/filtered.length);
  // Use adjTargets if provided, else equal targets
  var tgts=adjTargets||Object.fromEntries(filtered.map(function(n){return[n,fair];}));
  var h2PresetNames=S.useH2Preset&&S.h2PresetIds.size===COURT_SIZE
    ?[...S.h2PresetIds].map(function(i){return filtered[i];}).filter(Boolean):null;

  // Check if any deltas are set
  var hasDeltas=Object.values(tgts).some(function(t){return Math.abs(t-fair)>30;});

  var plan={id:'D',label:'Equal time',
    rationale:hasDeltas
      ?'Target-time schedule. Every player achieves their target within ~1 minute. Clean sub intervals.'
      :'Equal playing time for all players. Clean :00 :30 :20 :40 sub intervals.',
    h1:[],h2:[],h2Starting5:[],finishing5:[],expectedTimes:{}};

  function buildHalf(halfDur,startNames){
    var n=filtered.length;
    if(n<=COURT_SIZE)return[];
    // Half-targets: each player's court time per half
    var halfTgt=Object.fromEntries(filtered.map(function(nm){
      return[nm,(tgts[nm]||fair)/2];
    }));
    // n-1 individual subs, target-aware — NO merging to preserve accuracy
    var timeOn=Object.fromEntries(filtered.map(function(nm){return[nm,0];}));
    var onCourt=new Set(startNames);
    var last=0;
    var subs=[];
    var slotDur=halfDur/n;
    for(var slot=1;slot<n;slot++){
      var rawT=slotDur*slot;
      var dt=rawT-last;
      onCourt.forEach(function(nm){timeOn[nm]+=dt;});
      last=rawT;
      // Off: who has highest timeOn/halfTarget ratio (most ahead of their proportional target)
      var courtArr=[...onCourt].sort(function(a,b){
        var ra=halfTgt[a]>0?timeOn[a]/halfTgt[a]:timeOn[a];
        var rb=halfTgt[b]>0?timeOn[b]/halfTgt[b]:timeOn[b];
        return rb-ra;
      });
      // On: who has lowest timeOn/halfTarget ratio (most behind their target)
      var benchArr=filtered.filter(function(nm){return!onCourt.has(nm);}).sort(function(a,b){
        var ra=halfTgt[a]>0?timeOn[a]/halfTgt[a]:0;
        var rb=halfTgt[b]>0?timeOn[b]/halfTgt[b]:0;
        return ra-rb;
      });
      if(!benchArr.length)continue;
      var off=courtArr[0],on=benchArr[0];
      onCourt.delete(off);onCourt.add(on);
      var cleanT=snapToCleanInterval(rawT);
      if(subs.length){
        var prevT=parseAtTime(subs[subs.length-1].atTime);
        if(cleanT<=prevT)cleanT=snapToCleanInterval(prevT+60);
      }
      cleanT=Math.max(30,Math.min(halfDur-30,cleanT));
      subs.push({subNum:subs.length+1,
        atTime:Math.floor(cleanT/60)+':'+(String(cleanT%60).padStart(2,'0')),
        off:[off],on:[on],note:'Target rotation'});
    }
    return subs;
  }

  var h1Names=filtered.slice(0,COURT_SIZE);
  plan.h1=buildHalf(halfSecs,h1Names);
  var h2Names=h2PresetNames||h1Names;
  plan.h2Starting5=[].concat(h2Names);
  plan.h2=buildHalf(halfSecs,h2Names);

  var actual=calcPlanActualTimes(plan,filtered);
  plan.expectedTimes=Object.fromEntries(filtered.map(function(n){
    var t=actual[n]||0;
    return[n,Math.floor(t/60)+':'+(String(t%60).padStart(2,'0'))];
  }));
  return plan;
}



function generateAIRotation(){
  // Null-safety
  if(!S.aiParams)S.aiParams={};
  if(!S.aiParams.playerDeltas)S.aiParams.playerDeltas={};
  if(!S.aiParams.benchConflicts)S.aiParams.benchConflicts=[];
  if(S.aiParams.minBenchDuration===undefined)S.aiParams.minBenchDuration=3;
  if(S.aiParams.maxBenchDuration===undefined)S.aiParams.maxBenchDuration=12;

  var filtered=S.names.filter(function(n){return n.trim();});
  if(filtered.length<COURT_SIZE){alert('Add at least '+COURT_SIZE+' players first.');return;}

  showAIRotationModal(null,true,filtered,0);

  var total=gameTotalSecs();
  var fair=Math.round(total*COURT_SIZE/filtered.length);
  var halfSecs=usesQuarters()?20*60:S.h1Dur*60;
  var courtTime=total*COURT_SIZE;

  // ── Fatigue map ──
  var fatigueMap={};
  var team2=T.teams.find(function(t){return t.id===T.activeTeamId;});
  filtered.forEach(function(n){
    var pl=team2&&team2.players.find(function(p){return playerDisplayName(p)===n;});
    var r=pl?getPlayerRatings(T.activeTeamId,pl.id):{};
    fatigueMap[n]=r.fatigue||'Normal';
  });

  // ── Get player ratings ──
  var ratingMap={};
  var posMap={};   // name → [pos1,pos2,pos3]
  filtered.forEach(function(n){
    var pl=team2&&team2.players.find(function(p){return playerDisplayName(p)===n;});
    var r=pl?getPlayerRatings(T.activeTeamId,pl.id):{};
    var ovr=0,cnt=0;
    ['layup','jumpshot','three','passing','dribble','sharing','defplayer','defset',
     'offdef','reboff','rebdef','setplays','composure','speed','energy'].forEach(function(k){
      if(r[k]!==undefined){ovr+=Number(r[k]);cnt++;}
    });
    ratingMap[n]=cnt>0?ovr/cnt:5;
    posMap[n]=[+r.position||0,+r.position2||0,+r.position3||0].filter(function(p){return p>0;});
  });

  // ── Base targets from sliders + fatigue ──
  var p=S.aiParams;
  var deltas=p.playerDeltas||{};
  var baseTgts={};
  filtered.forEach(function(n){baseTgts[n]=Math.max(0,Math.min(total,fair+(deltas[n]||0)));});
  // Fatigue caps
  filtered.forEach(function(n){
    var fat=fatigueMap[n];
    if(fat==='Managed Minutes')baseTgts[n]=Math.min(baseTgts[n],Math.round(fair*0.75));
    if(fat==='Injury Return/Illness')baseTgts[n]=Math.min(baseTgts[n],Math.round(fair*0.60));
  });
  function normTgts(raw){
    var s=Object.values(raw).reduce(function(a,b){return a+b;},0);
    var sc2=s>0?courtTime/s:1;
    var out={};Object.keys(raw).forEach(function(k){out[k]=Math.round(raw[k]*sc2);});
    return out;
  }
  baseTgts=normTgts(baseTgts);

  // ── Presets ──
  var h2PresetNames=S.useH2Preset&&S.h2PresetIds.size===COURT_SIZE&&S.aiAdheresToPresets
    ?[...S.h2PresetIds].map(function(i){return filtered[i];}).filter(Boolean):null;
  var finalPresetNames=S.useFinalPreset&&S.finalPresetIds.size===COURT_SIZE&&S.aiAdheresToPresets
    ?[...S.finalPresetIds].map(function(i){return filtered[i];}).filter(Boolean):null;
  var h1Start=filtered.slice(0,COURT_SIZE);
  var h2Start=h2PresetNames||h1Start;

  // ── Min bench rest (seconds) ──
  var minBenchSecs=(p.minBenchDuration||3)*60;
  var maxBenchSecs=(p.maxBenchDuration||12)*60;
  // Preferred sub size from "I SPECIFY" settings (Plan D always uses individual subs)
  var preferPaired=(!p.aiTiming)&&(p.minSubsPerSub||1)>=2;

  // ── Core half-builder ──
  function buildHalf(halfDur,startNames,tgts,windowFn,posCheck){
    var halfTgt={};filtered.forEach(function(nm){halfTgt[nm]=(tgts[nm]||fair)/2;});
    var timeOn={};filtered.forEach(function(nm){timeOn[nm]=0;});
    var timeBench={};filtered.forEach(function(nm){timeBench[nm]=0;});
    var lastOnAt={};filtered.forEach(function(nm){lastOnAt[nm]=startNames.indexOf(nm)>=0?0:-1;});
    var lastOffAt={};filtered.forEach(function(nm){lastOffAt[nm]=-1;});
    var onCourt=new Set(startNames);
    var subs=[];var last=0;
    var events=windowFn(halfDur);
    events.forEach(function(ev){
      var dt=ev.t-last;
      onCourt.forEach(function(nm){timeOn[nm]+=dt;});
      filtered.filter(function(nm){return!onCourt.has(nm);}).forEach(function(nm){timeBench[nm]+=dt;});
      last=ev.t;
      var size=ev.size||1;

      // Off candidates: any court player — NO time-based blocking
      // (ratio sort naturally handles rotation order without forced minimums)
      var offCands=[...onCourt];
      if(posCheck&&offCands.length>size){
        var posFiltered=offCands.filter(function(nm){
          var remaining=new Set(onCourt);remaining.delete(nm);
          return posCheck(remaining,filtered,posMap);
        });
        if(posFiltered.length>=size)offCands=posFiltered;
      }

      // On candidates: bench players who have rested >= minBenchSecs since coming OFF
      var onCands=filtered.filter(function(nm){
        if(onCourt.has(nm))return false;
        if(lastOffAt[nm]>=0&&ev.t-lastOffAt[nm]<minBenchSecs)return false;
        return true;
      });
      if(onCands.length<size)onCands=filtered.filter(function(nm){return!onCourt.has(nm);});

      // Sort off: highest timeOn/halfTarget ratio (most ahead of target) comes off first
      offCands.sort(function(a,b){
        var ra=halfTgt[a]>0?timeOn[a]/halfTgt[a]:timeOn[a];
        var rb=halfTgt[b]>0?timeOn[b]/halfTgt[b]:timeOn[b];
        return rb-ra;
      });
      // Sort on: lowest ratio comes on; overdue players (exceed maxBench) get top priority
      onCands.sort(function(a,b){
        var aOverdue=maxBenchSecs>0&&timeBench[a]>=maxBenchSecs;
        var bOverdue=maxBenchSecs>0&&timeBench[b]>=maxBenchSecs;
        if(aOverdue&&!bOverdue)return -1;
        if(bOverdue&&!aOverdue)return 1;
        var ra=halfTgt[a]>0?timeOn[a]/halfTgt[a]:0;
        var rb=halfTgt[b]>0?timeOn[b]/halfTgt[b]:0;
        return ra-rb;
      });

      var cnt=Math.min(size,offCands.length,onCands.length);
      if(!cnt)return;
      var fOff=offCands.slice(0,cnt);
      var fOn=onCands.slice(0,cnt);
      fOff.forEach(function(nm){onCourt.delete(nm);timeBench[nm]=0;lastOffAt[nm]=ev.t;});
      fOn.forEach(function(nm){onCourt.add(nm);lastOnAt[nm]=ev.t;timeBench[nm]=0;});

      var cleanT=snapToCleanInterval(ev.t);
      if(subs.length){
        var prev=parseAtTime(subs[subs.length-1].atTime);
        if(cleanT<=prev)cleanT=snapToCleanInterval(prev+60);
      }
      cleanT=Math.max(30,Math.min(halfDur-30,cleanT));
      subs.push({subNum:subs.length+1,
        atTime:Math.floor(cleanT/60)+':'+(String(cleanT%60).padStart(2,'0')),
        off:fOff,on:fOn,note:ev.note||''});
    });
    // Post: enforce finishing5 preset
    if(finalPresetNames&&finalPresetNames.length===COURT_SIZE){
      var finalSet=new Set(finalPresetNames);
      var wrongOff=[...onCourt].filter(function(nm){return!finalSet.has(nm);});
      var wrongOn=finalPresetNames.filter(function(nm){return!onCourt.has(nm);});
      if(wrongOff.length&&wrongOn.length){
        var cnt2=Math.min(wrongOff.length,wrongOn.length);
        var cleanT=snapToCleanInterval(halfDur-120);
        if(!subs.length||parseAtTime(subs[subs.length-1].atTime)<cleanT-30){
          subs.push({subNum:subs.length+1,
            atTime:Math.floor(cleanT/60)+':'+(String(cleanT%60).padStart(2,'0')),
            off:wrongOff.slice(0,cnt2),on:wrongOn.slice(0,cnt2),note:'Finishing lineup'});
        }
      }
    }
    return subs;
  }

  // ── Window generators ──
  var n=filtered.length;
  // stdW: n-1 individual 1-player windows (required for equal time precision)
  function stdW(halfDur){
    var ev=[];var sl=halfDur/n;
    for(var i=1;i<n;i++)ev.push({t:sl*i,size:1});
    return ev;
  }
  // pairedW / blockW: merge adjacent pairs → 2-player windows
  // For odd squad sizes (7, 9, 11): n-1 is even → all pairs → insufficient transitions.
  // Add one extra single-player window so total transitions = n (enables near-equal time).
  function pairedW(halfDur){
    var raw=[];var sl=halfDur/n;
    for(var i=1;i<n;i++)raw.push(sl*i);
    var ev=[];var i=0;
    while(i<raw.length){
      if(i+1<raw.length){ev.push({t:(raw[i]+raw[i+1])/2,size:2,note:'2-player sub'});i+=2;}
      else{ev.push({t:raw[i],size:1,note:'Sub'});i++;}
    }
    // Odd squad: n-1 is even so no natural remainder above.
    // Add a corrective single-player window at the n/(n+1) point to get n total transitions.
    if(n%2===1){
      var extraT=halfDur*(n)/(n+1);
      ev.push({t:extraT,size:1,note:'Balance sub'});
      ev.sort(function(a,b){return a.t-b.t;});
    }
    return ev;
  }
  function blockW(halfDur){
    var raw=[];var sl=halfDur/n;
    for(var i=1;i<n;i++)raw.push(sl*i);
    var ev=[];var i=0;
    while(i<raw.length){
      if(i+1<raw.length){ev.push({t:(raw[i]+raw[i+1])/2,size:2,note:'Block swap'});i+=2;}
      else{ev.push({t:raw[i],size:1,note:'Block swap'});i++;}
    }
    return ev;
  }
  // wFnFor: choose window function per plan
  // All plans honour user's sub-size preference.
  // Plan D uses pairedW when preferPaired=true; any rounding excess goes to top-ranked players via targets.
  // Plan B always uses paired subs for block strategy.
  function wFnFor(planId){
    if(planId==='B')return blockW;
    return preferPaired?pairedW:stdW;
  }
  // ── Position check ──
  function posOK(remaining,all,posMap){
    var hasBH=false,hasIn=false;
    remaining.forEach(function(nm){
      var pp=posMap[nm]||[];
      if(pp[0]<=2||pp[1]<=2)hasBH=true;
      if(pp[0]>=4||pp[1]>=4)hasIn=true;
    });
    // Only enforce if we actually have those position types in the squad
    var squadHasBH=all.some(function(nm){var pp=posMap[nm]||[];return pp[0]<=2||pp[1]<=2;});
    var squadHasIn=all.some(function(nm){var pp=posMap[nm]||[];return pp[0]>=4||pp[1]>=4;});
    return (!squadHasBH||hasBH)&&(!squadHasIn||hasIn);
  }

  // ── Rating targets ──
  var ratings=Object.values(ratingMap);
  var maxR=Math.max.apply(null,ratings.concat([5]));
  var minR=Math.min.apply(null,ratings.concat([5]));
  var rRange=maxR-minR||1;

  // Plan D targets: equal time by default.
  // When using 2-player subs (preferPaired), paired windows can't achieve perfect equality —
  // any rounding excess goes to the top-ranked players rather than being arbitrary.
  function dTgts(){
    var t={};filtered.forEach(function(n){t[n]=baseTgts[n]||fair;});
    if(preferPaired){
      // Sort players by rating descending
      var ranked=[].concat(filtered).sort(function(a,b){return (ratingMap[b]||5)-(ratingMap[a]||5);});
      // Top 2-3 get a small nudge (+60s) to absorb rounding; bottom players get correspondingly less
      var nBoost=Math.min(3,Math.ceil(filtered.length/4));
      ranked.slice(0,nBoost).forEach(function(n){t[n]+=60;});
      ranked.slice(-nBoost).forEach(function(n){t[n]-=60;});
    }
    return normTgts(t);
  }
  function aTgts(){
    var t={};filtered.forEach(function(n){
      var normR=(ratingMap[n]-minR)/rRange;
      t[n]=(baseTgts[n]||fair)+Math.round((normR-0.5)*fair*0.16);
    });
    return normTgts(t);
  }
  // Plan C: ±35% rating boost, 10min floor
  function cTgts(){
    var t={};filtered.forEach(function(n){
      var normR=(ratingMap[n]-minR)/rRange;
      t[n]=(baseTgts[n]||fair)+Math.round((normR-0.5)*fair*0.70);
    });
    filtered.forEach(function(n){t[n]=Math.max(600,t[n]);});
    return normTgts(t);
  }

  // ── Build all 5 plans ──
  function makePlan(id,label,rationale,tgts,wFn,posCheck){
    var plan={id:id,label:label,rationale:rationale,
      h1:[],h2:[],h2Starting5:[],finishing5:[],expectedTimes:{}};
    plan.h1=buildHalf(halfSecs,h1Start,tgts,wFn,posCheck);
    plan.h2Starting5=[].concat(h2Start);
    plan.h2=buildHalf(halfSecs,h2Start,tgts,wFn,posCheck);
    if(finalPresetNames)plan.finishing5=[].concat(finalPresetNames);
    var actual=calcPlanActualTimes(plan,filtered);
    plan.expectedTimes=Object.fromEntries(filtered.map(function(n){
      var t=actual[n]||0;
      return[n,Math.floor(t/60)+':'+(String(t%60).padStart(2,'0'))];
    }));
    return plan;
  }

  var at=aTgts(), ct=cTgts(), dt=dTgts();
  var results=[
    makePlan('D','Equal time',
      preferPaired
        ?'2-player subs throughout. As equal as possible — unavoidable extra time goes to highest-rated players.'
        :'Individual subs for mathematically precise equal time. All players within ~1 minute of target.',
      dt,wFnFor('D'),null),
    makePlan('A','Balanced',
      'Even time with a small boost for higher-rated players. '+(preferPaired?'2-player subs as specified.':''),
      at,wFnFor('A'),null),
    makePlan('B','Block',
      '2-player unit swaps keep lineup cohesion. Fewer but larger substitutions.',
      baseTgts,wFnFor('B'),null),
    makePlan('C','Strength-first',
      'Higher-rated players get significantly more time. Every player still gets minimum 10 minutes. '+(preferPaired?'2-player subs as specified.':''),
      ct,wFnFor('C'),null),
    makePlan('E','Position-balanced',
      'Substitutions maintain positional coverage — always a ball-handler and interior player on court. '+(preferPaired?'2-player subs as specified.':''),
      baseTgts,wFnFor('E'),function(rem){return posOK(rem,filtered,posMap);}),
  ];

  window._lastAIResult={plans:results};
  window._lastAIFiltered=filtered;
  showAIRotationModal({plans:results},false,filtered);
}






function applyAIRotation(plan, filtered){
  const nameToIdx = {};
  filtered.forEach((n,i)=>{ nameToIdx[n]=i; });

  // Safe fuzzy lookup - prefers exact matches, avoids ambiguous guesses
  function findIdx(aiName){
    if(!aiName) return undefined;
    const s = String(aiName).trim();
    if(!s) return undefined;
    // 1. Exact
    if(nameToIdx[s] !== undefined) return nameToIdx[s];
    const lower = s.toLowerCase();
    // 2. Case-insensitive exact
    for(const [n,i] of Object.entries(nameToIdx)){
      if(n.toLowerCase()===lower) return i;
    }
    // 3. Roster name starts with AI name — safe only if unique match
    const starts = Object.entries(nameToIdx).filter(([n])=>n.toLowerCase().startsWith(lower));
    if(starts.length===1) return starts[0][1];
    if(starts.length>1){
      const exact = starts.filter(([n])=>n.toLowerCase().split(' ')[0]===lower);
      if(exact.length===1) return exact[0][1];
      return undefined; // ambiguous
    }
    // 4. AI name exactly matches a player's first word
    const fw = Object.entries(nameToIdx).filter(([n])=>{
      const fn = n.toLowerCase().split(' ')[0];
      return lower===fn || lower.startsWith(fn+' ');
    });
    if(fw.length===1) return fw[0][1];
    return undefined; // no safe match
  }

  function parseHalf(subs){
    return (subs||[]).map(sub=>{
      // Track used indices to prevent duplicate matches collapsing Set size
      const usedOff=new Set(), usedOn=new Set();
      const offSet=new Set(), onSet=new Set();
      (sub.off||[]).forEach(name=>{
        const idx=findIdx(name);
        if(idx!==undefined&&!usedOff.has(idx)){offSet.add(idx);usedOff.add(idx);}
      });
      (sub.on||[]).forEach(name=>{
        const idx=findIdx(name);
        if(idx!==undefined&&!usedOn.has(idx)){onSet.add(idx);usedOn.add(idx);}
      });
      // Enforce balance — off and on must be equal to keep 5 on court always
      while(offSet.size>onSet.size){const l=[...offSet].pop();offSet.delete(l);}
      while(onSet.size>offSet.size){const l=[...onSet].pop();onSet.delete(l);}
      return {off:offSet, on:onSet, atTime:sub.atTime||null};
    });
  }

  // Auto-adjust sub intervals so slot count matches AI sub count
  const h1Subs=(plan.h1||[]).length;
  const h2Subs=(plan.h2||[]).length;
  const _halfSecs=usesQuarters()?20*60:S.h1Dur*60;
  if(h1Subs>0){ S.h1Int=Math.max(20,Math.floor(_halfSecs/(h1Subs+1))); }
  if(h2Subs>0){ S.h2Int=Math.max(20,Math.floor(_halfSecs/(h2Subs+1))); }

  // Apply AI starting 5 — reorder S.names so getCourtAtPlanPoint tracks correctly
  if(plan.starting5&&plan.starting5.length===COURT_SIZE){
    const s5Ids=plan.starting5.map(findIdx).filter(i=>i!==undefined);
    const uniq=[...new Set(s5Ids)];
    if(uniq.length===COURT_SIZE){
      const benchIds=filtered.map((_,i)=>i).filter(i=>!uniq.includes(i));
      S.names=[...uniq,...benchIds].map(i=>filtered[i]);
    }
  }

  const newFiltered=S.names.filter(n=>n.trim());
  const newNameToIdx={};
  newFiltered.forEach((n,i)=>{ newNameToIdx[n]=i; });

  // Helper: remap original filtered index → new filtered index
  function remap(origIdx){
    const name=filtered[origIdx];
    return name!==undefined?newNameToIdx[name]:undefined;
  }

  // Apply H2 starting 5
  if(plan.h2Starting5&&plan.h2Starting5.length===COURT_SIZE){
    const ids=plan.h2Starting5.map(findIdx).map(remap).filter(i=>i!==undefined);
    const uniq=[...new Set(ids)];
    if(uniq.length===COURT_SIZE){S.h2PresetIds=new Set(uniq);S.useH2Preset=true;}
  }

  // Apply finishing 5
  if(plan.finishing5&&plan.finishing5.length===COURT_SIZE){
    const ids=plan.finishing5.map(findIdx).map(remap).filter(i=>i!==undefined);
    const uniq=[...new Set(ids)];
    if(uniq.length===COURT_SIZE){S.finalPresetIds=new Set(uniq);S.useFinalPreset=true;}
  }

  // Parse subs then remap to new order
  const h1Plan=parseHalf(plan.h1).map(sub=>({
    off:new Set([...sub.off].map(remap).filter(i=>i!==undefined)),
    on: new Set([...sub.on ].map(remap).filter(i=>i!==undefined)),
    atTime: sub.atTime
  }));
  const h2Plan=parseHalf(plan.h2).map(sub=>({
    off:new Set([...sub.off].map(remap).filter(i=>i!==undefined)),
    on: new Set([...sub.on ].map(remap).filter(i=>i!==undefined)),
    atTime: sub.atTime
  }));

  const totalSubs=h1Plan.length+h2Plan.length;
  const filledSubs=[...h1Plan,...h2Plan].filter(s=>s.off.size>0&&s.on.size>0).length;

  S.subPlan={h1:h1Plan,h2:h2Plan};
  S.useSubPlan=true;
  closeAIRotationModal();
  renderSetup(true);

  if(filledSubs===0&&totalSubs>0){
    showToast('⚠ Plan loaded but names didn\'t match — check roster');
  } else {
    showToast('Plan '+(plan.label||plan.id)+' loaded ✓ ('+filledSubs+'/'+totalSubs+' subs) — tap 🤖 AI Plan to switch');
  }
}

function renderPlanBody(plan){
  if(plan._failed){
    return '<div style="padding:20px;text-align:center;color:var(--warn);font-size:12px;line-height:1.6">'
      +'<div style="font-size:16px;margin-bottom:8px">Plan '+plan.id+' failed to generate</div>'
      +'<div style="font-size:11px;color:var(--dim)">'+plan.rationale+'</div>'
      +'<div style="font-size:10px;color:var(--dim);margin-top:8px">Check your API key in ⚙ Settings and try regenerating.</div>'
    +'</div>';
  }
  let html = '';
  // Rationale
  if(plan.rationale){
    html += '<div class="ai-rot-section"><div class="ai-rot-section-title">STRATEGY</div>' +
      '<div style="font-size:12px;color:var(--text);line-height:1.6;">' + plan.rationale + '</div></div>';
  }
  // Subs per half
  ['h1','h2'].forEach(function(half){
    const subs = plan[half]||[];
    if(!subs.length) return;
    const halfLabel = half==='h1'?'1ST HALF':'2ND HALF';
    let rows = '';
    subs.forEach(function(s){
      rows += '<div class="ai-rot-sub-row">' +
        '<span class="ai-rot-sub-num">SUB ' + s.subNum + '<br><span style="font-size:9px;color:var(--dim)">@' + s.atTime + '</span></span>' +
        '<span class="ai-rot-off">▼ ' + (s.off||[]).join(', ') + '</span>' +
        '<span class="ai-rot-on">▲ ' + (s.on||[]).join(', ') + '</span>' +
        '</div>';
      if(s.note) rows += '<div style="font-size:10px;color:var(--dim);padding:0 0 4px 52px;font-style:italic">' + s.note + '</div>';
    });
    html += '<div class="ai-rot-section"><div class="ai-rot-section-title">' + halfLabel + ' — ' + subs.length + ' SUB' + (subs.length!==1?'S':'') + '</div>' + rows + '</div>';
  });
  // Expected times
  const et = plan.expectedTimes || {};
  if(Object.keys(et).length){
    let timeRows = '';
    Object.entries(et).sort((a,b)=>b[1].localeCompare(a[1])).forEach(function(e){
      timeRows += '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);">' +
        '<span style="font-size:12px;color:var(--text);">' + e[0] + '</span>' +
        '<span style="font-family:Impact,sans-serif;font-size:13px;color:var(--green);">' + e[1] + '</span></div>';
    });
    html += '<div class="ai-rot-section"><div class="ai-rot-section-title">EXPECTED PLAYING TIME</div>' + timeRows + '</div>';
  }
  return html;
}

function selectAIPlan(idx){
  window._aiRotSelectedPlan = idx;

  plans.forEach(function(p,i){

function renderSetup(restoreScroll){
  // Save scroll from the .setup div inside #app (that's the actual scrollable element)
  const savedScroll = restoreScroll ? ($('app').querySelector('.setup')||{scrollTop:0}).scrollTop : 0;

// ── SCORE TRACKING ─────────────────────────────────────────────
function calcScoreTotals(){
  var us=0, them=0;
  (S.scoreLog||[]).forEach(function(e){ if(e.who==='us') us+=e.pts; else them+=e.pts; });
  return {us:us, them:them};
}

function buildScoreDiff(){
  var pts=[{t:0,d:0}];
  var us=0, them=0;
  (S.scoreLog||[]).forEach(function(e){
    if(e.who==='us') us+=e.pts; else them+=e.pts;
    pts.push({t:e.t, d:us-them});
  });
  if(pts[pts.length-1].t<gameTotalSecs()) pts.push({t:gameTotalSecs(), d:us-them});
  return pts;
}

function addScoreEvent(who, pts){
  if(!S.scoreLog) S.scoreLog=[];
  S.scoreLog.push({t:S.gameTime, who:who, pts:pts});
  saveState();
  // Update DOM directly without full re-render
  updateScoreBarDOM();
}

function undoScoreEvent(){
  if(!S.scoreLog||!S.scoreLog.length) return;
  S.scoreLog.pop();
  saveState();
  updateScoreBarDOM();
}

function toggleScoreBar(){
  S.scoreBarExpanded = !S.scoreBarExpanded;
  var bar = document.getElementById('score-bar');
  if(bar) bar.outerHTML = renderScoreBarHTML();
}

// Fast DOM update for score bar without full game re-render
function updateScoreBarDOM(){
  var bar = document.getElementById('score-bar');
  if(bar) bar.outerHTML = renderScoreBarHTML();
}

// Mini differential SVG for score bar
function scoreDiffSVG(width, height, compact){
  var data = buildScoreDiff();
  var totals = calcScoreTotals();
  var LP=2, RP=2;
  var cw=width-LP-RP, ch=height;
  var zeroY=ch/2;
  var maxD=Math.max(6, Math.max.apply(null, data.map(function(d){return Math.abs(d.d);})));
  var sc=(zeroY-2)/maxD;
  var total=gameTotalSecs();
  function xf(t){ return LP+(Math.min(t,total)/total)*cw; }
  function yf(d){ return Math.max(1,Math.min(ch-1,zeroY-d*sc)); }

  var posA='M'+xf(0)+' '+zeroY, negA='M'+xf(0)+' '+zeroY;
  var line='M'+xf(data[0].t)+' '+yf(data[0].d);
  for(var i=1;i<data.length;i++){
    var px=xf(data[i-1].t), cx=xf(data[i].t);
    var py=yf(data[i-1].d), cy=yf(data[i].d);
    posA+=' L'+px+' '+Math.min(zeroY,py)+' L'+cx+' '+Math.min(zeroY,cy);
    negA+=' L'+px+' '+Math.max(zeroY,py)+' L'+cx+' '+Math.max(zeroY,cy);
    line+=' L'+cx+' '+cy;
  }
  posA+=' L'+xf(data[data.length-1].t)+' '+zeroY+' Z';
  negA+=' L'+xf(data[data.length-1].t)+' '+zeroY+' Z';

  var htX = xf(gameTotalSecs()/2);
  var curX = xf(S.gameTime);

  return '<svg width="'+width+'" height="'+height+'" style="display:block;flex-shrink:0;">'
    +'<rect x="'+LP+'" y="0" width="'+cw+'" height="'+ch+'" fill="rgba(0,0,0,.3)" rx="3"/>'
    +'<path d="'+posA+'" fill="rgba(46,168,75,.32)"/>'
    +'<path d="'+negA+'" fill="rgba(239,68,68,.32)"/>'
    +'<line x1="'+LP+'" y1="'+zeroY+'" x2="'+(LP+cw)+'" y2="'+zeroY+'" stroke="rgba(255,255,255,.12)" stroke-width="1"/>'
    +'<line x1="'+htX+'" y1="0" x2="'+htX+'" y2="'+ch+'" stroke="rgba(255,255,255,.15)" stroke-width="1" stroke-dasharray="2 2"/>'
    +'<path d="'+line+'" stroke="#60a5fa" fill="none" stroke-width="1.8" stroke-linejoin="round"/>'
    +'<line x1="'+curX+'" y1="0" x2="'+curX+'" y2="'+ch+'" stroke="rgba(255,255,255,.65)" stroke-width="1.5" stroke-dasharray="2 2"/>'
    +'</svg>';
}

function renderScoreBarHTML(){
  var totals = calcScoreTotals();
  var us = totals.us, them = totals.them;
  var lead = us - them;
  var leadTxt = lead>0 ? '+'+lead+' US' : lead<0 ? Math.abs(lead)+' THEM' : 'LEVEL';
  var leadCol = lead>0 ? 'var(--green)' : lead<0 ? 'var(--red)' : 'var(--dim)';
  var hasScores = S.scoreLog && S.scoreLog.length > 0;

  if(!S.scoreBarExpanded){
    // ── COLLAPSED ──
    return '<div id="score-bar" style="background:#0a0c14;border-top:1px solid #1a1d2e;border-bottom:1px solid #1a1d2e;padding:5px 10px;flex-shrink:0;">'
      +'<div style="display:flex;align-items:center;gap:6px;">'
        // US side
        +'<div style="font-family:Impact,sans-serif;font-size:22px;color:var(--green);line-height:1;min-width:26px;text-align:center;">'+us+'</div>'
        +'<button onclick="event.stopPropagation();addScoreEvent(\'us\',2)" style="flex:1;background:rgba(46,168,75,.18);border:1.5px solid rgba(46,168,75,.4);color:var(--green);border-radius:7px;padding:7px 0;font-family:Impact,sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;">+2 US</button>'
        // Middle
        +'<div onclick="event.stopPropagation();toggleScoreBar()" style="display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;flex-shrink:0;padding:0 4px;">'
          +'<div style="font-family:Impact,sans-serif;font-size:11px;color:'+leadCol+';letter-spacing:1px;white-space:nowrap;">'+leadTxt+'</div>'
          +'<div style="font-size:8px;color:#374151;letter-spacing:.5px;">▼ MORE</div>'
        +'</div>'
        // THEM side
        +'<button onclick="event.stopPropagation();addScoreEvent(\'them\',2)" style="flex:1;background:rgba(239,68,68,.18);border:1.5px solid rgba(239,68,68,.4);color:var(--red);border-radius:7px;padding:7px 0;font-family:Impact,sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;">+2 THEM</button>'
        +'<div style="font-family:Impact,sans-serif;font-size:22px;color:var(--red);line-height:1;min-width:26px;text-align:center;">'+them+'</div>'
      +'</div>'
    +'</div>';
  }

  // ── EXPANDED ──
  var chartW = 120;
  return '<div id="score-bar" onclick="event.stopPropagation()" style="background:#0a0c14;border-top:1px solid #1a1d2e;border-bottom:1px solid #1a1d2e;padding:8px 10px;flex-shrink:0;">'
    // Score row + mini chart
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">'
      +'<div style="font-family:Impact,sans-serif;font-size:28px;color:var(--green);line-height:1;">'+us+'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;margin:0 10px;">'
        +'<div style="font-family:Impact,sans-serif;font-size:11px;color:'+leadCol+';letter-spacing:1px;">'+leadTxt+'</div>'
        +scoreDiffSVG(chartW, 34, false)
        +'<div style="display:flex;justify-content:space-between;width:'+chartW+'px;font-size:7px;color:#374151;margin-top:1px;">'
          +'<span>0:00</span><span>HT</span><span>'+fmt(gameTotalSecs())+'</span>'
        +'</div>'
      +'</div>'
      +'<div style="font-family:Impact,sans-serif;font-size:28px;color:var(--red);line-height:1;">'+them+'</div>'
    +'</div>'
    // +1/+2/+3 buttons
    +'<div style="display:flex;gap:5px;margin-bottom:6px;">'
      +[1,2,3].map(function(p){
        return '<button onclick="event.stopPropagation();addScoreEvent(\'us\','+p+')" style="flex:1;background:rgba(46,168,75,.15);border:1px solid rgba(46,168,75,.35);color:var(--green);border-radius:7px;padding:7px 0;font-family:Impact,sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;">+'+p+' US</button>';
      }).join('')
      +'<div style="width:1px;background:var(--border);margin:0 2px;"></div>'
      +[1,2,3].map(function(p){
        return '<button onclick="event.stopPropagation();addScoreEvent(\'them\','+p+')" style="flex:1;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);color:var(--red);border-radius:7px;padding:7px 0;font-family:Impact,sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;">+'+p+' THEM</button>';
      }).join('')
    +'</div>'
    // Undo + collapse
    +'<div style="display:flex;gap:6px;">'
      +(hasScores ? '<button onclick="event.stopPropagation();undoScoreEvent()" style="flex:1;background:none;border:1px solid var(--border);color:var(--dim);border-radius:7px;padding:5px 0;font-size:11px;cursor:pointer;">↩ UNDO LAST</button>' : '<div style="flex:1"></div>')
      +'<button onclick="event.stopPropagation();toggleScoreBar()" style="flex:1;background:none;border:1px solid var(--border);color:var(--dim);border-radius:7px;padding:5px 0;font-size:11px;cursor:pointer;">▲ COLLAPSE</button>'
    +'</div>'
  +'</div>';
}

function renderGame(){
  const isH2=S.phase==='h2';
  const cp=courtPlayers(), bp=benchPlayers();
  const hiC=highlightCourt(), hiB=highlightBench();
  const {targetTime,remPP}=calcForecast();
  const active=S.players.filter(p=>p.fouls<5).length;
  const totalSecs=gameTotalSecs();
  const halfRem=getHalfDur()-S.halfTime;
  const halfC=halfRem<=60?'#ff5555':halfRem<=120?'#ffcc00':'#eef0f8';
  const subC=S.alertState==='sub-now'?'#ff5555':S.alertState==='warning'?'#ffcc00':'#eef0f8';
  const gameStarted=S.gameTime>0||S.isRunning;

  const alertHTML=S.alertState==='warning'?`<div id="alert-bar" class="abar warn">⏱ SUB IN 30 SECONDS</div>`
    :S.alertState==='sub-now'?`<div id="alert-bar" class="abar now">🔔 TIME TO SUBSTITUTE!</div>`
    :S.alertState==='halfend'?`<div id="alert-bar" class="abar half">🏀 ${isH2?'FULL TIME — TAP END GAME':'HALF TIME — TAP END HALF'}</div>`
    :`<div id="alert-bar" class="abar" style="display:none"></div>`;

  const showSub=S.selCourt.size>0||S.selBench.size>0;
  const availableSpots=COURT_SIZE-cp.length;
  const fillingUp=S.selCourt.size===0&&availableSpots>0&&S.selBench.size>0&&S.selBench.size<=availableSpots;
  const canSub=S.selBench.size>0&&(S.selCourt.size>0||fillingUp);
  const tooMany=S.selCourt.size===0&&S.selBench.size>availableSpots&&availableSpots>0;

  let subBarInfo='';
  if(fillingUp) subBarInfo=`<strong>${S.selBench.size}</strong> joining court (${cp.length}→${cp.length+S.selBench.size}/5)`;
  else if(tooMany) subBarInfo=`Only <strong>${availableSpots}</strong> spot${availableSpots!==1?'s':''} free — deselect ${S.selBench.size-availableSpots} player${S.selBench.size-availableSpots!==1?'s':''}`;
  else subBarInfo=`<strong>${S.selCourt.size}</strong> off · <strong>${S.selBench.size}</strong> on${S.selCourt.size>0&&S.selCourt.size!==S.selBench.size?' <span style="color:#ffcc00">— uneven</span>':''}`;

  const subBarHTML=showSub?`
<div class="subbar">
  <div class="subbar-info">${subBarInfo}</div>
  <button class="sub-clr" onclick="clearSel()">Clear</button>
  <button class="sub-go" onclick="commitSub()" ${canSub?'':'disabled'}>MAKE SUB ✓</button>
</div>`:'';

  const cCards=cp.map(p=>playerCardHTML(p,'court',hiC.has(p.id),S.selCourt.has(p.id),{targetTime,remPP},getPlanHighlights())).join('');
  const bCardsRaw=bp.length
    ?bp.map(p=>playerCardHTML(p,'bench',hiB.has(p.id),S.selBench.has(p.id),{targetTime,remPP},getPlanHighlights())).join('')
    :`<div style="text-align:center;color:#7a80a0;font-size:12px;padding:12px">Empty bench</div>`;
  // Inject bench-card class so CSS can cap bench card height independently of court cards
  const bCards = bCardsRaw.replace(/class="pc /g,'class="pc bench-card ');

  let instrTxt='';
  if(!showSub){
    instrTxt=cp.length<COURT_SIZE
      ?`${availableSpots} spot${availableSpots!==1?'s':''} free — tap bench players to add to court`
      :'Tap court players to sub out · Tap bench players to sub in · Then MAKE SUB';
  } else if(fillingUp){
    instrTxt=`Tap MAKE SUB to add ${S.selBench.size} player${S.selBench.size!==1?'s':''} to court`;
  } else if(tooMany){
    instrTxt=`Too many selected — only ${availableSpots} spot${availableSpots!==1?'s':''} available`;
  } else if(canSub){
    instrTxt=`Tap MAKE SUB — ${S.selCourt.size} off, ${S.selBench.size} on`;
  } else {
    instrTxt='Select players on both sides to enable sub';
  }

  // Build post-sub position preview for live game screen (compact, shown when selections active)
  let livePosBoardHTML = '';
  if(canSub || fillingUp){
    const stayOnLive = cp.filter(p=>!S.selCourt.has(p.id));
    const nextOnLive = bp.filter(p=>S.selBench.has(p.id));
    if(stayOnLive.length + nextOnLive.length === COURT_SIZE){
      const newCourtLive = [...stayOnLive, ...nextOnLive];
      const anyRatings = newCourtLive.some(p=>allPositionsForPlayer(p.id).length>0);
      if(anyRatings){
        const covAfter = new Set();
        newCourtLive.forEach(p=>{ const pos=getGamePos(p.id); if(pos) covAfter.add(pos); });
        const missingLive = ['1','2','3','4','5'].filter(n=>!covAfter.has(n));
        const tilesLive = newCourtLive.map(p=>{
          const pos=getGamePos(p.id);
          const allPos=allPositionsForPlayer(p.id);
          const isOn=S.selBench.has(p.id);
          const firstName=(S.names[p.id]||'').split(' ')[0];
          const canFill=allPos.filter(ap=>missingLive.includes(ap)&&ap!==pos);
          const posClass=pos?'pos-'+pos:'';
          const recBit=canFill.length?'<div style="font-size:8px;color:var(--accent);">→'+canFill[0]+'</div>':'';
          var courtStr='court';
          return '<button onclick="event.stopPropagation();openPosPicker('+p.id+',\'' + courtStr + '\')" '+
            'class="'+posClass+'" '+
            'style="flex:1;min-width:0;border-radius:8px;padding:6px 3px;border:'+(isOn?'2px':'1px')+' solid;cursor:pointer;'+
            'background:'+(isOn?'rgba(0,207,180,.15)':'rgba(255,255,255,.04)')+';'+
            'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;">'+
            '<div style="font-family:Impact,sans-serif;font-size:20px;line-height:1;">'+(pos||'?')+'</div>'+
            '<div style="font-size:8px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px;">'+(isOn?'▲':'')+firstName+'</div>'+
            recBit+'</button>';
        }).join('');
        const missBit=missingLive.length
          ?'<span style="font-size:10px;color:var(--red);margin-left:8px;">⚠ '+missingLive.join('·')+'</span>'
          :'<span style="font-size:10px;color:var(--green);margin-left:8px;">✓</span>';
        livePosBoardHTML=`<div onclick="event.stopPropagation()" style="padding:5px 8px;background:rgba(0,0,0,.35);border-top:1px solid rgba(255,255,255,.07);flex-shrink:0;">
          <div style="display:flex;align-items:center;gap:5px;">
            <div style="font-family:Impact,sans-serif;font-size:8px;letter-spacing:1.5px;color:var(--dim);white-space:nowrap;">AFTER SUB</div>
            <div style="display:flex;gap:4px;flex:1;">${tilesLive}</div>
            ${missBit}
          </div>
        </div>`;
      }
    }
  }

  const pbtnLabel=!gameStarted?'▶ START':S.isRunning?'⏸ TIMEOUT':'▶ RESUME';
  // Quarter teams need END Q3 during H2 before q3 break happens
  var isQ3Pending = isH2 && usesQuarters() && !S.q3BreakDone;
  var endLabel = isH2
    ? (isQ3Pending ? 'END Q3' : 'END GAME')
    : (usesQuarters() ? (S.q1BreakDone ? 'END Q2' : 'END Q1') : 'END HALF');
  var urgentCls = (S.alertState==='halfend'||S.alertState==='quartend') ? ' urgent' : '';
  var endCls = 'endbtn '+(isH2&&!isQ3Pending?'h2e':'h1e')+urgentCls;
  var endAction = (isH2 && !isQ3Pending) ? 'confirmEndGame()' : 'confirmEndHalf()';

  $('app').innerHTML=`
<div class="game">
  <div class="ghdr">
    <div class="hll">
      <div id="gclock" class="gclock bb">${fmt(S.gameTime)}</div>
      <div class="glbl">Total</div>
      <div class="hbadge ${isH2?'h2':'h1'}">${usesQuarters()?getCurrentQuarter():(isH2?'2ND HALF':'1ST HALF')}</div>
      ${S.opponent?`<div style="font-size:9px;color:var(--dim);margin-top:2px">vs <strong style="color:var(--text)">${S.opponent}</strong></div>`:''}
    </div>
    <div class="ghctr">
      <div class="glbl">Half remaining</div>
      <div id="hrem" class="hrem bb" style="color:${halfC}">${halfRem>=0?fmt(halfRem):'+'+fmt(-halfRem)}</div>
      <div style="display:flex;align-items:center;gap:4px;margin-top:1px">
        <div class="glbl">Sub in</div>
        <div id="scdown" class="stimer bb" style="color:${subC}">${fmt(S.subCountdown)}</div>
      </div>
      ${coverageRowHTML()}
    </div>
    <div class="hbtns">
      <button id="pbtn" class="pbtn${S.isRunning?' live':''}" onclick="togglePause()">${pbtnLabel}</button>
      <div id="timeout-clock-note" style="display:${!S.isRunning&&S.isClockRunning?'block':'none'};font-size:9px;color:var(--warn);text-align:center;letter-spacing:.5px;margin-top:1px;">⏱ CLOCK RUNNING</div>
      <div style="display:flex;gap:4px;align-items:center;margin-top:2px">
        <button class="${endCls}" onclick="${endAction}">${endLabel}</button>
        <button onclick="openTimelineModal()" style="background:rgba(74,158,255,.15);border:1.5px solid rgba(74,158,255,.3);color:var(--blue);border-radius:8px;padding:5px 8px;font-size:14px;cursor:pointer;" title="Playing time timeline">📊</button>
        <button class="sgear" onclick="S._prevPhase='${S.phase}';S.phase='settings';render()" title="Settings">⚙</button>
      </div>
    </div>
  </div>

  <div class="target-bar">
    <span class="target-lbl">Target per player</span>
    <span class="target-val">${fmt(targetTime)}</span>
    <span style="color:var(--border);font-size:10px">·</span>
    <span class="target-info">${active} active · ${fmt(totalSecs)} total</span>
    <span style="color:var(--border);font-size:10px">·</span>
    ${S.useSubPlan?`<span onclick="S.showPlanned=!S.showPlanned;renderGame()" style="font-size:9px;cursor:pointer;padding:1px 7px;border-radius:4px;border:1px solid;${S.showPlanned?'background:rgba(244,114,182,.15);border-color:#f472b6;color:#f472b6':'border-color:var(--border);color:var(--dim)'}">Plan ${S.showPlanned?'ON':'OFF'}</span>`:''}
    <span onclick="S.showRecommended=!S.showRecommended;renderGame()" style="font-size:9px;cursor:pointer;padding:1px 7px;border-radius:4px;border:1px solid;${S.showRecommended?'background:rgba(255,140,0,.1);border-color:var(--amber);color:var(--amber)':'border-color:var(--border);color:var(--dim)'}">Auto ${S.showRecommended?'ON':'OFF'}</span>
  </div>

  ${alertHTML}
  ${subBarHTML}
  ${renderScoreBarHTML()}

  <div class="cols">
    <div class="col" style="border-right:1px solid var(--border)">
      <div class="chdr court">ON COURT · ${cp.length}/5</div>
      ${cCards}
    </div>
    <div class="col bench-col">
      <div class="chdr bench">BENCH · ${bp.length}</div>
      ${bCards}
    </div>
  </div>

  <div class="instr">${instrTxt}</div>
  ${livePosBoardHTML}
  ${pauseOverlayHTML()}
</div>`;
  // After render: sync bench card height to match court card height
  requestAnimationFrame(syncCardHeights);

  updateAlertBar();
  if(S.isRunning) startTick();
}

// Mini playing time bar chart for splash screens
function miniBarChartHTML(){
  const players = S.players||[];
  if(!players.length) return '';
  const totalSecs=gameTotalSecs();
  const fairShare=Math.round(totalSecs*COURT_SIZE/Math.max(players.length,COURT_SIZE));
  const sorted=[...players].sort((a,b)=>b.playTime-a.playTime);
  const rows=sorted.map(p=>{
    const pct=Math.min(100,Math.round(p.playTime/totalSecs*100));
    const targetPct=Math.round(fairShare/totalSecs*100);
    const diff=p.playTime-fairShare;
    const col=p.playTime>=fairShare*0.9?'var(--green)':p.playTime>=fairShare*0.6?'var(--warn)':'var(--red)';
    const onDot=p.onCourt?'<span style="color:var(--green);margin-right:3px;font-size:9px;">▶</span>':'';
    return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">'+
      '<div style="width:60px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;">'+onDot+p.name.split(' ')[0]+'</div>'+
      '<div style="flex:1;height:10px;background:var(--border);border-radius:3px;position:relative;overflow:visible;">'+
        '<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:3px;transition:width .9s linear;"></div>'+
        '<div style="position:absolute;top:-2px;bottom:-2px;left:'+targetPct+'%;width:2px;background:rgba(255,255,255,.5);border-radius:1px;"></div>'+
      '</div>'+
      '<div style="font-family:Impact,sans-serif;font-size:10px;color:'+col+';flex-shrink:0;width:32px;text-align:right;">'+fmt(p.playTime)+'</div>'+
    '</div>';
  }).join('');
  return '<div style="padding:8px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,.2);">'+
    '<div style="font-family:Impact,sans-serif;font-size:8px;letter-spacing:1.5px;color:var(--dim);margin-bottom:5px;">PLAYING TIME — white line = fair share</div>'+
    rows+'</div>';
}

function renderQuarterBreak(){
  const isQ1Break = S.phase==='q1break';
  const fromQ = isQ1Break ? 'Q1' : 'Q3';
  const toQ   = isQ1Break ? 'Q2' : 'Q4';
  const resumePhase = isQ1Break ? 'q1break' : 'q3break';

  // Build sub selection cards (same style as halftime)
  const cp=S.players.filter(p=>p.onCourt);
  const bp=S.players.filter(p=>!p.onCourt);
  const sel = S.pendingQBreakSubs || {off:new Set(), on:new Set()};

  function toggleQBreakSel(pid, fromCourt){
    if(!S.pendingQBreakSubs) S.pendingQBreakSubs={off:new Set(),on:new Set()};
    const s=S.pendingQBreakSubs;
    if(fromCourt){
      if(s.off.has(pid)) s.off.delete(pid); else s.off.add(pid);
    } else {
      if(s.on.has(pid)) s.on.delete(pid); else s.on.add(pid);
    }
    renderQuarterBreak();
  }
  window.toggleQBreakSel=toggleQBreakSel;

  const subReady = sel.off.size>0 && sel.on.size===sel.off.size;
  const subNote = sel.off.size!==sel.on.size && (sel.off.size>0||sel.on.size>0)
    ? '<div style="font-size:10px;color:var(--warn);margin-top:4px;">Select equal numbers to sub off and on</div>' : '';

  const mkCard=(p,fromCourt)=>{
    const selSet=fromCourt?sel.off:sel.on;
    const isSel=selSet.has(p.id);
    const pos=getGamePos(p.id);
    const cls=pos?(POS_COLOURS[+pos]||''):'';
    return '<div class="ht-card '+(fromCourt?'court':'bench')+'" style="'+(isSel?'border-color:var(--accent);background:rgba(240,140,0,.1);':'')+'" onclick="toggleQBreakSel('+p.id+','+fromCourt+')">'+
      '<div style="display:flex;align-items:center;gap:6px;">'+
        (pos?'<span class="pos-badge '+cls+'" style="font-size:14px;padding:3px 8px;">'+pos+'</span>':'')+
        '<div class="ht-name">'+(isSel?'✓ ':'')+p.name+'</div>'+
      '</div>'+
      '<div class="ht-stat">Played <span>'+fmt(p.playTime)+'</span> · '+p.fouls+' foul'+(p.fouls!==1?'s':'')+'</div>'+
    '</div>';
  };

  const cCards=cp.map(p=>mkCard(p,true)).join('');
  const bCards=bp.map(p=>mkCard(p,false)).join('');

  $('app').innerHTML=
    '<div class="ht">'+
    '<div class="ht-hdr">'+
      '<div class="ht-title">'+fromQ+' → '+toQ+'</div>'+
      '<div class="ht-sub">QUARTER TIME</div>'+
      '<div class="ht-count" style="color:var(--dim)">'+
        'Select subs below — or tap screen to start '+toQ+' immediately'+
      '</div>'+
      subNote+
    '</div>'+
    '<div class="ht-cols">'+
      '<div class="ht-col" style="border-right:1px solid var(--border)">'+
        '<div class="ht-chdr court">ON COURT (tap to sub off)</div>'+cCards+
      '</div>'+
      '<div class="ht-col">'+
        '<div class="ht-chdr bench">BENCH (tap to sub on)</div>'+bCards+
      '</div>'+
    '</div>'+
    miniBarChartHTML()+
    '<div class="ht-footer">'+
      '<button class="ht-start" onclick="startQuarterResume(\''+resumePhase+'\')">'+
        '▶ START '+toQ+(subReady?' + MAKE SUB':'')+
      '</button>'+
      '<div class="ht-note">Subs will be applied automatically when '+toQ+' starts</div>'+
    '</div>'+
    '</div>';
}

function renderHalftime(){
  const court=S.players.filter(p=>S.htOnCourt.has(p.id));
  const bench=S.players.filter(p=>!S.htOnCourt.has(p.id));
  const ready=court.length===COURT_SIZE;
  const need=COURT_SIZE-court.length;
  const h1Secs=S.h1Dur*60;

  const sortedCourt=[...court].sort((a,b)=>b.playTime-a.playTime);
  const sortedBench=[...bench].sort((a,b)=>a.playTime-b.playTime);

  const cCards=sortedCourt.map(p=>{
    const heavy=p.playTime>=h1Secs*0.7;
    const pos=getGamePos(p.id);
    const cls=pos?(POS_COLOURS[+pos]||''):'';
    return `<div class="ht-card court" onclick="toggleHtPlayer(${p.id})">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:6px;">
          ${pos?`<span class="pos-badge ${cls}" style="font-size:16px;padding:4px 10px;min-width:36px;text-align:center;cursor:pointer;" onclick="event.stopPropagation();openPosPicker(${p.id},'court')">${pos}</span>`:''}
          <div class="ht-name">${p.name}</div>
        </div>
        ${heavy?`<span style="font-size:9px;background:rgba(255,140,0,.2);color:var(--amber);padding:1px 6px;border-radius:4px;font-family:Impact,sans-serif;letter-spacing:1px">HEAVY</span>`:''}
      </div>
      <div class="ht-stat">Played <span>${fmt(p.playTime)}</span> · ${p.fouls} foul${p.fouls!==1?'s':''}</div>
    </div>`;
  }).join('');

  const bCards=sortedBench.map(p=>{
    const light=p.playTime<h1Secs*0.3;
    const pos=getGamePos(p.id);
    const allPos=allPositionsForPlayer(p.id);
    const courtIds=sortedCourt.map(q=>q.id);
    const covered=new Set(courtIds.map(id=>getGamePos(id)).filter(Boolean));
    const fills=allPos.filter(pp=>!covered.has(pp));
    const cls=pos?(POS_COLOURS[+pos]||''):'';

    </div>`;

  $('app').innerHTML=`
<div class="ht">
  <div class="ht-hdr">
    <div class="ht-title">${usesQuarters()?"HALF TIME":"HALF TIME"}</div>
    <div class="ht-sub">${usesQuarters()?"Q3/Q4":"H2"}: ${S.h2Dur}min · sub every ${fmtInterval(S.h2Int)} · ${S.h2Sps} per sub</div>
    <div class="ht-count"><span class="${ready?'ok':'bad'}">${court.length}/5</span> on court for 2nd half${!ready?` · <span style="color:var(--warn)">pick ${need} more</span>`:''}</div>
    ${(()=>{
      const covIds = sortedCourt.map(p=>p.id);
      const covSet = new Set(covIds.map(id=>getGamePos(id)).filter(Boolean));

// Sync bench card height to exactly match court card height
function syncCardHeights(){
