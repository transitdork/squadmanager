// ── TIMELINE MODAL ──
let _tlView = 'table'; // 'table' | 'timeline'
let _tlTimer = null;  // live-update interval

function openTimelineModal(){
  const existing = document.getElementById('tl-modal');
  if(existing) existing.remove();
  clearInterval(_tlTimer);

  const el = document.createElement('div');
  el.id = 'tl-modal';
  el.className = 'tl-backdrop';
  el.innerHTML = buildTimelineHTML(_tlView);
  document.body.appendChild(el);

  // Update every second while modal is open and game is running
  _tlTimer = setInterval(()=>{
    const modal = document.getElementById('tl-modal');
    if(!modal){ clearInterval(_tlTimer); _tlTimer=null; return; }
    if(!S.isRunning && !S.isClockRunning) return; // paused — no need to redraw
    const body = document.getElementById('tl-body');
    if(body) body.innerHTML = _tlView==='table' ? buildTableHTML() : buildStintHTML();
  }, 1000);
}

function closeTimelineModal(){
  clearInterval(_tlTimer); _tlTimer=null;
  const modal = document.getElementById('tl-modal');
  if(modal) modal.remove();
}

function switchTlView(view){
  _tlView = view;
  const body = document.getElementById('tl-body');
  if(body) body.innerHTML = view==='table' ? buildTableHTML() : buildStintHTML();
  document.querySelectorAll('.tl-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.view===view);
  });
}

function buildTimelineHTML(view){
  return `<div class="tl-header">
    <div class="tl-title">PLAYING TIME</div>
    <div class="tl-tabs">
      <button class="tl-tab ${view==='table'?'active':''}" data-view="table" onclick="switchTlView('table')">📊 TABLE</button>
      <button class="tl-tab ${view==='timeline'?'active':''}" data-view="timeline" onclick="switchTlView('timeline')">▬ TIMELINE</button>
    </div>
    <button onclick="closeTimelineModal()" style="background:none;border:1.5px solid var(--border);color:var(--dim);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;flex-shrink:0;">✕</button>
  </div>
  <div id="tl-body" class="tl-body">${view==='table'?buildTableHTML():buildStintHTML()}</div>`;
}

function buildTableHTML(){
  const players = S.players || [];
  if(!players.length) return '<div style="text-align:center;color:var(--dim);padding:20px">No players</div>';

  const totalSecs = gameTotalSecs();
  const gameSecs  = S.gameTime;
  const remaining = Math.max(0, totalSecs - gameSecs);
  const fairShare = Math.round(totalSecs * COURT_SIZE / Math.max(players.length,COURT_SIZE));

  // Get forecast from plan
  const forecasts = {};
  const planTimes = calcPlanPlayTimes ? calcPlanPlayTimes() : [];
  planTimes.forEach(pt=>{ forecasts[pt.name]=pt.secs; });

  // Sort: most under fair share first
  const sorted = [...players].sort((a,b)=>{
    const aUnder = fairShare - a.playTime;
    const bUnder = fairShare - b.playTime;
    return bUnder - aUnder;
  });

  const rows = sorted.map(p=>{
    const played = p.playTime;
    const forecast = forecasts[p.name] || (p.onCourt ? played + remaining : played);
    const pct = Math.min(100, Math.round(played/totalSecs*100));
    const fPct = Math.min(100, Math.round(forecast/totalSecs*100));
    const targetPct = Math.round(fairShare/totalSecs*100);
    const diff = played - fairShare;
    const diffStr = diff===0?'±0':(diff>0?'+':'')+Math.floor(Math.abs(diff)/60)+':'+(String(Math.abs(diff)%60).padStart(2,'0'));
    const diffColor = diff > 30?'var(--warn)': diff < -30?'var(--red)':'var(--green)';

    // Bar colour: green if ≥ fair share, amber if close, red if well under
    const barColor = played >= fairShare*0.9 ? 'var(--green)' : played >= fairShare*0.6 ? 'var(--warn)' : 'var(--red)';
    const fBarColor = forecast >= fairShare*0.9 ? 'var(--green)' : forecast >= fairShare*0.6 ? 'var(--warn)' : 'var(--red)';

    const onDot = p.onCourt ? '<span style="color:var(--green);font-size:9px;">▶</span> ' : '';

    return `<div class="tl-row">
      <div class="tl-name">${onDot}${p.name.split(' ')[0]}</div>
      <div class="tl-bar-wrap">
        <div class="tl-bar-played" style="width:${pct}%;background:${barColor};"></div>
        ${forecast>played?`<div class="tl-bar-forecast" style="left:${pct}%;width:${fPct-pct}%;background:${fBarColor};"></div>`:''}
        <div class="tl-bar-target" style="left:${targetPct}%;"></div>
      </div>
      <div class="tl-times">
        <div style="color:${barColor}">${fmt(played)}</div>
        <div style="font-size:9px;color:${diffColor}">${diffStr}</div>
      </div>
    </div>`;
  }).join('');

  const fairFmt = fmt(fairShare);
  return `<div style="font-size:10px;color:var(--dim);padding:6px 10px 10px;line-height:1.5;">
    Fair share: <strong style="color:var(--text)">${fairFmt}</strong> · 
    White line = target · Faded bar = forecast · ▶ = on court
  </div>${rows}`;
}

function buildStintHTML(){
  const players = S.players || [];
  if(!players.length) return '<div style="text-align:center;color:var(--dim);padding:20px">No players</div>';

  const totalSecs = gameTotalSecs();
  const h1Secs    = S.h1Dur*60;
  const gameSecs  = S.gameTime;
  const pct = s => Math.min(100, Math.round(s/totalSecs*100));

  // Build each player's court stints from subLog
  function playerStints(pname){
    const firstSub=S.subLog.find(e=>e.on.includes(pname)||e.off.includes(pname));
    const onCourt=players.find(p=>p.name===pname)?.onCourt||false;
    var startedOnCourt=firstSub?(firstSub.on.includes(pname)?false:true):onCourt;
    var curState=startedOnCourt, curStart=0;
    const stints=[];
    S.subLog.forEach(function(sub){
      if(sub.isHalftime){
        const willBe=sub.on.includes(pname)?true:sub.off.includes(pname)?false:curState;
        if(willBe!==curState){ stints.push({start:curStart,end:sub.gameTime,on:curState}); curStart=sub.gameTime; curState=willBe; }
        return;
      }
      if(sub.on.includes(pname)&&!curState){ stints.push({start:curStart,end:sub.gameTime,on:false}); curStart=sub.gameTime; curState=true; }
      if(sub.off.includes(pname)&&curState){ stints.push({start:curStart,end:sub.gameTime,on:true}); curStart=sub.gameTime; curState=false; }
    });
    stints.push({start:curStart,end:gameSecs,on:curState});
    return stints;
  }

  // Get forecast plan stints
  const planTimes = calcPlanPlayTimes ? calcPlanPlayTimes() : [];
  const forecastSecs = {};
  planTimes.forEach(pt=>{ forecastSecs[pt.name]=pt.secs; });

  const rows = players.map(p=>{
    const stints = playerStints(p.name);
    const stintBars = stints.map(s=>{
      if(!s.on) return '';
      const l = pct(s.start), w = Math.max(0.5, pct(s.end)-pct(s.start));
      return `<div class="tl-stint-on" style="left:${l}%;width:${w}%;"></div>`;
    }).join('');

    // Forecast bar (remaining planned time)
    const fSecs = forecastSecs[p.name];
    const playedSecs = p.playTime;
    let forecastBar = '';
    if(fSecs && fSecs > playedSecs && gameSecs < totalSecs){
      const fl = pct(gameSecs), fw = Math.max(0.5, pct(Math.min(fSecs, totalSecs))-pct(gameSecs));
      const fColor = fSecs >= (totalSecs*COURT_SIZE/players.length)*0.9 ? 'var(--green)' : 'var(--warn)';
      forecastBar = `<div class="tl-stint-planned" style="left:${fl}%;width:${fw}%;background:${fColor};"></div>`;
    }

    // Cursor and half-line
    const cursor = `<div class="tl-cursor" style="left:${pct(gameSecs)}%;"></div>`;
    const halfLine = `<div class="tl-half-line" style="left:${pct(h1Secs)}%;"></div>`;

    const onDot = p.onCourt ? '▶ ' : '';
    return `<div class="tl-stint-row">
      <div class="tl-stint-name">${onDot}${p.name.split(' ')[0]}</div>
      <div class="tl-stint-track">${halfLine}${stintBars}${forecastBar}${cursor}</div>
    </div>`;
  }).join('');

  // Axis labels
  const axisMarks = [0, 0.25, 0.5, 0.75, 1].map(f=>`<span>${fmt(Math.round(f*totalSecs))}</span>`).join('');

  return `<div style="font-size:10px;color:var(--dim);padding:6px 10px 10px;line-height:1.5;">
    Green = on court · Faded = forecast · | = half break · ▶ = currently on court
  </div>
  <div class="tl-axis">${axisMarks}</div>
  ${rows}`;
}

// ── Game report: PDF export via print ──
function exportGamePDF(){
  const team=T.teams.find(t=>t.id===T.activeTeamId);
  const teamName=team?(team.club+' '+(team.ageBracket||'')).trim():'Squad Manager';
  const sorted=[...S.players].sort((a,b)=>b.playTime-a.playTime);
  const total=gameTotalSecs();
  const fairShare=Math.round(total*COURT_SIZE/Math.max(sorted.length,COURT_SIZE));
  const isQ=usesQuarters();
  const h1L=isQ?'Q1+Q2':'H1', h2L=isQ?'Q3+Q4':'H2';
  const h1Secs=isQ?20*60:S.h1Dur*60;
  const hasScores=S.scoreLog&&S.scoreLog.length>0;
  const trackedTotals=calcScoreTotals();
  const scoreUs=S.finalScore.us!==null?S.finalScore.us:(hasScores?trackedTotals.us:null);
  const scoreThem=S.finalScore.them!==null?S.finalScore.them:(hasScores?trackedTotals.them:null);
  const finalScoreStr=(scoreUs!==null&&scoreThem!==null)?(scoreUs+' \u2013 '+scoreThem):'';

  // ── Shared chart geometry ─────────────────────────────────
  // ALL three charts use identical PAGE_W, MARGIN, LP, RP so axes align perfectly
  const PAGE_W=794, MARGIN=48;
  const LP=58, RP=0;
  const CW=PAGE_W-MARGIN*2-LP-RP; // drawable width (equal for all charts)
  const TICK_EVERY=120; // 2-min minor ticks
  function xf(t){return LP+(Math.min(t,total)/total)*CW;}

  // Period markers for halves or quarters
  const markers=isQ
    ?[{t:total*0.25,label:'Q1',major:false},{t:total*0.5,label:'HT',major:true},{t:total*0.75,label:'Q3',major:false},{t:total,label:'FT',major:true}]
    :[{t:total*0.5,label:'HT',major:true},{t:total,label:'FT',major:true}];
  const labelTicks=[0,...markers.map(m=>m.t)];

  // Minor 2-min ticks (exclude period positions)
  const minorTicks=[];
  for(var mt=TICK_EVERY;mt<total;mt+=TICK_EVERY){
    if(!markers.some(function(m){return Math.abs(m.t-mt)<1;})) minorTicks.push(mt);
  }

  // ── SVG helpers ───────────────────────────────────────────
  function svgPeriodLines(chartTop,chartH,showLabels){
    return markers.map(function(m){
      var x=xf(m.t);
      var stroke=m.major?'rgba(0,0,0,.2)':'rgba(0,0,0,.1)';
      var sw=m.major?1.5:1;
      var dash=m.major?'':' stroke-dasharray="5 3"';
      var lbl=showLabels?'<text x="'+(x-3)+'" y="'+(chartTop+9)+'" text-anchor="end" fill="'+(m.major?'rgba(0,0,0,.38)':'rgba(0,0,0,.22)')+'" font-size="7" font-family="Arial">'+m.label+'</text>':'';
      return '<line x1="'+x+'" y1="'+chartTop+'" x2="'+x+'" y2="'+(chartTop+chartH)+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+dash+'/>'+lbl;
    }).join('');
  }
  function svgMinorTicks(chartTop,chartH){
    return minorTicks.map(function(t){
      var x=xf(t);
      return '<line x1="'+x+'" y1="'+chartTop+'" x2="'+x+'" y2="'+(chartTop+chartH)+'" stroke="#e0e0e0" stroke-width="0.7"/>';
    }).join('');
  }
  function svgAxis(y){
    var out='<line x1="'+LP+'" y1="'+y+'" x2="'+(LP+CW)+'" y2="'+y+'" stroke="#bbb" stroke-width="1"/>';
    labelTicks.forEach(function(t){
      var x=xf(t),isLast=t===total;
      var anchor=t===0?'start':isLast?'end':'middle';
      var isMajor=markers.some(function(m){return m.t===t;});
      out+='<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+3)+'" stroke="#999" stroke-width="1"/>';
      out+='<text x="'+x+'" y="'+(y+12)+'" text-anchor="'+anchor+'" fill="#666" font-size="8" font-family="Arial"'+(isMajor?' font-weight="bold"':'')+'>'+fmt(t)+'</text>';
    });
    minorTicks.forEach(function(t){
      out+='<line x1="'+xf(t)+'" y1="'+y+'" x2="'+xf(t)+'" y2="'+(y+3)+'" stroke="#ccc" stroke-width="0.7"/>';
    });
    return out;
  }
  function svgScoreLines(chartTop,chartH,usLabelY,themLabelY){
    if(!hasScores)return'';
    return (S.scoreLog||[]).map(function(ev){
      var x=xf(ev.t),isUs=ev.who==='us',col=isUs?'#2ea84b':'#cc3333';
      var usTxt=usLabelY!=null&&isUs?'<text x="'+x+'" y="'+usLabelY+'" text-anchor="middle" fill="'+col+'" font-size="7" font-family="Arial" font-weight="bold">+'+ev.pts+'</text>':'';
      var thTxt=themLabelY!=null&&!isUs?'<text x="'+x+'" y="'+themLabelY+'" text-anchor="middle" fill="'+col+'" font-size="7" font-family="Arial" font-weight="bold">+'+ev.pts+'</text>':'';
      return '<line x1="'+x+'" y1="'+chartTop+'" x2="'+x+'" y2="'+(chartTop+chartH)+'" stroke="'+col+'" stroke-width="1.1" opacity="0.65"/>'+usTxt+thTxt;
    }).join('');
  }

  // ── Chart 1: Score differential ───────────────────────────
  function diffChartSVG(){
    if(!hasScores)return'';
    const diff=buildScoreDiff();
    const lTots=calcScoreTotals();
    const lead=lTots.us-lTots.them;
    const US_H=14,H=72,AX_H=18;
    const svgH=US_H+H+AX_H;
    const zeroY=US_H+H/2;
    const maxD=Math.max(6,Math.max.apply(null,diff.map(function(d){return Math.abs(d.d);})));
    const sc=(H/2-5)/maxD;
    function yf(d){return Math.max(US_H+2,Math.min(US_H+H-2,zeroY-d*sc));}
    var posA='M'+xf(0)+' '+zeroY,negA='M'+xf(0)+' '+zeroY;
    var line='M'+xf(diff[0].t)+' '+yf(diff[0].d);
    for(var i=1;i<diff.length;i++){
      var px=xf(diff[i-1].t),cx=xf(diff[i].t),py=yf(diff[i-1].d),cy=yf(diff[i].d);
      posA+=' L'+px+' '+Math.min(zeroY,py)+' L'+cx+' '+Math.min(zeroY,cy);
      negA+=' L'+px+' '+Math.max(zeroY,py)+' L'+cx+' '+Math.max(zeroY,cy);
      line+=' L'+cx+' '+cy;
    }
    posA+=' L'+xf(diff[diff.length-1].t)+' '+zeroY+' Z';
    negA+=' L'+xf(diff[diff.length-1].t)+' '+zeroY+' Z';
    var yTicks='';
    for(var v=-Math.floor(maxD);v<=Math.floor(maxD);v+=2){
      if(v===0)continue;
      var ty=yf(v);
      if(ty>US_H+3&&ty<US_H+H-2){
        yTicks+='<line x1="'+LP+'" y1="'+ty+'" x2="'+(LP+CW)+'" y2="'+ty+'" stroke="#e0e0e0" stroke-width="1"/>'
          +'<text x="'+(LP-3)+'" y="'+(ty+3)+'" text-anchor="end" fill="#ccc" font-size="7" font-family="Arial">'+(v>0?'+'+v:v)+'</text>';
      }
    }
    const leadCol=lead>0?'#2ea84b':lead<0?'#cc3333':'#666';
    const leadTxt=lead>0?'+'+lead+' US':lead<0?Math.abs(lead)+' THEM':'LEVEL';
    return '<div style="margin-bottom:4px">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;padding-left:'+LP+'px">'
        +'<span style="font-size:9px;font-weight:700;color:#444;letter-spacing:.5px;text-transform:uppercase">Score Differential</span>'
        +'<span style="font-size:11px;font-weight:700;color:'+leadCol+'">Final: '+lTots.us+' \u2013 '+lTots.them+' ('+leadTxt+')</span>'
      +'</div>'
      +'<svg width="'+(LP+CW+RP)+'" height="'+svgH+'" style="display:block;overflow:visible">'
        +'<rect x="'+LP+'" y="'+US_H+'" width="'+CW+'" height="'+H+'" fill="#f7f8fa" rx="2"/>'
        +yTicks
        +'<line x1="'+LP+'" y1="'+zeroY+'" x2="'+(LP+CW)+'" y2="'+zeroY+'" stroke="#bbb" stroke-width="1.5"/>'
        +'<text x="'+(LP-3)+'" y="'+(zeroY+3)+'" text-anchor="end" fill="#aaa" font-size="7" font-family="Arial">0</text>'
        +svgMinorTicks(US_H,H)
        +svgPeriodLines(US_H,H,true)
        +'<path d="'+posA+'" fill="rgba(46,168,75,.22)"/>'
        +'<path d="'+negA+'" fill="rgba(204,51,51,.22)"/>'
        +'<path d="'+line+'" stroke="#2563eb" fill="none" stroke-width="2" stroke-linejoin="round"/>'
        +svgScoreLines(US_H,H,US_H-2,null)
        +svgAxis(US_H+H)
      +'</svg>'
      +'<div style="display:flex;gap:10px;padding-left:'+LP+'px;margin-top:2px;font-size:8px;color:#888">'
        +'<span style="color:rgba(46,168,75,.7)">\u2588 Us ahead</span>'
        +'<span style="color:rgba(204,51,51,.7)">\u2588 Them ahead</span>'
        +'<span style="color:#2563eb">\u2501 differential</span>'
        +(hasScores?'<span style="color:#2ea84b">| our scores (+pts above)</span><span style="color:#cc3333">| their scores</span>':'')
        +'<span>'+( S.scoreLog?S.scoreLog.length:0)+' events</span>'
      +'</div>'
    +'</div>';
  }

  // ── Chart 2: Rotation timeline ────────────────────────────
  function rotationChartSVG(){
    const ROW_H=18,US_H=13,THEM_H=13,AX_H=18;
    const H=sorted.length*ROW_H;
    const svgH=US_H+H+THEM_H+AX_H;

    function pStints(pname){
      const firstSub=S.subLog.find(function(e){return e.on.includes(pname)||e.off.includes(pname);});
      const pObj=S.players.find(function(p){return p.name===pname;});
      var cur=firstSub?(firstSub.on.includes(pname)?false:true):(pObj?pObj.onCourt:false);
      var start=0; var stints=[];
      S.subLog.forEach(function(sub){
        if(sub.isHalftime){var will=sub.on.includes(pname)?true:sub.off.includes(pname)?false:cur;if(will!==cur){stints.push({s:start,e:sub.gameTime,on:cur});start=sub.gameTime;cur=will;}return;}
        if(sub.on.includes(pname)&&!cur){stints.push({s:start,e:sub.gameTime,on:false});start=sub.gameTime;cur=true;}
        if(sub.off.includes(pname)&&cur){stints.push({s:start,e:sub.gameTime,on:true});start=sub.gameTime;cur=false;}
      });
      stints.push({s:start,e:S.gameTime,on:cur});
      return stints;
    }

    var rows='';
    sorted.forEach(function(p,pi){
      var rowY=US_H+pi*ROW_H+2;
      var stints=pStints(p.name);
      var bars='';
      stints.forEach(function(s){
        if(!s.on)return;
        var lx=xf(s.s),rw=Math.max(1,xf(s.e)-xf(s.s));
        bars+='<rect x="'+lx+'" y="'+rowY+'" width="'+rw+'" height="'+(ROW_H-2)+'" fill="#2ea84b" opacity="0.82" rx="1"/>';
      });
      rows+='<text x="'+(LP-4)+'" y="'+(rowY+ROW_H-5)+'" text-anchor="end" fill="#333" font-size="10" font-family="Arial">'+p.name.split(' ')[0]+'</text>'
        +'<rect x="'+LP+'" y="'+rowY+'" width="'+CW+'" height="'+(ROW_H-2)+'" fill="#e0e0e0" rx="1"/>'+bars;
    });

    return '<div>'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;padding-left:'+LP+'px">'
        +'<span style="font-size:9px;font-weight:700;color:#444;letter-spacing:.5px;text-transform:uppercase">Rotation Timeline</span>'
        +(hasScores?'<span style="font-size:8px;color:#888"><span style="color:#2ea84b">+pts above</span> = us &nbsp;<span style="color:#cc3333">+pts below</span> = them</span>':'')
      +'</div>'
      +'<svg width="'+(LP+CW+RP)+'" height="'+svgH+'" style="display:block;overflow:visible">'
        +'<rect x="'+LP+'" y="'+US_H+'" width="'+CW+'" height="'+H+'" fill="#f7f8fa" rx="2"/>'
        +svgMinorTicks(US_H,H)
        +svgPeriodLines(US_H,H,true)
        +rows
        +svgScoreLines(US_H,H,US_H-2,US_H+H+THEM_H-1)
        +svgAxis(US_H+H+THEM_H)
      +'</svg>'
    +'</div>';
  }

  // ── Chart 3: Playing time bars ────────────────────────────
  function playingTimeSVG(){
    const ROW_H=14,AX_H=18;
    const H=sorted.length*ROW_H+4;
    const svgH=H+AX_H;
    const fairX=xf(fairShare);

        +'<span style="font-size:9px;font-weight:700;color:#444;letter-spacing:.5px;text-transform:uppercase">Playing Time</span>'

// ── Save game report to localStorage ──
const REPORTS_KEY='squadmgr_reports_v1';
function saveGameReport(){
  const team=T.teams.find(t=>t.id===T.activeTeamId);
  const report={
    id: 'rep_'+Date.now(),
    savedAt: Date.now(),
    teamId: T.activeTeamId,
    teamName: team?(team.club+' '+(team.ageBracket||'')).trim():'Unknown',
    date: new Date().toLocaleDateString(),
    score: S.finalScore||{us:null,them:null},
    players: S.players.map(p=>({name:p.name,playTime:p.playTime,h1PlayTime:p.h1PlayTime,h2PlayTime:p.h2PlayTime,fouls:p.fouls})),
    subLog: S.subLog,
    gameSecs: S.gameTime,
    h1Dur: S.h1Dur, h2Dur: S.h2Dur,
    notes: ''
  };
  try{
    const raw=localStorage.getItem(REPORTS_KEY);
    const reports=raw?JSON.parse(raw):[];
    reports.unshift(report);
    // Keep last 20 reports
    if(reports.length>20) reports.length=20;
    localStorage.setItem(REPORTS_KEY,JSON.stringify(reports));
    showToast('Game report saved ✓ — view in ⚙ Settings → Game Reports');
  }catch(e){ showToast('Could not save: '+e.message); }
}

// ── Shared chart constants (all gameover charts use identical LP/RP so axes align) ──
const GO_LP=68, GO_RP=10;

function goGetMarkers(){
  var total=gameTotalSecs();
  if(usesQuarters()) return [
    {t:total*0.25,label:'Q1',major:false},
    {t:total*0.5, label:'HT',major:true},
    {t:total*0.75,label:'Q3',major:false},
    {t:total,     label:'FT',major:true},
  ];
  return [
    {t:total*0.5,label:'HT',major:true},
    {t:total,    label:'FT',major:true},
  ];
}

function goPeriodLinesSVG(xf,chartH,markers,showLabels){
  return markers.map(function(m){
    var x=xf(m.t);
    var stroke=m.major?'rgba(255,255,255,.38)':'rgba(255,255,255,.2)';
    var sw=m.major?1.5:1;
    var dash=m.major?'':' stroke-dasharray="4 3"';
    var lbl=showLabels?'<text x="'+(x-3)+'" y="11" text-anchor="end" fill="'+(m.major?'rgba(255,255,255,.5)':'rgba(255,255,255,.3)')+'" font-size="9" font-family="system-ui,sans-serif">'+m.label+'</text>':'';
    return '<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+chartH+'" stroke="'+stroke+'" stroke-width="'+sw+'"'+dash+'/>'+lbl;
  }).join('');
}

function goTimeAxisHTML(cw,markers,total){
  var ticks=[{t:0,major:false}].concat(markers);
  var out='<div style="position:relative;height:16px;margin-top:3px;">';
  ticks.forEach(function(m){
    var pct=(m.t/total)*100;
    var xpx='calc('+GO_LP+'px + '+pct+'% * ((100% - '+(GO_LP+GO_RP)+'px) / 100))';
    var anchor=m.t===0?'0':m.t===total?'-100%':'-50%';
    var col=m&&m.major?'#6b7280':'#4b5563';
    out+='<span style="position:absolute;left:'+xpx+';transform:translateX('+anchor+');font-size:9px;color:'+col+';white-space:nowrap;">'+fmt(m.t)+'</span>';
  });
  return out+'</div>';
}

function renderGameover(){
  const sorted=[...S.players].sort((a,b)=>b.playTime-a.playTime);
  const total=gameTotalSecs();
  const fairShare=Math.round(total*COURT_SIZE/Math.max(sorted.length,COURT_SIZE));
  const isQ=usesQuarters();
  const h1Label=isQ?'Q1+Q2':'H1'; const h2Label=isQ?'Q3+Q4':'H2';
  const markers=goGetMarkers();
  const trackedTotals=calcScoreTotals();
  const hasTracked=S.scoreLog&&S.scoreLog.length>0;

  // Pre-fill final score from tracker if not yet set
  if(hasTracked){
    if(S.finalScore.us===null) S.finalScore.us=trackedTotals.us;
    if(S.finalScore.them===null) S.finalScore.them=trackedTotals.them;
  }

  // ── Stats table ──────────────────────────────────────────────
  const rows=sorted.map(function(p){
    const fc=p.fouls>=5?'#ff5555':p.fouls>=3?'#ffcc00':'#eef0f8';
    const diff=p.playTime-fairShare;
    const diffStr=(diff>=0?'+':'')+Math.floor(Math.abs(diff)/60)+':'+(String(Math.abs(diff)%60).padStart(2,'0'));
    const diffC=diff>=0?'var(--green)':Math.abs(diff)>60?'var(--red)':'var(--warn)';
    return '<tr><td style="font-weight:700">'+p.name+'</td>'
      +'<td><span class="pt">'+fmt(p.h1PlayTime)+'</span></td>'
      +'<td><span class="pt">'+fmt(p.h2PlayTime)+'</span></td>'
      +'<td><span class="pt" style="color:#f08c00;font-size:15px">'+fmt(p.playTime)+'</span></td>'
      +'<td style="color:'+diffC+';font-size:11px">'+diffStr+'</td>'
      +'<td style="color:'+fc+';font-weight:'+(p.fouls>=3?700:400)+'">'+p.fouls+'</td></tr>';
  }).join('');

  // ── Sub log ──────────────────────────────────────────────────
  const logEntries=Array.from(S.subLog).map(function(e){
    const periodLabel=e.isHalftime?'🏀 HALF TIME':('H'+e.half+' · '+fmt(e.halfTime));
    const bgStyle=e.isHalftime?'background:rgba(255,204,0,.08);border-left:2px solid var(--warn);':'';
    return '<div class="log-entry" style="'+bgStyle+'">'
      +'<span class="log-time">'+fmt(e.gameTime)+'</span>'
      +'<span style="color:#7a80a0;margin-left:7px;font-size:9px">'+periodLabel+'</span>'
      +'<div style="margin-top:2px;font-size:10px">'
        +'<span style="color:#3ecf6e">▲ '+e.on.join(', ')+'</span>'
        +'<span style="color:#7a80a0;margin:0 5px">←</span>'
        +'<span style="color:#ff8c00">▼ '+e.off.join(', ')+'</span>'
      +'</div></div>';
  });
  const logHTML=S.subLog.length
    ?'<div class="log-title">SUBSTITUTION LOG · '+S.subLog.length+' sub'+(S.subLog.length!==1?'s':'')+'</div>'+logEntries.join('')
    :'';

  // ── Chart helpers ────────────────────────────────────────────
  const CW=320;
  const cw=CW-GO_LP-GO_RP;
  function xf(t){ return GO_LP+(Math.min(t,total)/total)*cw; }

  // ── Score differential chart ─────────────────────────────────
  const diffChartHTML=(function(){
    if(!hasTracked) return '';
    const diff=buildScoreDiff();
    const lTots=calcScoreTotals();
    const lead=lTots.us-lTots.them;
    const leadTxt=lead>0?'+'+lead+' US':lead<0?Math.abs(lead)+' THEM':'LEVEL';
    const leadCol=lead>0?'var(--green)':lead<0?'var(--red)':'var(--dim)';
    const BH=78;
    const zeroY=BH/2;
    const maxD=Math.max(6,Math.max.apply(null,diff.map(function(d){return Math.abs(d.d);})));
    const sc=(zeroY-5)/maxD;
    function yf(d){return Math.max(2,Math.min(BH-2,zeroY-d*sc));}

    var posA='M'+xf(0)+' '+zeroY, negA='M'+xf(0)+' '+zeroY;
    var line='M'+xf(diff[0].t)+' '+yf(diff[0].d);
    for(var i=1;i<diff.length;i++){
      var px=xf(diff[i-1].t), cx=xf(diff[i].t);
      var py=yf(diff[i-1].d), cy=yf(diff[i].d);
      posA+=' L'+px+' '+Math.min(zeroY,py)+' L'+cx+' '+Math.min(zeroY,cy);
      negA+=' L'+px+' '+Math.max(zeroY,py)+' L'+cx+' '+Math.max(zeroY,cy);
      line+=' L'+cx+' '+cy;
    }
    posA+=' L'+xf(diff[diff.length-1].t)+' '+zeroY+' Z';
    negA+=' L'+xf(diff[diff.length-1].t)+' '+zeroY+' Z';

    var yTicks='';
    for(var v=-Math.floor(maxD);v<=Math.floor(maxD);v+=2){
      if(v===0) continue;
      var ty=yf(v);
      if(ty>3&&ty<BH-1){
        yTicks+='<line x1="'+GO_LP+'" y1="'+ty+'" x2="'+(GO_LP+cw)+'" y2="'+ty+'" stroke="#1a1d2e" stroke-width="1"/>'
          +'<text x="'+(GO_LP-3)+'" y="'+(ty+3)+'" text-anchor="end" fill="#2d3040" font-size="8" font-family="system-ui">'+( v>0?'+'+v:v)+'</text>';
      }
    }

    return '<div style="background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 10px 4px;margin-top:10px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'
        +'<div style="font-family:Impact,sans-serif;font-size:9px;letter-spacing:2px;color:var(--dim);">SCORE DIFFERENTIAL</div>'
        +'<div style="font-family:Impact,sans-serif;font-size:12px;color:'+leadCol+'">Final: '+lTots.us+' \u2013 '+lTots.them+' ('+leadTxt+')</div>'
      +'</div>'
      +'<svg width="'+CW+'" height="'+BH+'" style="display:block;width:100%;max-width:'+CW+'px;">'
        +'<rect x="'+GO_LP+'" y="0" width="'+cw+'" height="'+BH+'" fill="var(--surface)" rx="3"/>'
        +yTicks
        +'<line x1="'+GO_LP+'" y1="'+zeroY+'" x2="'+(GO_LP+cw)+'" y2="'+zeroY+'" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>'
        +'<text x="'+(GO_LP-3)+'" y="'+(zeroY+3)+'" text-anchor="end" fill="#374151" font-size="8" font-family="system-ui">0</text>'
        +goPeriodLinesSVG(xf,BH,markers,true)
        +'<path d="'+posA+'" fill="rgba(46,168,75,.3)"/>'
        +'<path d="'+negA+'" fill="rgba(239,68,68,.3)"/>'
        +'<path d="'+line+'" stroke="#60a5fa" fill="none" stroke-width="2.5" stroke-linejoin="round"/>'
      +'</svg>'
      +goTimeAxisHTML(cw,markers,total)
      +'<div style="display:flex;gap:10px;margin-top:4px;font-size:9px;">'
        +'<span style="color:rgba(46,168,75,.8);">\u2588 Us ahead</span>'
        +'<span style="color:rgba(239,68,68,.8);">\u2588 Them ahead</span>'
        +'<span style="color:#60a5fa;">\u2501 differential</span>'
        +'<span style="color:var(--dim);">'+S.scoreLog.length+' events</span>'
      +'</div>'
    +'</div>';
  })();

  // ── Rotation timeline chart ──────────────────────────────────
  const rotChartHTML=(function(){
    if(!sorted.length) return '';
    const ROW_H=18;
    const BH=sorted.length*ROW_H+4;

    function playerStints(pname){
      const firstSub=S.subLog.find(function(e){return e.on.includes(pname)||e.off.includes(pname);});
      const pObj=S.players.find(function(p){return p.name===pname;});
      var startedOnCourt=firstSub?(firstSub.on.includes(pname)?false:true):(pObj?pObj.onCourt:false);
      var curState=startedOnCourt, curStart=0;
      const stints=[];
      S.subLog.forEach(function(sub){
        if(sub.isHalftime){
          const will=sub.on.includes(pname)?true:sub.off.includes(pname)?false:curState;
          if(will!==curState){stints.push({s:curStart,e:sub.gameTime,on:curState});curStart=sub.gameTime;curState=will;}
          return;
        }
        if(sub.on.includes(pname)&&!curState){stints.push({s:curStart,e:sub.gameTime,on:false});curStart=sub.gameTime;curState=true;}
        if(sub.off.includes(pname)&&curState){stints.push({s:curStart,e:sub.gameTime,on:true});curStart=sub.gameTime;curState=false;}
      });
      stints.push({s:curStart,e:S.gameTime,on:curState});
      return stints;
    }

    var rows='';
    sorted.forEach(function(p,pi){
      const rowY=pi*ROW_H+2;
      const stints=playerStints(p.name);
      var bars='';
      stints.forEach(function(s){
        if(!s.on) return;
        var lx=xf(s.s), rw=Math.max(1,xf(s.e)-xf(s.s));
        bars+='<rect x="'+lx+'" y="'+rowY+'" width="'+rw+'" height="'+(ROW_H-2)+'" fill="var(--green)" opacity=".82" rx="1"/>';
      });
      rows+='<text x="'+(GO_LP-3)+'" y="'+(rowY+ROW_H-4)+'" text-anchor="end" fill="#9ca3af" font-size="10" font-family="system-ui">'+p.name.split(' ')[0]+'</text>'
        +'<rect x="'+GO_LP+'" y="'+rowY+'" width="'+cw+'" height="'+(ROW_H-2)+'" fill="#161924" rx="1"/>'+bars;
    });

    return '<div style="background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 10px 4px;margin-top:10px;">'
      +'<div style="font-family:Impact,sans-serif;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:4px;">ROTATION TIMELINE</div>'
      +'<svg width="'+CW+'" height="'+BH+'" style="display:block;width:100%;max-width:'+CW+'px;">'
        +'<rect x="'+GO_LP+'" y="0" width="'+cw+'" height="'+BH+'" fill="var(--surface)" rx="3"/>'
        +goPeriodLinesSVG(xf,BH,markers,false)
        +rows
        +goPeriodLinesSVG(xf,BH,markers,false)
      +'</svg>'
      +goTimeAxisHTML(cw,markers,total)
    +'</div>';
  })();

  // ── Playing time bar chart ───────────────────────────────────
  const barChartHTML=(function(){
    const targetPct=(fairShare/total)*100;
    var bars='';
    sorted.forEach(function(p){
      const pct=Math.min(100,Math.round(p.playTime/total*100));
      const diff=p.playTime-fairShare;
      const col=p.playTime>=fairShare*0.9?'var(--green)':p.playTime>=fairShare*0.6?'var(--warn)':'var(--red)';
      const diffStr=(diff>=0?'+':'')+Math.floor(Math.abs(diff)/60)+':'+(String(Math.abs(diff)%60).padStart(2,'0'));
      var mLines='';
      markers.forEach(function(m){
        var mpct=(m.t/total)*100;
        mLines+='<div style="position:absolute;top:0;bottom:0;left:'+mpct+'%;width:'+(m.major?1.5:1)+'px;background:'+(m.major?'rgba(255,255,255,.4)':'rgba(255,255,255,.2)')+';z-index:2;"></div>';
      });
      bars+='<div style="display:flex;align-items:center;gap:0;margin-bottom:4px;">'
        +'<div style="width:'+(GO_LP-4)+'px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;padding-right:4px;flex-shrink:0;">'+p.name.split(' ')[0]+'</div>'
        +'<div style="width:'+cw+'px;flex-shrink:0;height:13px;background:var(--border);border-radius:3px;position:relative;overflow:hidden;">'
          +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:3px;"></div>'
          +'<div style="position:absolute;top:-1px;bottom:-1px;left:'+targetPct+'%;width:2px;background:rgba(255,255,255,.55);border-radius:1px;z-index:3;"></div>'
          +mLines
        +'</div>'
        +'<div style="width:'+GO_RP+'px;padding-left:4px;font-family:Impact,sans-serif;font-size:10px;color:'+col+';flex-shrink:0;">'+fmt(p.playTime)+'</div>'
        +'<div style="font-size:9px;color:'+(diff>=0?'var(--green)':'var(--red)')+';margin-left:3px;flex-shrink:0;">'+diffStr+'</div>'
      +'</div>';
    });
    return '<div style="background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px 10px 4px;margin-top:10px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;">'
        +'<div style="font-family:Impact,sans-serif;font-size:9px;letter-spacing:2px;color:var(--dim);">PLAYING TIME</div>'
        +'<div style="font-size:9px;color:var(--dim);">\u2503 fair share = '+fmt(fairShare)+'</div>'
      +'</div>'
      +bars
      +goTimeAxisHTML(cw,markers,total)
    +'</div>';
  })();

  $('app').innerHTML=`
<div class="go">
  <div class="go-hdr">
    <div class="go-title">FULL TIME</div>
    <div class="go-sub">${sorted.length} players · ${fmt(S.gameTime)} played</div>
    <div style="display:flex;align-items:flex-start;justify-content:center;gap:10px;margin-top:12px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
        <div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);">Us</div>
        <input id="score-us" type="number" min="0" max="999" value="${S.finalScore.us??''}" placeholder="—"
          style="width:62px;background:var(--card);border:1.5px solid var(--border);border-radius:8px;color:var(--green);font-family:Impact,sans-serif;font-size:28px;text-align:center;padding:6px 4px;outline:none;"
          oninput="S.finalScore.us=this.value===''?null:+this.value;saveState()">
        ${hasTracked?`<div style="font-size:9px;color:#374151;margin-top:2px;">tracked: <span style="color:#4b5563;font-family:Impact,sans-serif">${trackedTotals.us}</span></div>`:''}
      </div>
      <div style="font-family:Impact,sans-serif;font-size:24px;color:var(--dim);margin-top:14px;">:</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
        <div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);">Them</div>
        <input id="score-them" type="number" min="0" max="999" value="${S.finalScore.them??''}" placeholder="—"
          style="width:62px;background:var(--card);border:1.5px solid var(--border);border-radius:8px;color:var(--red);font-family:Impact,sans-serif;font-size:28px;text-align:center;padding:6px 4px;outline:none;"
          oninput="S.finalScore.them=this.value===''?null:+this.value;saveState()">
        ${hasTracked?`<div style="font-size:9px;color:#374151;margin-top:2px;">tracked: <span style="color:#4b5563;font-family:Impact,sans-serif">${trackedTotals.them}</span></div>`:''}
      </div>
    </div>
    ${hasTracked?`<div style="font-size:9px;color:#374151;margin-top:5px;text-align:center;">Edit score if tracker missed any points</div>`:''}
  </div>
  <div class="go-body">
    <table class="stats-tbl">
      <thead><tr><th>Player</th><th>${h1Label}</th><th>${h2Label}</th><th>Total</th><th>vs Fair</th><th>Fouls</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${diffChartHTML}
    ${rotChartHTML}
    ${barChartHTML}
    ${logHTML}
  </div>
  <div class="go-footer">
    <button class="exp-btn" onclick="exportReport()">⬆ TXT</button>
    <button class="exp-btn" onclick="exportGamePDF()" style="background:rgba(74,158,255,.15);border-color:rgba(74,158,255,.3);color:var(--blue);">📄 PDF</button>
    <button class="exp-btn" onclick="saveGameReport()" style="background:rgba(62,207,110,.1);border-color:rgba(62,207,110,.3);color:var(--green);">💾 SAVE</button>
    <button class="exp-btn" onclick="uploadToClaudeModal()" style="background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.3);color:var(--purple);">🤖 CLAUDE</button>
    <button class="new-btn" onclick="newGame()">NEW GAME</button>
  </div>
</div>`;
}

  { label: 'Physical', fields: [

    { key:'position',  label:'Primary Position',            type:'select', options:['1 – Point Guard','2 – Shooting Guard','3 – Small Forward','4 – Power Forward','5 – Centre'] },
    { key:'position2', label:'1st Alternate Position',      type:'select', options:['None','1 – Point Guard','2 – Shooting Guard','3 – Small Forward','4 – Power Forward','5 – Centre'] },
    { key:'position3', label:'2nd Alternate Position',      type:'select', options:['None','1 – Point Guard','2 – Shooting Guard','3 – Small Forward','4 – Power Forward','5 – Centre'] },
    { key:'speed',     label:'Speed on Court',              type:'slider' },
    { key:'energy',    label:'Energy on Court',             type:'slider' },

  ]},
  { label: 'Shooting', fields: [
    { key:'layup',     label:'Lay-Ups',            type:'slider' },
    { key:'jumpshot',  label:'Jump Shots',         type:'slider' },
    { key:'three',     label:'3-Point Shots',      type:'slider' },
    { key:'foulshot',  label:'Foul Shots',         type:'slider' },
  ]},

    { key:'passing',   label:'Passing Ability',    type:'slider' },

    { key:'offdef',    label:'Offence-to-Defence Transition', type:'slider' },
  ]},
  { label: 'Rebounding', fields: [

    { key:'rebdef',    label:'Rebound & Box-Out Defence', type:'slider' },
  ]},
  { label: 'Court IQ', fields: [

    { key:'composure', label:'Composure Under Pressure', type:'slider' },

];

const RATINGS_KEY = 'squadmgr_ratings_v1';
let ratingsStore = {}; // { teamId_playerId: { key: value, ... } }

function saveRatings(){
  try{ localStorage.setItem(RATINGS_KEY, JSON.stringify(ratingsStore)); }catch(_){}
}
function loadRatings(){
  try{
    const raw = localStorage.getItem(RATINGS_KEY);
    if(raw) ratingsStore = JSON.parse(raw)||{};
  }catch(_){}
}
function ratingKey(teamId, playerId){ return `${teamId}_${playerId}`; }
function getPlayerRatings(teamId, playerId){
  return ratingsStore[ratingKey(teamId,playerId)] || {};
}
function setPlayerRating(teamId, playerId, field, value){
  const k = ratingKey(teamId,playerId);
  if(!ratingsStore[k]) ratingsStore[k]={};
  ratingsStore[k][field] = value;
  saveRatings();
}

// Ratings edit screen state
let R = { teamId: null, playerId: null, draft: {} };

function openRatings(teamId, playerId){
  R.teamId = teamId;
  R.playerId = playerId;
  const existing = getPlayerRatings(teamId, playerId);
  // Pre-fill defaults for every field so they're saved even if user doesn't touch them
  const defaults = {};
  RATING_GROUPS.forEach(g => g.fields.forEach(f => {
    defaults[f.key] = f.type === 'select' ? 0 : 5;
  }));
  R.draft = {...defaults, ...existing};
  S.phase = 'ratings';
  render();
}

function renderRatings(){
  const team = T.teams.find(t=>t.id===R.teamId);
  const player = team && team.players.find(p=>p.id===R.playerId);
  if(!team||!player){ S.phase='teamEdit'; render(); return; }

  const groupsHTML = RATING_GROUPS.map(g=>{
    const fieldsHTML = g.fields.map(f=>{
      const val = R.draft[f.key] !== undefined ? R.draft[f.key] : (f.type==='select'?f.options[0]:5);
      if(f.type==='select'){
        const opts = f.options.map((o,i)=>`<option value="${i}"${val==i?' selected':''}>${o}</option>`).join('');
        return `<div class="rat-row">
          <span class="rat-lbl">${f.label}</span>
          <select class="rat-select" onchange="R.draft['${f.key}']=parseInt(this.value)">${opts}</select>
        </div>`;
      }
      // slider 0-10
      const numVal = typeof val==='number' ? val : 5;
      const col = numVal>=8?'var(--green)':numVal>=5?'var(--warn)':'var(--red)';
      return `<div class="rat-row">
        <span class="rat-lbl">${f.label}</span>
        <input type="range" min="0" max="10" value="${numVal}" class="rat-slider"
          oninput="R.draft['${f.key}']=parseInt(this.value);this.nextElementSibling.textContent=this.value;this.nextElementSibling.style.color=this.value>=8?'var(--green)':this.value>=5?'var(--warn)':'var(--red)'">
        <span class="rat-val" style="color:${col}">${numVal}</span>
      </div>`;
    }).join('');
    return `<div class="rat-group">
      <div class="rat-group-hdr">${g.label}</div>
      ${fieldsHTML}
    </div>`;
  }).join('');

  $('app').innerHTML=`
<div class="ratings-screen">
  <div class="ratings-hdr">
    <button class="tm-back" onclick="T.editingTeam=T.teams.find(t=>t.id===R.teamId);T.editingPlayerId=null;S.phase='teamEdit';render()">←</button>
    <div>
      <div class="ratings-player-name">${player.nickname||player.firstName} #${player.singletNumber}</div>
      <div style="font-size:11px;color:var(--dim)">${player.firstName} ${player.lastName} · ${team.club}</div>
    </div>
  </div>
  <div class="ratings-body">
    <div style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5;">Rate each attribute 0–10. These ratings are used by the AI to generate optimal rotation plans.</div>
    ${groupsHTML}
    <button class="rat-save-btn" onclick="saveRatings_player()">SAVE RATINGS</button>
  </div>
</div>`;
}

function saveRatings_player(){
  Object.entries(R.draft).forEach(([k,v])=>setPlayerRating(R.teamId, R.playerId, k, v));
  showToast('Ratings saved ✓');
  T.editingTeam = T.teams.find(t=>t.id===R.teamId);
  T.editingPlayerId = null;
  S.phase = 'teamEdit';
  render();
}


function render(){
  stopTick();
  if(S.phase==='setup')         renderSetup(true);
  else if(S.phase==='teamList') renderTeamList();
  else if(S.phase==='teamEdit') renderTeamEdit();
  else if(S.phase==='settings') renderSettings();
  else if(S.phase==='ratings')  renderRatings();
  else if(S.phase==='halftime') renderHalftime();
  else if(S.phase==='q1break'||S.phase==='q3break') renderQuarterBreak();
  else if(S.phase==='gameover') renderGameover();
  else renderGame();
}

// ── Confirmation Modal ──
function showConfirm({title, body, okLabel, okClass, onOk}){
  const el=$('confirm-modal');
  el.innerHTML=`
<div class="confirm-backdrop" onclick="hideConfirm()">
  <div class="confirm-box" onclick="event.stopPropagation()">
    <div class="confirm-title ${okClass}">${title}</div>
    <div class="confirm-body">${body}</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="hideConfirm()">CANCEL</button>
      <button class="confirm-ok ${okClass}" id="confirm-ok-btn">${okLabel}</button>
    </div>
  </div>
</div>`;
  el.style.display='block';
  $('confirm-ok-btn').onclick=()=>{ hideConfirm(); onOk(); };
}
function hideConfirm(){ $('confirm-modal').style.display='none'; $('confirm-modal').innerHTML=''; }

function confirmEndHalf(){
  // Work out which period we're ending for the label
  var label;
  if(usesQuarters()){
    if(S.phase==='h1') label = S.q1BreakDone ? 'Q2' : 'Q1';
    else               label = 'Q3'; // H2+!q3BreakDone; Q4 uses confirmEndGame
  } else {
    label = 'HALF';
  }
  var dest = (usesQuarters() && ((S.phase==='h1'&&!S.q1BreakDone)||(S.phase==='h2'&&!S.q3BreakDone)))
    ? 'quarter break' : 'halftime';

  // If the alert is already showing the end signal, skip confirm and act immediately
  if(S.alertState==='quartend'||S.alertState==='halfend'){
    endHalf(); return;
  }
  showConfirm({
    title:'END '+label+'?', okClass:'warn',
    body:'Game time: <strong>'+fmt(S.gameTime)+'</strong><br>This will take you to the '+dest+' screen.',
    okLabel:'END '+label,
    onOk: endHalf
  });
}
function confirmEndGame(){
  showConfirm({
    title:'END GAME?', okClass:'danger',
    body:`Game time: <strong>${fmt(S.gameTime)}</strong><br><br>This will end the game and show the final report. You cannot undo this.`,
    okLabel:'END GAME',
    onOk: endGame
  });
}

function toggleTeamPlayerChip(playerId){
  const team=T.teams.find(t=>t.id===T.activeTeamId);
  if(!team) return;
  const p=team.players.find(x=>x.id===playerId);
  if(!p) return;
  const dn=playerDisplayName(p);

  if(idx!==-1){
    S.names.splice(idx,1);
  } else {
    const emptyIdx=S.names.findIndex(n=>!n.trim());
    if(emptyIdx!==-1) S.names[emptyIdx]=dn;
    else S.names.push(dn);

}

function exportSubPlan(){
  if(!S.useSubPlan||(S.subPlan.h1.length===0&&S.subPlan.h2.length===0)){
    alert('No pre-planned subs to export. Build a sub plan first.');
    return;
  }
  // Serialise: convert Sets to arrays
  const toArr = half => (half||[]).map(sub=>({
    off:[...sub.off], on:[...sub.on], atTime:sub.atTime||null
  }));
  const data = {
    version:1,
    exported: new Date().toISOString(),
    names: S.names.filter(n=>n.trim()),
    h1Dur:S.h1Dur, h2Dur:S.h2Dur, h1Int:S.h1Int, h2Int:S.h2Int,
    h1Sps:S.h1Sps, h2Sps:S.h2Sps,
    h1:toArr(S.subPlan.h1), h2:toArr(S.subPlan.h2),
    h2PresetIds: S.useH2Preset ? [...S.h2PresetIds] : null,
    finalPresetIds: S.useFinalPreset ? [...S.finalPresetIds] : null,
    priorityPlayerIds: [...S.priorityPlayerIds]
  };
  const json = JSON.stringify(data, null, 2);
  const date = new Date().toISOString().slice(0,10);
  const fname = 'squad-sub-plan-'+date+'.json';
  if(navigator.share && navigator.canShare({files:[new File([json],'x.json',{type:'application/json'})]})){
    const file = new File([json],fname,{type:'application/json'});
    navigator.share({files:[file],title:'Sub Plan'}).catch(()=>{});
  } else {
    const a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,'+encodeURIComponent(json);
    a.download = fname;
    a.click();
  }
}

function importSubPlan(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,.txt';
  inp.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try {
        const data = JSON.parse(ev.target.result);
        if(!data.h1||!data.h2) throw new Error('Not a valid sub plan file');
        const fromArr = half => half.map(sub=>({
          off:new Set(sub.off||[]), on:new Set(sub.on||[]), atTime:sub.atTime||null
        }));
        S.subPlan = { h1:fromArr(data.h1), h2:fromArr(data.h2) };
        S.useSubPlan = true;
        if(data.h1Int) S.h1Int=data.h1Int;
        if(data.h2Int) S.h2Int=data.h2Int;
        if(data.h2PresetIds){ S.h2PresetIds=new Set(data.h2PresetIds); S.useH2Preset=true; }
        if(data.finalPresetIds){ S.finalPresetIds=new Set(data.finalPresetIds); S.useFinalPreset=true; }
        if(data.priorityPlayerIds) S.priorityPlayerIds=new Set(data.priorityPlayerIds);
        saveState();
        renderSetup(true);
        showToast('Sub plan imported ✓');
      } catch(err){ alert('Could not load sub plan: '+err.message); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

const SAVE_KEY = 'squadmgr_v1';
const AUTOSAVE_KEY = 'squadmgr_autosave_v1'; // mid-game crash recovery snapshot

function stateToJSON(){
  // Sets aren't JSON-serialisable, convert to arrays
  return JSON.stringify({
    phase: S.phase,
    names: S.names,
    opponent: S.opponent||'',
    h1Dur:S.h1Dur, h2Dur:S.h2Dur,
    h1Int:S.h1Int, h2Int:S.h2Int,
    h1Sps:S.h1Sps, h2Sps:S.h2Sps,
    useH2Preset: S.useH2Preset,
    h2PresetIds: [...S.h2PresetIds],
    useFinalPreset: S.useFinalPreset,
    finalPresetIds: [...S.finalPresetIds],
    useSubPlan: S.useSubPlan,
    showRecommended: S.showRecommended,
    showPlanned: S.showPlanned,
    priorityPlayerIds: [...S.priorityPlayerIds],
    finalScore: S.finalScore||{us:null,them:null},
    subPlan: {
      h1: (S.subPlan.h1||[]).map(s=>s?{off:[...s.off],on:[...s.on],atTime:s.atTime||null}:null),
      h2: (S.subPlan.h2||[]).map(s=>s?{off:[...s.off],on:[...s.on],atTime:s.atTime||null}:null),
    },
    planSubIdx: S.planSubIdx,
    players: S.players,
    gameTime: S.gameTime,
    halfTime: S.halfTime,
    subCountdown: S.subCountdown,
    alertState: S.alertState,
    subLog: S.subLog,
    scoreLog: S.scoreLog||[],
    gamePositions: S.gamePositions||{},
    manualPositions: S.manualPositions||{},
    q1BreakDone: S.q1BreakDone||false,
    q3BreakDone: S.q3BreakDone||false,
  });
}

function saveState(){
  try { localStorage.setItem(SAVE_KEY, stateToJSON()); } catch(_){}
}

function loadStateFromData(d){
  if(!d||!d.players) return;
  try {

    if(!d||!d.players) return;

    S.phase = d.phase||'setup';
    S.names = d.names||['','','','',''];
    S.opponent = d.opponent||'';
    S.h1Dur=d.h1Dur||20; S.h2Dur=d.h2Dur||20;
    // Migrate: old saves stored minutes (e.g. 3), new stores seconds (e.g. 180)
    S.h1Int=d.h1Int>60?d.h1Int:(d.h1Int||3)*60;
    S.h2Int=d.h2Int>60?d.h2Int:(d.h2Int||3)*60;
    S.h1Sps=d.h1Sps||2;  S.h2Sps=d.h2Sps||2;
    S.useH2Preset=d.useH2Preset||false;
    S.h2PresetIds=new Set(d.h2PresetIds||[]);
    S.useFinalPreset=d.useFinalPreset||false;
    S.finalPresetIds=new Set(d.finalPresetIds||[]);
    S.useSubPlan=d.useSubPlan||false;
    S.showRecommended=d.showRecommended!==false;
    S.showPlanned=d.showPlanned!==false;
    S.priorityPlayerIds=new Set(d.priorityPlayerIds||[]);
    S.finalScore=d.finalScore||{us:null,them:null};
    S.planSubIdx=d.planSubIdx||0;
    S.subPlan={
      h1: (d.subPlan&&d.subPlan.h1||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on)}:null),
      h2: (d.subPlan&&d.subPlan.h2||[]).map(s=>s?{off:new Set(s.off),on:new Set(s.on)}:null),
    };
    S.players=d.players||[];
    S.gameTime=d.gameTime||0;
    S.halfTime=d.halfTime||0;
    S.subCountdown=d.subCountdown||0;
    S.alertState=d.alertState||null;
    prevAlert=d.alertState||null;
    S.subLog=d.subLog||[];
    S.scoreLog=d.scoreLog||[];
    S.gamePositions=d.gamePositions||{};
    S.manualPositions=d.manualPositions||{};
    S.q1BreakDone=d.q1BreakDone||false;
    S.q3BreakDone=d.q3BreakDone||false;
    S.isRunning=false; // never auto-resume
    S.selCourt=new Set();
    S.selBench=new Set();
    S.htOnCourt=new Set();

    // If we were mid-game, surface the continue button
    if(['h1','h2','halftime'].includes(S.phase)){
      S.savedGame={
        phase:S.phase, players:S.players, gameTime:S.gameTime,
        halfTime:S.halfTime, subCountdown:S.subCountdown,
        alertState:S.alertState, h1Dur:S.h1Dur, h2Dur:S.h2Dur,
        h1Int:S.h1Int, h2Int:S.h2Int, h1Sps:S.h1Sps, h2Sps:S.h2Sps,
        subLog:S.subLog,
      };
      S.phase='setup';
    }
  } catch(_){}
}

function loadState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    loadStateFromData(d);
  } catch(_){}
}

// ── Auto-save: every 5s for normal state, every 30s for crash-recovery snapshot ──
let autoSaveTimer = null;
let autosaveSnapTimer = null;

function startAutoSave(){
  if(autoSaveTimer) return;
  autoSaveTimer = setInterval(saveState, 5000);
  // Also write a crash-recovery snapshot every 30 seconds during live game
  autosaveSnapTimer = setInterval(writeCrashSnapshot, 30000);
}

function stopAutoSave(){
  clearInterval(autoSaveTimer); autoSaveTimer = null;
  clearInterval(autosaveSnapTimer); autosaveSnapTimer = null;
}

function writeCrashSnapshot(){
  // Only snapshot during an active game (not setup/gameover)
  if(S.phase !== 'h1' && S.phase !== 'h2') return;
  try{
    const snap = {
      savedAt: Date.now(),
      gameTime: S.gameTime,
      halfTime: S.halfTime,
      phase: S.phase,
      state: stateToJSON()  // full state JSON
    };
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(snap));
  }catch(_){}
}

function clearCrashSnapshot(){
  try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(_){}
}

function checkCrashSnapshot(){
  // Called on startup — look for an unfinished game from a previous session
  try{
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return;
    const snap = JSON.parse(raw);
    if(!snap || !snap.savedAt || !snap.state) return;

    // Only offer restore if snapshot is less than 12 hours old
    const ageHours = (Date.now() - snap.savedAt) / 3600000;
    if(ageHours > 12){ clearCrashSnapshot(); return; }

    // Only offer if the snapshot was mid-game (not setup/gameover)
    const snapPhase = snap.phase;
    if(snapPhase !== 'h1' && snapPhase !== 'h2'){ clearCrashSnapshot(); return; }

    // Don't offer if we're already mid-game (user intentionally resumed)
    if(S.phase === 'h1' || S.phase === 'h2') return;

    // Format the time for the prompt
    const savedDate = new Date(snap.savedAt);
    const timeStr = savedDate.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const elapsed = Math.floor(snap.gameTime / 60) + ':' + String(snap.gameTime % 60).padStart(2,'0');
    const halfLabel = snapPhase === 'h2' ? '2nd half' : '1st half';

    showRestorePrompt(snap, timeStr, elapsed, halfLabel);
  }catch(_){ clearCrashSnapshot(); }
}

function showRestorePrompt(snap, timeStr, elapsed, halfLabel){
  // Create a non-blocking prompt overlay
  const overlay = document.createElement('div');
  overlay.id = 'restore-prompt';
  overlay.style.cssText = [
    'position:fixed','inset:0','background:rgba(0,0,0,.85)',
    'z-index:10000','display:flex','align-items:center','justify-content:center',
    'padding:24px','font-family:-apple-system,sans-serif'
  ].join(';');

  overlay.innerHTML =
    '<div style="background:#1a1e2a;border:1.5px solid #f08c00;border-radius:18px;padding:28px 24px;max-width:340px;width:100%;text-align:center;">' +
      '<div style="font-size:36px;margin-bottom:12px;">🏀</div>' +
      '<div style="font-family:Impact,sans-serif;font-size:22px;letter-spacing:2px;color:#f08c00;margin-bottom:8px;">GAME IN PROGRESS</div>' +
      '<div style="font-size:13px;color:#eef0f8;margin-bottom:6px;">An unfinished game was found from <strong>' + timeStr + '</strong></div>' +
      '<div style="font-size:12px;color:#7a80a0;margin-bottom:24px;">Game clock was at <strong style="color:#eef0f8">' + elapsed + '</strong> in the <strong style="color:#eef0f8">' + halfLabel + '</strong></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px;">' +
        '<button onclick="restoreGame()" style="background:#f08c00;color:#111;border:none;border-radius:12px;padding:15px;font-family:Impact,sans-serif;font-size:18px;letter-spacing:1px;cursor:pointer;">▶ RESTORE GAME</button>' +
        '<button onclick="discardSnapshot()" style="background:none;border:1.5px solid #2e3350;color:#7a80a0;border-radius:12px;padding:13px;font-size:14px;cursor:pointer;">✕ Start Fresh</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(overlay);
  window._pendingSnap = snap;
}

function restoreGame(){
  const overlay = document.getElementById('restore-prompt');
  if(overlay) overlay.remove();
  if(!window._pendingSnap) return;
  try{
    const d = JSON.parse(window._pendingSnap.state);
    // Restore full state using existing loadState logic
    loadStateFromData(d);
    S.isRunning = false;  // always start paused after restore
    S.isClockRunning = false;
    render();
    showToast('Game restored — tap ▶ RESUME to continue');
    startAutoSave(); // resume autosave
  }catch(e){
    showToast('Could not restore game — starting fresh');
    discardSnapshot();
  }
  window._pendingSnap = null;
}

function discardSnapshot(){
  const overlay = document.getElementById('restore-prompt');
  if(overlay) overlay.remove();
  clearCrashSnapshot();
  window._pendingSnap = null;
}

// ═══════════════════════════════════════════
// INSTALL BANNER
// ═══════════════════════════════════════════
function dismissBanner(persist){
  document.getElementById('install-banner').style.display='none';
  if(persist) try{ localStorage.setItem('sqm_installed','1'); }catch(_){}
}

function maybeShowBanner(){
  // Don't show if already in standalone mode or dismissed before
  const standalone = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;
  if(standalone) return;
  try{ if(localStorage.getItem('sqm_installed')) return; }catch(_){}
  // Only show in Safari on iOS
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!isIOS) return;
  setTimeout(()=>{ document.getElementById('install-banner').style.display='block'; }, 2500);
}

// ═══════════════════════════════════════════
// SERVICE WORKER — Network-first with version-based cache busting
// ═══════════════════════════════════════════
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol === 'file:') return;

  // Network-first strategy: always try to fetch fresh, fall back to cache.
  // When a new version is detected (CACHE name changes), old cache is deleted.
  const swCode = `
const CACHE_NAME = 'squadmgr-${version}';

// Install: skip waiting immediately so new SW takes over right away
self.addEventListener('install', e => {
  e.waitUntil(self.skipWaiting());
});

// Activate: delete ALL old caches, claim all clients immediately
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys => Promise.all(
      keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))
    )).then(() => self.clients.claim())
  );
});

// Fetch: NETWORK-FIRST. Always try network; only fall back to cache if offline.
// This ensures fresh code is always served when online.
self.addEventListener('fetch', e => {
  if(e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request).then(networkResp => {
      // Cache successful responses
      if(networkResp && networkResp.status === 200){
        caches.open(CACHE_NAME).then(cache => cache.put(e.request, networkResp.clone()));
      }
      return networkResp;
    }).catch(() =>
      // Offline: serve from cache
      caches.match(e.request).then(cached =>
        cached || new Response(
          '<html><body style="font-family:sans-serif;text-align:center;padding:40px"><h2>Squad Manager</h2><p>Offline — connect to internet and reload.</p></body></html>',
          {headers:{'Content-Type':'text/html'}}
        )
      )
    )
  );
});

// Listen for skip-waiting message
self.addEventListener('message', e => {
  if(e.data === 'skipWaiting') self.skipWaiting();
});
`;
  try{
    const blob = new Blob([swCode], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(()=>{});
  }catch(_){}
}

// ── Version check against GitHub ──
// Fetches version.txt from the hosting URL and compares to APP_VERSION.
// Shows a banner if a newer version is available.
const VERSION_URL = 'https://transitdork.github.io/squadmanager/version.txt';

async function checkForUpdate(){
  if(!navigator.onLine) return; // skip if offline
  try{
    const resp = await fetch(VERSION_URL + '?t=' + Date.now(), {cache:'no-store'});
    if(!resp.ok) return;
    const remote = (await resp.text()).trim();
    if(remote && remote !== APP_VERSION){
      showUpdateBanner(remote);
    }
  }catch(_){} // silently fail — no network, wrong URL, etc.
}

function showUpdateBanner(remoteVersion){
  if(document.getElementById('sw-update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'sw-update-banner';
  banner.style.cssText = [
    'position:fixed',
    'bottom:calc(env(safe-area-inset-bottom,0px) + 10px)',
    'left:12px','right:12px',
    'background:#1a1e2a',
    'border:1.5px solid #f08c00',
    'border-radius:14px',
    'padding:12px 14px',
    'display:flex','align-items:center','justify-content:space-between','gap:10px',
    'z-index:9999',
    'box-shadow:0 4px 24px rgba(0,0,0,.6)',
  ].join(';');
  banner.innerHTML =
    '<div>' +
      '<div style="font-size:13px;font-weight:700;color:#eef0f8;margin-bottom:2px;">🆕 Update available</div>' +
      '<div style="font-size:10px;color:#7a80a0;">Running v' + APP_VERSION + ' · New: v' + (remoteVersion||'?') + '</div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;">' +
      '<button onclick="applyUpdate()" style="background:#f08c00;color:#111;border:none;border-radius:9px;padding:9px 14px;font-family:Impact,sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;white-space:nowrap;">UPDATE</button>' +
      '<button onclick="this.parentElement.parentElement.remove()" style="background:none;border:1.5px solid #2e3350;color:#7a80a0;border-radius:9px;padding:9px 12px;font-size:13px;cursor:pointer;">✕</button>' +
    '</div>';
  document.body.appendChild(banner);
}

function applyUpdate(){
  // Safari ignores location.reload(true) for PWA cache.
  // Redirect to the same URL with a version query string to force a fresh fetch.
  const url = location.href.split('?')[0].split('#')[0];
  location.replace(url + '?v=' + APP_VERSION + '&t=' + Date.now());
}

// ═══════════════════════════════════════════
// WHITE SCREEN WATCHDOG
// ═══════════════════════════════════════════
// If the app hasn't rendered visible content within 4 seconds, show recovery UI
function startWatchdog(){
  const TIMEOUT = 4000;
  const timer = setTimeout(() => {
    const app = document.getElementById('app');
    const hasContent = app && app.innerHTML.trim().length > 50;
    if(!hasContent) showRecoveryScreen();
  }, TIMEOUT);
  // Cancel watchdog once app renders successfully
  const obs = new MutationObserver((muts) => {
    const app = document.getElementById('app');
    if(app && app.innerHTML.trim().length > 50){
      clearTimeout(timer);
      obs.disconnect();
    }
  });
  obs.observe(document.getElementById('app') || document.body, {childList:true, subtree:true});
}

function showRecoveryScreen(){
  document.body.style.background = '#0f1117';
  document.getElementById('app').innerHTML = `
    <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:-apple-system,sans-serif;">
      <div style="font-size:48px;margin-bottom:16px;">🏀</div>
      <div style="font-family:Impact,sans-serif;font-size:28px;letter-spacing:3px;color:#f08c00;margin-bottom:8px;">SQUAD MANAGER</div>
      <div style="font-size:14px;color:#7a80a0;margin-bottom:32px;">Something went wrong on startup</div>

      <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;">
        <button onclick="recoverClearState()" style="background:#f08c00;color:#111;border:none;border-radius:12px;padding:16px;font-family:Impact,sans-serif;font-size:18px;letter-spacing:1px;cursor:pointer;">
          ↺ RESET GAME STATE
        </button>
        <div style="font-size:11px;color:#7a80a0;margin:-4px 0 8px;">Clears current game only. Keeps your teams, ratings and saved plans.</div>

        <button onclick="recoverClearAll()" style="background:rgba(255,85,85,.15);color:#ff5555;border:1.5px solid rgba(255,85,85,.3);border-radius:12px;padding:14px;font-family:Impact,sans-serif;font-size:16px;letter-spacing:1px;cursor:pointer;">
          ⟳ FULL RESET
        </button>
        <div style="font-size:11px;color:#7a80a0;margin:-4px 0 8px;">Clears everything including teams. Use only if Reset Game State didn't work.</div>

        <button onclick="location.reload(true)" style="background:none;color:#4a9eff;border:1.5px solid rgba(74,158,255,.3);border-radius:12px;padding:14px;font-size:14px;cursor:pointer;">
          ⟳ Reload without resetting
        </button>
      </div>

      <div style="margin-top:32px;font-size:10px;color:#4a4e5a;">v${APP_VERSION}</div>
    </div>`;
}

function recoverClearState(){
  try{ localStorage.removeItem('squadmgr_v1'); }catch(_){}
  const url = location.href.split('?')[0].split('#')[0];
  location.replace(url + '?v=' + APP_VERSION + '&t=' + Date.now());
}

function recoverClearAll(){
  if(!confirm('This will delete ALL data including teams and ratings. Are you sure?')) return;
  try{ localStorage.clear(); }catch(_){}
  const url = location.href.split('?')[0].split('#')[0];
  location.replace(url + '?v=' + APP_VERSION + '&t=' + Date.now());
}

loadSettings();
loadTeams();
loadPlans();
loadRatings();
loadState();
startWatchdog(); // start before render so it can detect failures
render();
checkCrashSnapshot(); // offer to restore mid-game crash after render
maybeShowBanner();
registerSW();

setTimeout(checkForUpdate, 3000);
// Also check when app becomes visible again (e.g. switching back from another app)
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') setTimeout(checkForUpdate, 1000);
});
